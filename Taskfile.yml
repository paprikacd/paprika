version: '3'

vars:
  DEFAULT_IMG: ghcr.io/paprikacd/paprika:latest

  # Local perf/profiling stack (task perf:*). All overridable via env or
  # CLI vars; PERF_* names avoid colliding with the e2e suite's KIND_CLUSTER.
  PERF_CLUSTER: '{{.PERF_CLUSTER | default "paprika-perf"}}'
  PERF_NS: '{{.PERF_NS | default "paprika-perf"}}'
  PERF_RELEASE: '{{.PERF_RELEASE | default "paprika"}}'
  PERF_IMG: '{{.PERF_IMG | default "localhost/paprika-perf:latest"}}'
  PERF_PORT: '{{.PERF_PORT | default "13100"}}'
  PERF_MGR_PORT: '{{.PERF_MGR_PORT | default "18443"}}'
  PERF_API_METRICS_PORT: '{{.PERF_API_METRICS_PORT | default "18444"}}'
  PERF_PPROF_PORT: '{{.PERF_PPROF_PORT | default "16060"}}'
  PERF_TOKEN_FILE: '{{.PERF_TOKEN_FILE | default "/tmp/paprika-perf-token"}}'
  PERF_OUT_DIR: '{{.PERF_OUT_DIR | default "/tmp/paprika-perf"}}'
  PERF_MS_VERSION: '{{.METRICS_SERVER_VERSION | default "v0.8.0"}}'
  # Observability-gateway perf knobs (perf:obs-*): the gateway's forwarded
  # /observe port, the seeded mock provider namespace, and its pprof port.
  PERF_OBS_PORT: '{{.PERF_OBS_PORT | default "18090"}}'
  PERF_OBS_PPROF_PORT: '{{.PERF_OBS_PPROF_PORT | default "16090"}}'
  PERF_OBS_NS: '{{.PERF_OBS_NS | default "observability"}}'

  # Literal template-brace emitters for tasks that write Helm template
  # syntax (Task interpolates {{ }} in cmds, so braces must be built).
  TLO: '{{"{{"}}'
  TLC: '{{"}}"}}'

tasks:
  default:
    silent: true
    cmds:
      - task --list

  build:
    desc: Build the Paprika CLI to bin/paprika.
    cmds:
      - make build-cli

  build:all:
    desc: Build the CLI, embedded UI, and server.
    cmds:
      - make build-cli build-with-ui

  install:
    desc: Install the Paprika CLI from source.
    cmds:
      - go install ./cmd/paprika

  test:
    desc: Run Go tests.
    cmds:
      - make test

  test:race:
    desc: Run Go tests with the race detector.
    cmds:
      - make test-race

  test:e2e:
    desc: Run the Kind end-to-end test suite.
    cmds:
      - make test-e2e

  lint:
    desc: Run Go and UI linters.
    cmds:
      - make lint
      - task: ui:lint

  check:
    desc: Run generation, tests, and linters.
    cmds:
      - task: generate
      - task: test
      - task: lint

  generate:
    desc: Run project code generation.
    cmds:
      - make generate

  ui:dev:
    desc: Run the UI development server.
    cmds:
      - npm run dev
    dir: ui

  ui:lint:
    internal: true
    cmds:
      - npm run lint
    dir: ui

  ui:test:
    desc: Run UI tests.
    cmds:
      - npm run test
    dir: ui

  ui:build:
    desc: Build the UI.
    cmds:
      - npm run build
    dir: ui

  insights:lab:
    desc: Start the Insights design playground (next dev + harness) and print one browser link.
    cmds:
      - npm run insights:lab
    dir: ui

  docker:build:
    desc: Build the container image.
    env:
      IMG: '{{.IMG | default .DEFAULT_IMG}}'
    cmds:
      - make docker-build

  clean:
    desc: Remove local build and test output.
    cmds:
      - |
        for path in bin .goreleaser-dist ui ui/out ui/coverage; do
          if [ -L "$path" ]; then
            echo "clean: refusing symlinked path: $path" >&2
            exit 1
          fi
        done
        rm -rf bin/paprika cover.out coverage.out .goreleaser-dist ui/out ui/coverage

  # --- Local perf / profiling stack (kind) ---
  #
  # Full split-mode deploy on an isolated kind cluster: controller-manager,
  # api-server (MCP + basic auth admin/admin123, pprof on 127.0.0.1:6060),
  # repo-server, webhook-receiver, redis, metrics-server. Ports are
  # deliberately distinct from the e2e suite.
  #
  #   task perf:up                        # create cluster, build+load image, helm install
  #   task perf:token                     # mint MCP OAuth token -> $PERF_TOKEN_FILE
  #   task perf:load SECS=120             # MCP read-tool loadgen for 120s
  #   task perf:profile SECS=30 COMPONENT=api   # pprof capture (api|manager) -> $PERF_OUT_DIR
  #   task perf:metrics                   # snapshot paprika_* metrics -> $PERF_OUT_DIR
  #   task perf:status                    # fleet_status + list_clusters via MCP
  #   task perf:down                      # delete the kind cluster
  #
  # Knobs (env or CLI vars): PERF_CLUSTER, PERF_NS, PERF_RELEASE, PERF_IMG,
  # PERF_PORT, PERF_MGR_PORT, PERF_API_METRICS_PORT, PERF_PPROF_PORT,
  # PERF_TOKEN_FILE, PERF_OUT_DIR, METRICS_SERVER_VERSION, SKIP_BUILD=1,
  # SKIP_METRICS_SERVER=1.

  perf:up:
    desc: Bring up the local perf stack on kind (full chart + MCP + metrics-server + pprof).
    cmds:
      - |
        set -eu
        if kind get clusters 2>/dev/null | grep -qx '{{.PERF_CLUSTER}}'; then
          echo "==> kind cluster {{.PERF_CLUSTER}} already exists"
        else
          # kind create switches the global kubectl context to the new
          # cluster — restore the caller's context so a concurrently
          # running e2e suite is not hijacked onto this cluster.
          prev_ctx="$(kubectl config current-context 2>/dev/null || true)"
          echo "==> creating kind cluster {{.PERF_CLUSTER}}"
          kind create cluster --name '{{.PERF_CLUSTER}}'
          if [ -n "$prev_ctx" ] && [ "$prev_ctx" != 'kind-{{.PERF_CLUSTER}}' ]; then
            kubectl config use-context "$prev_ctx" >/dev/null
          fi
        fi
      - |
        set -eu
        if [ "${SKIP_METRICS_SERVER:-0}" != "1" ]; then
          echo "==> installing metrics-server (kind requires --kubelet-insecure-tls)"
          kubectl --context 'kind-{{.PERF_CLUSTER}}' apply -f \
            "https://github.com/kubernetes-sigs/metrics-server/releases/download/{{.PERF_MS_VERSION}}/components.yaml"
          kubectl --context 'kind-{{.PERF_CLUSTER}}' -n kube-system patch deployment metrics-server \
            --type=json -p '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          kubectl --context 'kind-{{.PERF_CLUSTER}}' -n kube-system rollout status \
            deployment/metrics-server --timeout=120s
        fi
      - |
        set -eu
        if [ "${SKIP_BUILD:-0}" != "1" ]; then
          echo "==> building {{.PERF_IMG}} (native arch for the local kind node)"
          docker build -f Dockerfile.fast -t '{{.PERF_IMG}}' .
          kind load docker-image '{{.PERF_IMG}}' --name '{{.PERF_CLUSTER}}'
        fi
      - |
        set -eu
        echo "==> installing CRDs"
        bin/kustomize build config/crd | kubectl --context 'kind-{{.PERF_CLUSTER}}' apply --server-side -f -
      - |
        set -eu
        echo "==> helm installing {{.PERF_RELEASE}} (full split stack + MCP + pprof)"
        repo='{{.PERF_IMG}}'; repo="${repo%:*}"
        tag='{{.PERF_IMG}}'; tag="${tag##*:}"
        helm upgrade --install '{{.PERF_RELEASE}}' charts/chart \
          --kube-context 'kind-{{.PERF_CLUSTER}}' \
          --namespace '{{.PERF_NS}}' --create-namespace \
          --set deploymentMode=split \
          --set crd.enable=false \
          --set manager.image.repository="$repo" \
          --set manager.image.tag="$tag" \
          --set manager.image.pullPolicy=Never \
          --set apiServer.image.repository="$repo" \
          --set apiServer.image.tag="$tag" \
          --set apiServer.image.pullPolicy=Never \
          --set apiServer.automountServiceAccountToken=true \
          --set webhookReceiver.automountServiceAccountToken=true \
          --set webhookReceiver.image.repository="$repo" \
          --set webhookReceiver.image.tag="$tag" \
          --set webhookReceiver.image.pullPolicy=Never \
          --set repoServer.image.repository="$repo" \
          --set repoServer.image.tag="$tag" \
          --set repoServer.image.pullPolicy=Never \
          --set observabilityGateway.enabled=true \
          --set observabilityGateway.image.repository="$repo" \
          --set observabilityGateway.image.tag="$tag" \
          --set observabilityGateway.image.pullPolicy=Never \
          --set 'observabilityGateway.extraEnv[0].name=PAPRIKA_AUTH_TOKEN_SECRET' \
          --set 'observabilityGateway.extraEnv[0].value=perf-token-secret' \
          --set metrics.enable=true \
          --set metrics.secure=false \
          --set metrics.bindAddress=:8080 \
          --set 'manager.args[0]=--pprof-bind-address=127.0.0.1:6060' \
          --set 'apiServer.args[0]=--pprof-bind-address=127.0.0.1:6060' \
          --set 'observabilityGateway.args[0]=--pprof-bind-address=127.0.0.1:6060' \
          --set 'apiServer.extraEnv[0].name=PAPRIKA_AUTH_TOKEN_SECRET' \
          --set 'apiServer.extraEnv[0].value=perf-token-secret' \
          --set auth.enabled=true \
          --set auth.basic.enabled=true \
          --set auth.basic.username=admin \
          --set 'auth.basic.passwordHash=$2a$10$gokrR1H67p0nl/1Q2k1qk.i9u4iJNm8Iy1PUBR9ScjdhlznxnAKq6' \
          --set 'auth.rbac[0].subjects[0]=*' \
          --set 'auth.rbac[0].actions[0]=*' \
          --set 'auth.rbac[0].resources[0]=*' \
          --set 'auth.rbac[0].namespaces[0]=*' \
          --set mcp.enabled=true \
          --set mcp.oauth.clientId=perf-mcp \
          --set 'mcp.oauth.redirectUris[0]=http://localhost:8791/callback' \
          --set 'mcp.publicURL=http://localhost:{{.PERF_PORT}}' \
          --wait --timeout 5m
      - |
        echo ""
        echo "==> {{.PERF_RELEASE}} is up on kind cluster {{.PERF_CLUSTER}}"
        echo ""
        echo "Next:"
        echo "  task perf:token            # mint an MCP OAuth token (admin/admin123)"
        echo "  task perf:load SECS=120    # run MCP loadgen for 120s"
        echo "  task perf:profile SECS=30  # capture pprof profiles -> {{.PERF_OUT_DIR}}"
        echo "  task perf:metrics          # snapshot paprika_* metrics -> {{.PERF_OUT_DIR}}"
        echo "  task perf:down             # tear down"
        echo ""
        echo "api-server:  http://localhost:{{.PERF_PORT}} (after 'task perf:token' starts the forward)"

  perf:down:
    desc: Tear down the local perf kind cluster.
    cmds:
      - |
        set -eu
        if kind get clusters 2>/dev/null | grep -qx '{{.PERF_CLUSTER}}'; then
          echo "==> deleting kind cluster {{.PERF_CLUSTER}}"
          kind delete cluster --name '{{.PERF_CLUSTER}}'
        else
          echo "==> cluster {{.PERF_CLUSTER}} does not exist"
        fi

  perf:token:
    desc: Mint an MCP OAuth token for the local perf stack.
    preconditions:
      - sh: kind get clusters 2>/dev/null | grep -qx '{{.PERF_CLUSTER}}'
        msg: 'kind cluster {{.PERF_CLUSTER}} not found — run: task perf:up'
    cmds:
      - |
        set -eu
        # A bare healthz check is not enough — a stale forward to a
        # different release would answer it and then reject the perf OAuth
        # client. Verify the discovery issuer matches this environment
        # (mcp.publicURL pins it to this port).
        issuer_ok() {
          curl -sf 'http://localhost:{{.PERF_PORT}}/.well-known/oauth-authorization-server' 2>/dev/null \
            | grep -q '"issuer":"http://localhost:{{.PERF_PORT}}"'
        }
        if ! issuer_ok; then
          echo "==> port-forwarding api-server -> localhost:{{.PERF_PORT}}"
          deploy="$(kubectl --context 'kind-{{.PERF_CLUSTER}}' -n '{{.PERF_NS}}' get deployment \
            -l app.kubernetes.io/component=api-server -o name | head -1)"
          # nohup + </dev/null detaches the forward — a plain & child is
          # reaped when the task's shell exits, and later tasks rely on
          # this listener staying up.
          nohup kubectl --context 'kind-{{.PERF_CLUSTER}}' -n '{{.PERF_NS}}' port-forward "$deploy" \
            '{{.PERF_PORT}}:3000' >/dev/null 2>&1 </dev/null &
          i=0; while [ "$i" -lt 30 ]; do issuer_ok && break; i=$((i+1)); sleep 1; done
        fi
        issuer_ok || { echo "error: api-server on :{{.PERF_PORT}} does not report issuer http://localhost:{{.PERF_PORT}} — stale port-forward?" >&2; exit 1; }
      - |
        set -eu
        echo "==> minting MCP token (consent -> code -> token)"
        verifier="$(openssl rand -base64 48 | tr '/+' '_-' | tr -d '=')"
        challenge="$(printf %s "$verifier" | openssl dgst -sha256 -binary | openssl base64 | tr '/+' '_-' | tr -d '=')"
        # The consent response is JSON — parse it rather than regexing
        # (& arrives \u0026-escaped).
        code="$(curl -sf -u 'admin:admin123' -X POST 'http://localhost:{{.PERF_PORT}}/mcp/authorize/consent' \
          -H 'Content-Type: application/json' \
          -d "{\"client_id\":\"perf-mcp\",\"redirect_uri\":\"http://localhost:8791/callback\",\"code_challenge\":\"${challenge}\",\"code_challenge_method\":\"S256\",\"state\":\"perf\",\"scopes\":[\"paprika:read\",\"paprika:write\"],\"decision\":\"approve\"}" \
          | python3 -c 'import json,sys,urllib.parse; print(urllib.parse.parse_qs(urllib.parse.urlparse(json.load(sys.stdin)["redirectTo"]).query)["code"][0])')"
        [ -n "$code" ] || { echo "error: consent did not return an authorization code" >&2; exit 1; }
        token_json="$(curl -sf -X POST 'http://localhost:{{.PERF_PORT}}/mcp/token' \
          -d "grant_type=authorization_code&code=${code}&code_verifier=${verifier}&client_id=perf-mcp&redirect_uri=http://localhost:8791/callback")"
        echo "$token_json" | grep -q access_token || { echo "error: token exchange failed: $token_json" >&2; exit 1; }
        echo "$token_json" | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p' > '{{.PERF_TOKEN_FILE}}'
        chmod 600 '{{.PERF_TOKEN_FILE}}'
        echo "==> token written to {{.PERF_TOKEN_FILE}}"

  perf:load:
    desc: Run MCP read-tool loadgen against the local stack (default 60s).
    preconditions:
      - sh: kind get clusters 2>/dev/null | grep -qx '{{.PERF_CLUSTER}}'
        msg: 'kind cluster {{.PERF_CLUSTER}} not found — run: task perf:up'
      - sh: test -f '{{.PERF_TOKEN_FILE}}'
        msg: 'no token — run: task perf:token'
    cmds:
      - |
        set -eu
        secs='{{.SECS | default "60"}}'
        token="$(cat '{{.PERF_TOKEN_FILE}}')"
        end=$(( $(date +%s) + secs )); calls=0; fails=0; start=$(date +%s%N)
        while [ "$(date +%s)" -lt "$end" ]; do
          for tool in fleet_status list_applications fleet_map; do
            if curl -sf -o /dev/null -X POST 'http://localhost:{{.PERF_PORT}}/mcp' \
              -H "Authorization: Bearer $token" \
              -H 'Content-Type: application/json' \
              -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/call\",\"params\":{\"name\":\"$tool\",\"arguments\":{}}}"; then
              calls=$((calls + 1))
            else
              fails=$((fails + 1))
            fi
          done
        done
        elapsed=$(( ($(date +%s%N) - start) / 1000000 ))
        echo "loadgen: ${calls} ok, ${fails} failed in ${elapsed}ms -> $(( calls * 1000 / elapsed )) calls/s" >&2

  perf:profile:
    desc: 'Capture pprof CPU/heap/allocs/goroutines (args: [seconds] [api|manager]).'
    preconditions:
      - sh: kind get clusters 2>/dev/null | grep -qx '{{.PERF_CLUSTER}}'
        msg: 'kind cluster {{.PERF_CLUSTER}} not found — run: task perf:up'
    cmds:
      - |
        set -eu
        secs='{{.SECS | default "30"}}'; component='{{.COMPONENT | default "api"}}'
        case "$component" in
          api|api-server)      label='app.kubernetes.io/component=api-server' ;;
          manager|controller)  label='control-plane=controller-manager' ;;
          *) echo "error: unknown component '$component' — use api or manager" >&2; exit 1 ;;
        esac
        deploy="$(kubectl --context 'kind-{{.PERF_CLUSTER}}' -n '{{.PERF_NS}}' get deployment -l "$label" -o name | head -1)"
        [ -n "$deploy" ] || { echo "error: no deployment found for component '$component'" >&2; exit 1; }
        echo "==> port-forwarding $component pprof -> localhost:{{.PERF_PPROF_PORT}}"
        # A stale listener (dead forward, other tool) would answer nc and the
        # scrapes below would read the wrong endpoint — clear it first.
        lsof -ti :'{{.PERF_PPROF_PORT}}' 2>/dev/null | xargs kill 2>/dev/null || true
        sleep 1
        kubectl --context 'kind-{{.PERF_CLUSTER}}' -n '{{.PERF_NS}}' port-forward "$deploy" \
          '{{.PERF_PPROF_PORT}}:6060' >/dev/null 2>&1 &
        pf=$!
        trap 'kill $pf 2>/dev/null || true' EXIT
        i=0; while [ "$i" -lt 30 ]; do nc -z localhost '{{.PERF_PPROF_PORT}}' 2>/dev/null && break; i=$((i+1)); sleep 1; done
        out='{{.PERF_OUT_DIR}}/capture-'"$component"'-'"$(date +%s)"
        mkdir -p "$out"
        echo "==> capturing heap + goroutine + ${secs}s cpu + allocs -> $out"
        curl -sf 'http://localhost:{{.PERF_PPROF_PORT}}/debug/pprof/heap' -o "$out/heap.pprof"
        curl -sf 'http://localhost:{{.PERF_PPROF_PORT}}/debug/pprof/goroutine?debug=1' -o "$out/goroutine.txt"
        curl -sf "http://localhost:{{.PERF_PPROF_PORT}}/debug/pprof/profile?seconds=$secs" -o "$out/cpu.pprof"
        curl -sf 'http://localhost:{{.PERF_PPROF_PORT}}/debug/pprof/allocs' -o "$out/allocs.pprof"
        echo "=== top CPU ==="
        go tool pprof -top -nodecount=20 "$out/cpu.pprof" 2>&1 | tail -25
        echo "=== top heap (inuse) ==="
        go tool pprof -top -inuse_space -nodecount=15 "$out/heap.pprof" 2>&1 | tail -20
        echo "=== top allocs (cumulative) ==="
        go tool pprof -top -alloc_space -nodecount=15 "$out/allocs.pprof" 2>&1 | tail -20

  perf:metrics:
    desc: Snapshot paprika_* metrics from manager and api-server into $PERF_OUT_DIR.
    preconditions:
      - sh: kind get clusters 2>/dev/null | grep -qx '{{.PERF_CLUSTER}}'
        msg: 'kind cluster {{.PERF_CLUSTER}} not found — run: task perf:up'
    cmds:
      - |
        set -eu
        snap='{{.PERF_OUT_DIR}}/metrics-'"$(date +%s)"
        mkdir -p "$snap"
        echo "==> scraping controller-manager metrics -> $snap/manager.txt"
        lsof -ti :'{{.PERF_MGR_PORT}}' 2>/dev/null | xargs kill 2>/dev/null || true
        sleep 1
        kubectl --context 'kind-{{.PERF_CLUSTER}}' -n '{{.PERF_NS}}' port-forward \
          'svc/{{.PERF_RELEASE}}-controller-manager-metrics-service' '{{.PERF_MGR_PORT}}:8443' >/dev/null 2>&1 &
        pf=$!
        i=0; while [ "$i" -lt 30 ]; do nc -z localhost '{{.PERF_MGR_PORT}}' 2>/dev/null && break; i=$((i+1)); sleep 1; done
        curl -sf 'http://localhost:{{.PERF_MGR_PORT}}/metrics' -o "$snap/manager.txt" || echo "manager scrape failed"
        kill $pf 2>/dev/null || true
        if [ -f "$snap/manager.txt" ] && ! grep -q '^# HELP' "$snap/manager.txt"; then
          echo "WARNING: manager.txt is not Prometheus output — port {{.PERF_MGR_PORT}} may be bound by another process (override with PERF_MGR_PORT)"
        fi
        # The api-server serves /metrics on metrics.bindAddress (:8080), a
        # separate unauthenticated listener — not the API port.
        echo "==> scraping api-server metrics -> $snap/api-server.txt"
        lsof -ti :'{{.PERF_API_METRICS_PORT}}' 2>/dev/null | xargs kill 2>/dev/null || true
        sleep 1
        kubectl --context 'kind-{{.PERF_CLUSTER}}' -n '{{.PERF_NS}}' port-forward \
          'svc/{{.PERF_RELEASE}}-api-server' '{{.PERF_API_METRICS_PORT}}:8080' >/dev/null 2>&1 &
        pf=$!
        i=0; while [ "$i" -lt 30 ]; do nc -z localhost '{{.PERF_API_METRICS_PORT}}' 2>/dev/null && break; i=$((i+1)); sleep 1; done
        curl -sf 'http://localhost:{{.PERF_API_METRICS_PORT}}/metrics' -o "$snap/api-server.txt" || echo "api-server scrape failed"
        kill $pf 2>/dev/null || true
        # A colliding listener on the metrics port answers before our
        # forward binds; Prometheus exposition starts with "# HELP".
        if [ -f "$snap/api-server.txt" ] && ! grep -q '^# HELP' "$snap/api-server.txt"; then
          echo "WARNING: api-server.txt is not Prometheus output — port {{.PERF_API_METRICS_PORT}} may be bound by another process (override with PERF_API_METRICS_PORT)"
        fi
        echo "==> snapshot written to $snap"
        grep -c '^paprika_' "$snap"/*.txt 2>/dev/null || true

  perf:status:
    desc: Print fleet/cluster health via the local MCP endpoint.
    preconditions:
      - sh: kind get clusters 2>/dev/null | grep -qx '{{.PERF_CLUSTER}}'
        msg: 'kind cluster {{.PERF_CLUSTER}} not found — run: task perf:up'
      - sh: test -f '{{.PERF_TOKEN_FILE}}'
        msg: 'no token — run: task perf:token'
    cmds:
      - |
        set -eu
        token="$(cat '{{.PERF_TOKEN_FILE}}')"
        for tool in fleet_status list_clusters; do
          echo "=== $tool ==="
          curl -sf -X POST 'http://localhost:{{.PERF_PORT}}/mcp' \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/call\",\"params\":{\"name\":\"$tool\",\"arguments\":{}}}" \
            | python3 -m json.tool 2>/dev/null || echo "(call failed)"
        done

  # --- Observability gateway perf (mock backends + multi-client loadgen) ---
  #
  #   task perf:obs-seed COUNT=50        # seed mock providers (idempotent)
  #   task perf:obs-load SECS=60 CLIENTS=32 RPS=5
  #   task perf:obs-profile SECS=30      # load + pprof capture, combined
  #   task perf:obs-metrics              # gateway /metrics + kubectl top
  #
  # The loadgen (hack/obsloadgen) mints one paprika-observability token per
  # client — each with its own subject — so the MCP per-subject rate limiter
  # bounds each client independently and aggregate throughput scales with
  # CLIENTS. It needs the perf stack's literal token secret and the gateway's
  # public URL as issuer; both are fixed by 'task perf:up'.

  perf:obs-seed:
    desc: Seed COUNT mock observability providers (varied payload shapes) into the perf stack.
    preconditions:
      - sh: kind get clusters 2>/dev/null | grep -qx '{{.PERF_CLUSTER}}'
        msg: 'kind cluster {{.PERF_CLUSTER}} not found — run: task perf:up'
    cmds:
      - |
        set -eu
        kubectl --context 'kind-{{.PERF_CLUSTER}}' create namespace '{{.PERF_OBS_NS}}' \
          --dry-run=client -o yaml | kubectl --context 'kind-{{.PERF_CLUSTER}}' apply -f - >/dev/null
        count='{{.COUNT | default "25"}}'
        manifest="$(mktemp)"
        trap 'rm -f "$manifest"' EXIT
        for i in $(seq 0 $((count - 1))); do
          series=$((8 + (i * 24) % 256))
          points=$((16 + (i * 8) % 64))
          entries=$((50 + (i * 90) % 500))
          latency=0; fail=0
          [ $((i % 5)) -eq 0 ] && latency=25
          [ $((i % 7)) -eq 0 ] && fail=3
          # printf (not a heredoc): a flush-left heredoc body would terminate
          # the YAML block scalar this script lives in.
          {
            printf 'apiVersion: observability.paprika.io/v1alpha1\n'
            printf 'kind: ObservabilityProvider\n'
            printf 'metadata:\n'
            printf '  name: mock-%s\n' "$i"
            printf '  namespace: {{.PERF_OBS_NS}}\n'
            printf 'spec:\n'
            printf '  type: mock\n'
            printf '  config:\n'
            printf '    series: %s\n' "$series"
            printf '    pointsPerSeries: %s\n' "$points"
            printf '    labelsPerSeries: 3\n'
            printf '    logEntries: %s\n' "$entries"
            printf '    traces: 8\n'
            printf '    latencyMs: %s\n' "$latency"
            printf '    failEvery: %s\n' "$fail"
            printf '    seed: %s\n' "$i"
            printf '%s\n' '---'
          } >> "$manifest"
        done
        kubectl --context 'kind-{{.PERF_CLUSTER}}' apply -f "$manifest" >/dev/null
        echo "==> seeded $count mock providers into {{.PERF_OBS_NS}} (mock-0 .. mock-$((count - 1)))"

  perf:obs-load:
    desc: Run the multi-client observability MCP loadgen (knobs SECS/CLIENTS/RPS/MIX).
    preconditions:
      - sh: kind get clusters 2>/dev/null | grep -qx '{{.PERF_CLUSTER}}'
        msg: 'kind cluster {{.PERF_CLUSTER}} not found — run: task perf:up'
    cmds:
      - |
        set -eu
        # The gateway forward answers /observe/mcp; verify it is THIS stack's
        # gateway by probing the catalog with a freshly minted token.
        issuer_ok() {
          curl -sf 'http://localhost:{{.PERF_OBS_PORT}}/healthz' 2>/dev/null | grep -qx ok
        }
        if ! issuer_ok; then
          echo "==> port-forwarding observability-gateway -> localhost:{{.PERF_OBS_PORT}}"
          lsof -ti :'{{.PERF_OBS_PORT}}' 2>/dev/null | xargs kill 2>/dev/null || true
          sleep 1
          nohup kubectl --context 'kind-{{.PERF_CLUSTER}}' -n '{{.PERF_NS}}' port-forward \
            deployment/{{.PERF_RELEASE}}-observability-gateway '{{.PERF_OBS_PORT}}:8090' \
            >/dev/null 2>&1 </dev/null &
          i=0; while [ "$i" -lt 30 ]; do issuer_ok && break; i=$((i+1)); sleep 1; done
        fi
        issuer_ok || { echo 'error: no gateway healthz on :{{.PERF_OBS_PORT}}' >&2; exit 1; }
      - |
        set -eu
        providers="$(kubectl --context 'kind-{{.PERF_CLUSTER}}' -n '{{.PERF_OBS_NS}}' \
          get observabilityproviders -o name 2>/dev/null \
          | sed 's|.*/|{{.PERF_OBS_NS}}/|' | paste -sd, -)"
        [ -n "$providers" ] || { echo 'error: no mock providers — run: task perf:obs-seed' >&2; exit 1; }
        out='{{.PERF_OUT_DIR}}/obs-load-'"$(date +%s)".json
        mkdir -p '{{.PERF_OUT_DIR}}'
        env -u GOROOT go run ./hack/obsloadgen \
          -gateway 'http://localhost:{{.PERF_OBS_PORT}}' \
          -secret 'perf-token-secret' \
          -issuer 'http://localhost:{{.PERF_PORT}}' \
          -clients '{{.CLIENTS | default "16"}}' \
          -secs '{{.SECS | default "60"}}' \
          -rps '{{.RPS | default "5"}}' \
          -providers "$providers" \
          -mix '{{.MIX | default "query_metrics:5,query_logs:3,query_traces:2,list_observability_providers:1"}}' \
          -out "$out"
        echo "==> report: $out"

  perf:obs-profile:
    desc: Combined load + pprof capture on the observability gateway (knob SECS, plus CLIENTS/RPS).
    preconditions:
      - sh: kind get clusters 2>/dev/null | grep -qx '{{.PERF_CLUSTER}}'
        msg: 'kind cluster {{.PERF_CLUSTER}} not found — run: task perf:up'
    cmds:
      - |
        set -eu
        # pprof ships disabled by default; turn it on if this stack predates
        # the perf:up arg. Idempotent — the patch is a no-op once present.
        if ! kubectl --context 'kind-{{.PERF_CLUSTER}}' -n '{{.PERF_NS}}' get deploy \
            {{.PERF_RELEASE}}-observability-gateway -o jsonpath='{.spec.template.spec.containers[0].args}' \
            | grep -q 'pprof-bind-address'; then
          echo "==> enabling gateway pprof (127.0.0.1:6060)"
          kubectl --context 'kind-{{.PERF_CLUSTER}}' -n '{{.PERF_NS}}' patch deploy \
            {{.PERF_RELEASE}}-observability-gateway --type=json -p \
            '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--pprof-bind-address=127.0.0.1:6060"}]'
        fi
        kubectl --context 'kind-{{.PERF_CLUSTER}}' -n '{{.PERF_NS}}' rollout status \
          deploy/{{.PERF_RELEASE}}-observability-gateway --timeout=180s
      - |
        set -eu
        secs='{{.SECS | default "30"}}'
        load_secs=$((secs + 10))
        providers="$(kubectl --context 'kind-{{.PERF_CLUSTER}}' -n '{{.PERF_OBS_NS}}' \
          get observabilityproviders -o name 2>/dev/null \
          | sed 's|.*/|{{.PERF_OBS_NS}}/|' | paste -sd, -)"
        [ -n "$providers" ] || { echo 'error: no mock providers — run: task perf:obs-seed' >&2; exit 1; }
        # Bring the gateway forward up ourselves: this task is often the
        # first obs command of a session.
        if ! curl -sf 'http://localhost:{{.PERF_OBS_PORT}}/healthz' 2>/dev/null | grep -qx ok; then
          echo "==> port-forwarding observability-gateway -> localhost:{{.PERF_OBS_PORT}}"
          lsof -ti :'{{.PERF_OBS_PORT}}' 2>/dev/null | xargs kill 2>/dev/null || true
          sleep 1
          nohup kubectl --context 'kind-{{.PERF_CLUSTER}}' -n '{{.PERF_NS}}' port-forward \
            deployment/{{.PERF_RELEASE}}-observability-gateway '{{.PERF_OBS_PORT}}:8090' \
            >/dev/null 2>&1 </dev/null &
          i=0; while [ "$i" -lt 30 ]; do
            curl -sf 'http://localhost:{{.PERF_OBS_PORT}}/healthz' 2>/dev/null | grep -qx ok && break
            i=$((i+1)); sleep 1
          done
        fi
        out='{{.PERF_OUT_DIR}}/obs-profile-'"$(date +%s)"
        mkdir -p "$out"
        echo "==> starting load ($load_secs s) alongside a ${secs}s CPU profile"
        env -u GOROOT go run ./hack/obsloadgen \
          -gateway 'http://localhost:{{.PERF_OBS_PORT}}' \
          -secret 'perf-token-secret' \
          -issuer 'http://localhost:{{.PERF_PORT}}' \
          -clients '{{.CLIENTS | default "32"}}' \
          -secs "$load_secs" \
          -rps '{{.RPS | default "5"}}' \
          -providers "$providers" \
          -out "$out/loadgen.json" &
        load_pid=$!
        # The load task above also brings the forward up; if it is still
        # starting, the pprof scrape below retries.
        lsof -ti :'{{.PERF_OBS_PPROF_PORT}}' 2>/dev/null | xargs kill 2>/dev/null || true
        sleep 1
        kubectl --context 'kind-{{.PERF_CLUSTER}}' -n '{{.PERF_NS}}' port-forward \
          deployment/{{.PERF_RELEASE}}-observability-gateway \
          '{{.PERF_OBS_PPROF_PORT}}:6060' >/dev/null 2>&1 &
        pf=$!
        trap 'kill $pf $load_pid 2>/dev/null || true' EXIT
        i=0; while [ "$i" -lt 30 ]; do nc -z localhost '{{.PERF_OBS_PPROF_PORT}}' 2>/dev/null && break; i=$((i+1)); sleep 1; done
        # Warm the server for a few seconds, then profile the steady state.
        sleep 5
        curl -sf 'http://localhost:{{.PERF_OBS_PPROF_PORT}}/debug/pprof/heap' -o "$out/heap.pprof"
        curl -sf 'http://localhost:{{.PERF_OBS_PPROF_PORT}}/debug/pprof/goroutine?debug=1' -o "$out/goroutine.txt"
        curl -sf "http://localhost:{{.PERF_OBS_PPROF_PORT}}/debug/pprof/profile?seconds=$secs" -o "$out/cpu.pprof"
        curl -sf 'http://localhost:{{.PERF_OBS_PPROF_PORT}}/debug/pprof/allocs' -o "$out/allocs.pprof"
        wait $load_pid
        echo "==> capture: $out"
        echo "=== loadgen summary ==="
        cat "$out/loadgen.json"
        echo ""
        echo "=== top CPU ==="
        env -u GOROOT go tool pprof -top -nodecount=20 "$out/cpu.pprof" 2>&1 | tail -25
        echo "=== top heap (inuse) ==="
        env -u GOROOT go tool pprof -top -inuse_space -nodecount=15 "$out/heap.pprof" 2>&1 | tail -20
        echo "=== top allocs (cumulative) ==="
        env -u GOROOT go tool pprof -top -alloc_space -nodecount=15 "$out/allocs.pprof" 2>&1 | tail -20

  perf:obs-metrics:
    desc: Snapshot the observability gateway /metrics and pod resource usage.
    preconditions:
      - sh: kind get clusters 2>/dev/null | grep -qx '{{.PERF_CLUSTER}}'
        msg: 'kind cluster {{.PERF_CLUSTER}} not found — run: task perf:up'
    cmds:
      - |
        set -eu
        snap='{{.PERF_OUT_DIR}}/obs-metrics-'"$(date +%s)"
        mkdir -p "$snap"
        lsof -ti :'{{.PERF_OBS_PORT}}' 2>/dev/null | xargs kill 2>/dev/null || true
        sleep 1
        kubectl --context 'kind-{{.PERF_CLUSTER}}' -n '{{.PERF_NS}}' port-forward \
          deployment/{{.PERF_RELEASE}}-observability-gateway '{{.PERF_OBS_PORT}}:8080' \
          >/dev/null 2>&1 &
        pf=$!
        trap 'kill $pf 2>/dev/null || true' EXIT
        i=0; while [ "$i" -lt 30 ]; do nc -z localhost '{{.PERF_OBS_PORT}}' 2>/dev/null && break; i=$((i+1)); sleep 1; done
        curl -sf 'http://localhost:{{.PERF_OBS_PORT}}/metrics' -o "$snap/gateway.txt" || echo "gateway scrape failed"
        kill $pf 2>/dev/null || true
        kubectl --context 'kind-{{.PERF_CLUSTER}}' -n '{{.PERF_NS}}' top pod \
          -l app.kubernetes.io/component=observability-gateway 2>/dev/null | tee "$snap/top.txt" || true
        echo "==> snapshot: $snap"
        grep -c '^paprika_' "$snap/gateway.txt" 2>/dev/null || true

  chart:crds:
    desc: Copy regenerated config/crd/bases into chart templates with crd.enable/keep wrappers.
    cmds:
      - |
        set -eu
        out_dir='charts/chart/templates/crd'
        written="$(mktemp)"
        trap 'rm -f "$written"' EXIT
        for base in config/crd/bases/*.yaml; do
          crd_name="$(sed -n 's/^  name: \(.*\)/\1/p' "$base" | head -1)"
          [ -n "$crd_name" ] || { echo "error: no metadata.name in $base" >&2; exit 1; }
          echo "$crd_name.yaml" >> "$written"
          {
            echo '{{.TLO}}- if .Values.crd.enable {{.TLC}}'
            awk '
              NR == 1 && /^---$/ { next }
              /^  annotations:$/ && !done {
                print
                print "    {{.TLO}}- if .Values.crd.keep {{.TLC}}"
                print "    \"helm.sh/resource-policy\": keep"
                print "    {{.TLO}}- end {{.TLC}}"
                done = 1
                next
              }
              { print }
              END {
                if (!done) {
                  print "error: no metadata.annotations block in input" > "/dev/stderr"
                  exit 1
                }
              }
            ' "$base"
            echo '{{.TLO}}- end {{.TLC}}'
          } > "$out_dir/$crd_name.yaml"
          echo "wrote $out_dir/$crd_name.yaml"
        done
        for existing in "$out_dir"/*.yaml; do
          grep -qx "$(basename "$existing")" "$written" || { echo "removing stale chart CRD $existing"; rm "$existing"; }
        done

  chart:validate:
    desc: Render the chart across value matrices and assert no empty --flag= args, plus expected-fail/schema cases.
    cmds:
      - |
        set -eu
        rc=0
        check_render() { # name, extra set-args...
          name="$1"; shift
          if ! out="$(helm template paprika charts/chart --namespace paprika-system "$@" 2>&1)"; then
            echo "FAIL[$name]: render errored: $out"; rc=1; return
          fi
          # An empty value is the disable switch for the console and the inline
          # webhook, so those two are allowed to render empty on the controller-manager
          # workloads only. Any other empty --flag= fails in every document.
          empty_args="$(printf '%s\n' "$out" | awk '
            BEGIN { RS = "\n---\n" }
            {
              mgr = ($0 ~ /kind: (Deployment|StatefulSet)/ && index($0, "\n  name: paprika-controller-manager\n"))
              n = split($0, lines, "\n")
              for (i = 1; i <= n; i++) {
                if (lines[i] ~ /^[[:space:]]*- --[A-Za-z0-9-]+=$/) {
                  if (mgr && lines[i] ~ /--(ui-bind-address|inline-webhook-bind-address)=$/) continue
                  print lines[i]
                }
              }
            }')"
          if [ -n "$empty_args" ]; then
            printf '%s\n' "$empty_args"
            echo "FAIL[$name]: empty --flag= args rendered"; rc=1
          else
            echo "ok[$name]"
          fi
          # Deploy stacks must keep pprof on loopback; kubectl port-forward still reaches it.
          case "$*" in
            *deploy/*-values.yaml*)
              pprof_bad="$(printf '%s\n' "$out" | grep -E -- '--pprof-bind-address=.' | grep -vE -- '--pprof-bind-address=(127\.0\.0\.1|\[::1\]|localhost):[0-9]+$' || true)"
              if [ -n "$pprof_bad" ]; then
                printf '%s\n' "$pprof_bad"
                echo "FAIL[$name]: pprof rendered on a non-loopback address"; rc=1
              fi
              ;;
          esac
          if [ "$name" = insights-shared ]; then
            gateway_count="$(printf '%s\n' "$out" | grep -c 'name: PAPRIKA_OBSERVABILITY_GATEWAY_ADDR')"
            issuer_count="$(printf '%s\n' "$out" | grep -c 'name: PAPRIKA_MCP_PUBLIC_URL')"
            insights_count="$(printf '%s\n' "$out" | grep -c 'name: PAPRIKA_INSIGHTS_URL')"
            if [ "$gateway_count" -ne 2 ] || [ "$issuer_count" -ne 2 ] || [ "$insights_count" -ne 3 ]; then
              echo "FAIL[$name]: API, Insights and gateway must share destination, authoring and issuer wiring"; rc=1
            fi
          fi
          if [ "$name" = namespace-scoped ]; then
            count="$(printf '%s\n' "$out" | grep -c -- '--api-namespace=review-samples')"
            if [ "$count" -ne 2 ]; then
              echo "FAIL[$name]: both API and gateway must receive the namespace bound"; rc=1
            fi
          fi
          case "$name" in
            omega-git|omega-git-rollback)
              want=auto; if [ "$name" = omega-git-rollback ]; then want=go-git; fi
              count="$(printf '%s\n' "$out" | grep -A1 -- '- name: PAPRIKA_GIT_BACKEND' | grep -c "value: \"$want\"")"
              if [ "$count" -ne 2 ]; then
                echo "FAIL[$name]: repo server and manager must both render PAPRIKA_GIT_BACKEND=$want (got $count)"; rc=1
              fi
              ;;
          esac
          if [ "$name" = repo-server-cache ]; then
            rs="$(printf '%s\n' "$out" | awk 'BEGIN { RS="---" } /component: repo-server/ && (/kind: Deployment/ || /kind: PersistentVolumeClaim/) { print }')"
            for want in 'kind: PersistentVolumeClaim' 'type: Recreate' '--repo-workdir=/tmp/paprika-repo' 'claimName: paprika-repo-server-git-cache' 'name: PAPRIKA_GIT_CACHE_MAX_BYTES'; do
              if ! printf '%s\n' "$rs" | grep -qF -- "$want"; then
                echo "FAIL[$name]: persistent git cache render lacks: $want"; rc=1
              fi
            done
          fi
          case "$name" in
            insights-persistent|insights-existing|omega-insights)
              pvc="$(printf '%s\n' "$out" | awk 'BEGIN { RS="---" } /kind: PersistentVolumeClaim/ && /name: paprika-insights/ { print }')"
              if [ "$name" = insights-persistent ]; then
                if [ -z "$pvc" ] || ! printf '%s\n' "$pvc" | grep -q '^    helm.sh/resource-policy: keep$'; then
                  echo "FAIL[$name]: chart-created Insights storage must survive removal from a release"; rc=1
                fi
              else
                expected_claim=restored-insights
                if [ "$name" = omega-insights ]; then expected_claim=paprika-e2e-insights; fi
                if [ -n "$pvc" ] || ! printf '%s\n' "$out" | grep -q "claimName: $expected_claim$"; then
                  echo "FAIL[$name]: Insights must mount the existing claim without creating replacement storage"; rc=1
                fi
              fi
              ;;
          esac
        }
        expect_fail() { # name, extra set-args...
          name="$1"; shift
          if helm template paprika charts/chart --namespace paprika-system "$@" >/dev/null 2>&1; then
            echo "FAIL[$name]: expected render failure but succeeded"; rc=1
          else
            echo "ok[$name] (rejected as expected)"
          fi
        }

        check_render defaults
        check_render split \
          --set deploymentMode=split --set apiServer.enabled=true \
          --set repoServer.enabled=true --set webhookReceiver.enabled=true
        check_render auth-basic \
          --set auth.enabled=true --set auth.basic.enabled=true \
          --set auth.basic.username=u \
          --set 'auth.basic.passwordHash=$2a$10$gokrR1H67p0nl/1Q2k1qk.i9u4iJNm8Iy1PUBR9ScjdhlznxnAKq6'
        check_render auth-oidc \
          --set auth.enabled=true --set auth.oidc.enabled=true \
          --set auth.oidc.issuerURL=https://issuer.example.com \
          --set auth.oidc.clientID=cid
        check_render mcp \
          --set deploymentMode=split --set apiServer.enabled=true \
          --set auth.enabled=true --set auth.basic.enabled=true \
          --set auth.basic.username=u \
          --set 'auth.basic.passwordHash=$2a$10$gokrR1H67p0nl/1Q2k1qk.i9u4iJNm8Iy1PUBR9ScjdhlznxnAKq6' \
          --set mcp.enabled=true --set mcp.oauth.clientId=cid \
          --set mcp.publicURL=https://api.example.com \
          --set 'mcp.oauth.redirectUris[0]=https://api.example.com/cb' \
          --set 'apiServer.extraEnv[0].name=PAPRIKA_AUTH_TOKEN_SECRET' \
          --set 'apiServer.extraEnv[0].value=test-token-secret'
        check_render namespace-scoped --set deploymentMode=split --set apiServer.namespaceScope=review-samples \
          --set observabilityGateway.enabled=true --set auth.enabled=true \
          --set mcp.publicURL=https://review.example.com \
          --set 'observabilityGateway.extraEnv[0].name=PAPRIKA_AUTH_TOKEN_SECRET' \
          --set 'observabilityGateway.extraEnv[0].value=test-token-secret'
        check_render insights-shared --set deploymentMode=split --set apiServer.enabled=true \
          --set insights.enabled=true --set insights.token.existingSecretName=insights-test \
          --set observabilityGateway.enabled=true --set auth.enabled=true \
          --set mcp.publicURL=https://insights.example.com \
          --set 'observabilityGateway.extraEnv[0].name=PAPRIKA_AUTH_TOKEN_SECRET' \
          --set 'observabilityGateway.extraEnv[0].value=test-token-secret'
        check_render insights-persistent --set insights.enabled=true \
          --set insights.token.existingSecretName=insights-test
        check_render insights-existing --set insights.enabled=true \
          --set insights.token.existingSecretName=insights-test \
          --set insights.persistence.existingClaim=restored-insights
        check_render gateway-capacity --set deploymentMode=split \
          --set observabilityGateway.enabled=true --set auth.enabled=true \
          --set mcp.publicURL=https://capacity.example.com \
          --set 'observabilityGateway.extraEnv[0].name=PAPRIKA_AUTH_TOKEN_SECRET' \
          --set 'observabilityGateway.extraEnv[0].value=test-token-secret' \
          --set observabilityGateway.capacity.queryConcurrency=8 \
          --set observabilityGateway.capacity.queryQueueWait=3s \
          --set observabilityGateway.capacity.httpAdmissionWait=0s
        gw_args="$(helm template paprika charts/chart --namespace paprika-system --set deploymentMode=split --set observabilityGateway.enabled=true --set auth.enabled=true --set mcp.publicURL=https://capacity.example.com --set 'observabilityGateway.extraEnv[0].name=PAPRIKA_AUTH_TOKEN_SECRET' --set 'observabilityGateway.extraEnv[0].value=test-token-secret' --set observabilityGateway.capacity.queryConcurrency=8 --set observabilityGateway.capacity.queryQueueWait=3s --set observabilityGateway.capacity.httpAdmissionWait=0s 2>&1)"
        for want in '--observability-query-concurrency=8' '--observability-query-queue-wait=3s' '--observability-http-admission-wait=0s'; do
          if ! printf '%s\n' "$gw_args" | grep -qF -- "$want"; then
            echo "FAIL[gateway-capacity]: rendered gateway lacks $want"; rc=1
          fi
        done
        # Unset capacity values must not reach the binary: an older gateway image
        # rejects an unknown flag and crash-loops. Explicit zeros are still passed.
        gw_default="$(helm template paprika charts/chart --namespace paprika-system --set deploymentMode=split --set observabilityGateway.enabled=true --set auth.enabled=true --set mcp.publicURL=https://capacity.example.com --set 'observabilityGateway.extraEnv[0].name=PAPRIKA_AUTH_TOKEN_SECRET' --set 'observabilityGateway.extraEnv[0].value=test-token-secret' 2>&1)"
        if printf '%s\n' "$gw_default" | grep -qE -- '--observability-(query|http)-'; then
          echo "FAIL[gateway-capacity-default]: unset capacity values must omit their flags"; rc=1
        else
          echo "ok[gateway-capacity-default] (no capacity flags)"
        fi
        gw_zero="$(helm template paprika charts/chart --namespace paprika-system --set deploymentMode=split --set observabilityGateway.enabled=true --set auth.enabled=true --set mcp.publicURL=https://capacity.example.com --set 'observabilityGateway.extraEnv[0].name=PAPRIKA_AUTH_TOKEN_SECRET' --set 'observabilityGateway.extraEnv[0].value=test-token-secret' --set observabilityGateway.capacity.queryProviderConcurrency=0 --set observabilityGateway.capacity.httpWorkSlots=0 --set observabilityGateway.capacity.httpAdmissionWait=0s 2>&1)"
        for want in '--observability-query-provider-concurrency=0' '--observability-http-work-slots=0' '--observability-http-admission-wait=0s'; do
          if ! printf '%s\n' "$gw_zero" | grep -qF -- "$want"; then
            echo "FAIL[gateway-capacity-explicit-zero]: explicit zero must still be passed: $want"; rc=1
          fi
        done
        echo "ok[gateway-capacity-explicit-zero]"
        check_render omega-insights -f deploy/test-values.yaml -f deploy/omega-values.yaml \
          -f deploy/insights-omega-values.yaml
        # Insights NetworkPolicy checks (internal/insights/README.md "Network policy").
        # The policy's ingress and egress must equal the expected paths in
        # charts/chart/tests/insights-netpol/, so a wider peer, port or rule fails the diff.
        np_dir=charts/chart/tests/insights-netpol
        np_tmp="$(mktemp -d)"
        render() { helm template paprika charts/chart --namespace paprika-system "$@"; }
        np_names() { awk 'BEGIN { RS="---" } /kind: NetworkPolicy/ { n=split($0,a,"\n"); for(i=1;i<=n;i++) if (a[i] ~ /^  name:/) print a[i] }' | sed 's/^  name: //' | sort | tr '\n' ' '; }
        np_doc() { awk 'BEGIN { RS="---" } /kind: NetworkPolicy/ && /\n  name: paprika-insights\n/' | grep -v '^[[:space:]]*$' || true; }
        # np_exact LABEL INGRESS_FIXTURE EGRESS_FIXTURE: reads the rendered output on stdin.
        # The whole spec (selector, policyTypes, ingress, egress) must equal spec-head.txt
        # plus the two fixtures, and the policy must live in the release namespace.
        np_exact() {
          np_bad=0
          np_doc > "$np_tmp/doc"
          sed -n '/^spec:/,$p' "$np_tmp/doc" > "$np_tmp/got-spec"
          cat "$np_dir/spec-head.txt" "$np_dir/$2" "$np_dir/$3" > "$np_tmp/want-spec"
          if ! diff -u "$np_tmp/want-spec" "$np_tmp/got-spec" > "$np_tmp/spec.diff"; then
            echo "FAIL[$1]: spec differs from spec-head.txt + $2 + $3"; sed 's/^/  /' "$np_tmp/spec.diff"; np_bad=1
          fi
          if [ "$(grep -c '^  namespace: paprika-system$' "$np_tmp/doc")" -ne 1 ]; then
            echo "FAIL[$1]: the policy must be in namespace paprika-system"; np_bad=1
          fi
          return "$np_bad"
        }
        ins_set='--set insights.enabled=true --set insights.token.existingSecretName=insights-test'
        ins_only='--set insights.networkPolicy.enabled=true'
        glob_split='--set deploymentMode=split --set apiServer.enabled=true --set repoServer.enabled=true --set webhookReceiver.enabled=true'
        all_seven='paprika-agent paprika-api-server paprika-controller-manager paprika-insights paprika-observability-gateway paprika-repo-server paprika-webhook-receiver '
        if ! np_out="$(render $ins_set 2>&1)"; then
          echo "FAIL[insights-netpol-default]: render errored"; rc=1
        elif [ -n "$(printf '%s\n' "$np_out" | np_names)" ]; then
          echo "FAIL[insights-netpol-default]: default render must not add a NetworkPolicy"; rc=1
        else
          echo "ok[insights-netpol-default]"
        fi
        printf '%s\n' 'insights:' '  enabled: true' '  token:' '    existingSecretName: insights-test' '  networkPolicy: null' > "$np_tmp/null-values.yaml"
        if ! np_out="$(render -f "$np_tmp/null-values.yaml" 2>&1)"; then
          echo "FAIL[insights-netpol-null]: a null insights.networkPolicy must render"; rc=1
        elif [ -n "$(printf '%s\n' "$np_out" | np_names)" ]; then
          echo "FAIL[insights-netpol-null]: a null insights.networkPolicy must not add a NetworkPolicy"; rc=1
        else
          echo "ok[insights-netpol-null]"
        fi
        if ! np_out="$(render -f "$np_tmp/null-values.yaml" --set networkPolicy.enabled=true 2>&1)"; then
          echo "FAIL[insights-netpol-null-global]: a null insights.networkPolicy must render under the global switch"; rc=1
        elif ! printf '%s\n' "$np_out" | np_names | grep -qw paprika-insights; then
          echo "FAIL[insights-netpol-null-global]: the global switch must still render the Insights policy"; rc=1
        else
          echo "ok[insights-netpol-null-global]"
        fi
        if ! np_out="$(render $glob_split $ins_set $ins_only 2>&1)"; then
          echo "FAIL[insights-netpol-switch]: render errored"; rc=1
        elif [ "$(printf '%s\n' "$np_out" | np_names)" != "paprika-insights " ]; then
          echo "FAIL[insights-netpol-switch]: switch must render only the Insights policy"; rc=1
        elif ! printf '%s\n' "$np_out" | np_exact insights-netpol-switch ingress-api-gateway.txt egress-dns-extras.txt; then
          rc=1
        else
          echo "ok[insights-netpol-switch]"
        fi
        if ! np_out="$(render $ins_set $ins_only --set deploymentMode=monolith 2>&1)"; then
          echo "FAIL[insights-netpol-monolith]: render errored"; rc=1
        elif [ "$(printf '%s\n' "$np_out" | np_names)" != "paprika-insights " ]; then
          echo "FAIL[insights-netpol-monolith]: monolith with auth.enabled=false must render only the Insights policy"; rc=1
        elif ! printf '%s\n' "$np_out" | np_exact insights-netpol-monolith ingress-api-manager-gateway.txt egress-dns-extras.txt; then
          rc=1
        else
          echo "ok[insights-netpol-monolith]"
        fi
        if ! np_out="$(render $ins_set $ins_only --set deploymentMode=monolith --set auth.enabled=true 2>&1)"; then
          echo "FAIL[insights-netpol-monolith-auth]: render errored"; rc=1
        elif [ "$(printf '%s\n' "$np_out" | np_names)" != "paprika-insights " ]; then
          echo "FAIL[insights-netpol-monolith-auth]: monolith with auth must render only the Insights policy"; rc=1
        elif ! printf '%s\n' "$np_out" | np_exact insights-netpol-monolith-auth ingress-api-manager-gateway.txt egress-dns-extras.txt; then
          rc=1
        else
          echo "ok[insights-netpol-monolith-auth]"
        fi
        if ! np_out="$(render -f deploy/test-values.yaml -f deploy/omega-values.yaml -f deploy/insights-omega-values.yaml 2>&1)"; then
          echo "FAIL[insights-netpol-omega]: render errored"; rc=1
        elif [ "$(printf '%s\n' "$np_out" | np_names)" != "paprika-controller-manager-ingress paprika-insights " ]; then
          echo "FAIL[insights-netpol-omega]: the omega stack must render only the Insights and manager ingress policies"; rc=1
        elif ! printf '%s\n' "$np_out" | np_exact insights-netpol-omega ingress-api-gateway.txt egress-dns-gateway.txt; then
          rc=1
        else
          echo "ok[insights-netpol-omega]"
        fi
        if ! np_out="$(render $glob_split $ins_set --set networkPolicy.enabled=true 2>&1)"; then
          echo "FAIL[insights-netpol-global]: render errored"; rc=1
        elif [ "$(printf '%s\n' "$np_out" | np_names)" != "$all_seven" ]; then
          echo "FAIL[insights-netpol-global]: the global switch must still render all seven policies"; rc=1
        elif ! printf '%s\n' "$np_out" | np_exact insights-netpol-global ingress-api-gateway.txt egress-dns-extras.txt; then
          rc=1
        else
          echo "ok[insights-netpol-global]"
        fi
        if ! np_out="$(render $ins_set --set networkPolicy.enabled=true --set deploymentMode=monolith 2>&1)"; then
          echo "FAIL[insights-netpol-global-monolith]: render errored"; rc=1
        elif ! printf '%s\n' "$np_out" | np_exact insights-netpol-global-monolith ingress-api-manager-gateway.txt egress-dns-extras.txt; then
          rc=1
        else
          echo "ok[insights-netpol-global-monolith]"
        fi
        if ! np_out="$(render $ins_only --set insights.enabled=false 2>&1)"; then
          echo "FAIL[insights-netpol-disabled]: render errored"; rc=1
        elif [ -n "$(printf '%s\n' "$np_out" | np_names)" ]; then
          echo "FAIL[insights-netpol-disabled]: insights.enabled=false must render no NetworkPolicy"; rc=1
        else
          echo "ok[insights-netpol-disabled]"
        fi
        if ! np_out="$(render $glob_split --set insights.enabled=false --set networkPolicy.enabled=true 2>&1)"; then
          echo "FAIL[insights-netpol-global-disabled]: render errored"; rc=1
        elif [ -z "$(printf '%s\n' "$np_out" | np_names)" ]; then
          echo "FAIL[insights-netpol-global-disabled]: the global switch must still render the other policies"; rc=1
        elif printf '%s\n' "$np_out" | np_names | grep -qw paprika-insights; then
          echo "FAIL[insights-netpol-global-disabled]: insights.enabled=false must render no Insights NetworkPolicy under the global switch"; rc=1
        else
          echo "ok[insights-netpol-global-disabled]"
        fi
        rm -rf "$np_tmp"
        expect_fail invalid-namespace-scope --set apiServer.namespaceScope=Review/production
        expect_fail namespace-scope-in-monolith --set apiServer.namespaceScope=review-samples
        check_render reconcile-zero \
          --set manager.reconcile.rateLimit.globalRate=0
        check_render reconcile-tuning \
          --set manager.reconcile.transientRequeue=10s \
          --set manager.reconcile.sourceResolveTTL=45s \
          --set manager.reconcile.rateLimit.appRate=25
        check_render test-values -f deploy/test-values.yaml
        check_render omega-git -f deploy/test-values.yaml -f deploy/omega-values.yaml
        check_render omega-git-rollback -f deploy/test-values.yaml -f deploy/omega-values.yaml \
          --set repoServer.git.backend=go-git
        check_render repo-server-cache --set repoServer.enabled=true --set repoServer.replicas=1 \
          --set repoServer.cache.persistence.enabled=true
        check_render repo-server-cache-omega -f deploy/test-values.yaml -f deploy/omega-values.yaml \
          --set repoServer.cache.persistence.enabled=true
        expect_fail repo-server-cache-replicas --set repoServer.enabled=true \
          --set repoServer.cache.persistence.enabled=true --set repoServer.replicas=2
        expect_fail repo-server-cache-surge --set repoServer.enabled=true --set repoServer.replicas=1 \
          --set repoServer.cache.persistence.enabled=true --set repoServer.strategy.type=RollingUpdate \
          --set repoServer.strategy.rollingUpdate.maxSurge=1

        expect_fail basic-missing-creds \
          --set auth.enabled=true --set auth.basic.enabled=true
        expect_fail oidc-missing-issuer \
          --set auth.enabled=true --set auth.oidc.enabled=true
        expect_fail mcp-missing-oauth \
          --set mcp.enabled=true
        expect_fail mcp-session-nonboolean \
          --set-string mcp.oauth.persistSessions=true
        expect_fail observe-session-nonboolean \
          --set-string observabilityGateway.persistSessions=true
        expect_fail bad-duration \
          --set manager.reconcile.transientRequeue=bogus
        expect_fail bad-mode \
          --set deploymentMode=weird
        expect_fail bad-port \
          --set metrics.port=99999
        check_render gateway-capacity-zero-integer --set deploymentMode=split \
          --set observabilityGateway.enabled=true --set auth.enabled=true \
          --set mcp.publicURL=https://capacity.example.com \
          --set 'observabilityGateway.extraEnv[0].name=PAPRIKA_AUTH_TOKEN_SECRET' \
          --set 'observabilityGateway.extraEnv[0].value=test-token-secret' \
          --set observabilityGateway.capacity.httpAdmissionWait=0
        expect_fail capacity-zero-concurrency \
          --set observabilityGateway.capacity.queryConcurrency=0
        expect_fail capacity-bare-duration \
          --set observabilityGateway.capacity.queryQueueWait=5
        expect_fail capacity-bare-admission-wait \
          --set observabilityGateway.capacity.httpAdmissionWait=5
        expect_fail capacity-nonnumeric-pool \
          --set observabilityGateway.capacity.httpWorkSlots=many

        # HTTPRoute request timeouts. Envoy Gateway's default is 15 s, so the
        # /observe route and the /api/insights rule must carry their own bound.
        route_render() { # extra set-args...: renders the gateway-api HTTPRoutes
          helm template paprika charts/chart --namespace paprika-system \
            --set deploymentMode=split --set apiServer.enabled=true \
            --set apiServer.ingress.enabled=true --set apiServer.ingress.type=gateway-api \
            --set apiServer.ingress.gateway.gatewayRef.name=paprika \
            --set apiServer.ingress.gateway.gatewayRef.namespace=envoy-gateway-system \
            --set apiServer.ingress.gateway.hostname=paprika.example.com \
            --set observabilityGateway.enabled=true --set observabilityGateway.ingress.enabled=true \
            --set auth.enabled=true --set mcp.publicURL=https://paprika.example.com \
            --set 'observabilityGateway.extraEnv[0].name=PAPRIKA_AUTH_TOKEN_SECRET' \
            --set 'observabilityGateway.extraEnv[0].value=test-token-secret' "$@"
        }
        expect_route_fail() { # name, extra set-args...
          name="$1"; shift
          if msg="$(route_render "$@" 2>&1)"; then
            echo "FAIL[$name]: expected render failure but succeeded"; rc=1
          elif printf '%s\n' "$msg" | grep -qE 'Timeout must be between|single-unit Go duration'; then
            echo "ok[$name] (rejected as expected)"
          else
            echo "FAIL[$name]: rejected, but not by the timeout guard: $msg"; rc=1
          fi
        }
        if ! route_out="$(route_render 2>&1)"; then
          echo "FAIL[route-timeouts]: render errored: $route_out"; rc=1
        else
          for want in 'request: "50s"' 'request: "35s"'; do
            if [ "$(printf '%s\n' "$route_out" | grep -cF -- "$want")" -ne 1 ]; then
              echo "FAIL[route-timeouts]: expected exactly one rule with $want"; rc=1
            fi
          done
          api_rt="$(printf '%s\n' "$route_out" | awk 'BEGIN { RS="\n---\n" } /kind: HTTPRoute/ && /component: api-server/ { print }')"
          if [ "$(printf '%s\n' "$api_rt" | grep -c 'timeouts:')" -ne 1 ] \
            || ! printf '%s\n' "$api_rt" | grep -B2 -A8 'request: "35s"' | grep -qF 'value: /api/insights'; then
            echo "FAIL[route-timeouts]: only the /api/insights rule may carry a timeout"; rc=1
          else
            echo "ok[route-timeouts] (50s on /observe, 35s on /api/insights, none on /)"
          fi
        fi
        if route_render --set observabilityGateway.ingress.requestTimeout=46s >/dev/null 2>&1; then
          echo "ok[route-timeout-min] (46s accepted)"
        else
          echo "FAIL[route-timeout-min]: 46s must be accepted"; rc=1
        fi
        if route_render --set observabilityGateway.ingress.requestTimeout=1m >/dev/null 2>&1; then
          echo "ok[route-timeout-1m] (1m, a Go duration in range, accepted)"
        else
          echo "FAIL[route-timeout-1m]: 1m (60s) must be accepted"; rc=1
        fi
        if route_render --set observabilityGateway.ingress.requestTimeout=119s >/dev/null 2>&1; then
          echo "ok[route-timeout-max] (119s accepted)"
        else
          echo "FAIL[route-timeout-max]: 119s must be accepted"; rc=1
        fi
        expect_route_fail route-timeout-under-write --set observabilityGateway.ingress.requestTimeout=45s
        expect_route_fail route-timeout-over-cloudflare --set observabilityGateway.ingress.requestTimeout=120s
        expect_route_fail route-timeout-compound --set observabilityGateway.ingress.requestTimeout=1m30s
        expect_route_fail route-timeout-insights-low --set apiServer.ingress.insightsRequestTimeout=28s
        expect_route_fail route-timeout-insights-high --set apiServer.ingress.insightsRequestTimeout=2m

        # Manager listeners and policy. The split-mode manager opens no console or
        # inline webhook listener, its pprof listener is loopback-only, and its
        # ingress policy is off unless manager.networkPolicy.enabled is set.
        mgr_deploy() { # extra set-args...: the controller-manager Deployment
          helm template paprika charts/chart --namespace paprika-system "$@" 2>&1 \
            | awk 'BEGIN { RS="\n---\n" } /kind: Deployment/ && index($0, "\n  name: paprika-controller-manager\n") { print }'
        }
        mgr_sts() { # extra set-args...: the sharded controller-manager StatefulSet
          helm template paprika charts/chart --namespace paprika-system "$@" 2>&1 \
            | awk 'BEGIN { RS="\n---\n" } /kind: StatefulSet/ && index($0, "\n  name: paprika-controller-manager\n") { print }'
        }
        mgr_policy() { # extra set-args...: the per-component manager NetworkPolicy
          helm template paprika charts/chart --namespace paprika-system "$@" 2>&1 \
            | awk 'BEGIN { RS="\n---\n" } /kind: NetworkPolicy/ && index($0, "\n  name: paprika-controller-manager-ingress\n") { print }'
        }
        global_policy() { # extra set-args...: the global controller-manager NetworkPolicy
          helm template paprika charts/chart --namespace paprika-system "$@" 2>&1 \
            | awk 'BEGIN { RS="\n---\n" } /kind: NetworkPolicy/ && index($0, "\n  name: paprika-controller-manager\n") { print }'
        }
        policy_ports() { # reads a NetworkPolicy on stdin, prints its admitted ports
          grep -E '^ +port: [0-9]+$' | awk '{ print $2 }' | sort -n | tr '\n' ' '
        }
        check_split_listeners() { # label, rendered manager workload: no console, no inline webhook, loopback pprof
          label="$1"; doc="$2"; before=$rc
          if [ -z "$doc" ]; then
            echo "FAIL[$label]: no manager workload rendered"; rc=1; return
          fi
          for want in '        - --ui-bind-address=' '        - --inline-webhook-bind-address=' '        - --pprof-bind-address=127.0.0.1:6060'; do
            if ! printf '%s\n' "$doc" | grep -qxF -- "$want"; then
              echo "FAIL[$label]: split manager lacks exact arg: $want"; rc=1
            fi
          done
          if printf '%s\n' "$doc" | grep -qE -- '--(ui-bind-address|inline-webhook-bind-address)=.'; then
            echo "FAIL[$label]: split manager renders a console or inline webhook listener"; rc=1
          fi
          pprof_bad="$(printf '%s\n' "$doc" | grep -E -- '--pprof-bind-address=.' | grep -vE -- '--pprof-bind-address=(127\.0\.0\.1|\[::1\]|localhost):[0-9]+$' || true)"
          if [ -n "$pprof_bad" ]; then
            echo "FAIL[$label]: split manager renders pprof beyond loopback: $pprof_bad"; rc=1
          fi
          for absent in 'containerPort: 3000' 'containerPort: 8080'; do
            if printf '%s\n' "$doc" | grep -qF -- "$absent"; then
              echo "FAIL[$label]: split manager declares $absent"; rc=1
            fi
          done
          if printf '%s\n' "$doc" | grep -qF -- '--mode=api'; then
            echo "FAIL[$label]: split manager must run as operator"; rc=1
          fi
          if [ "$rc" -eq "$before" ]; then echo "ok[$label] (no console, no inline webhook, pprof on loopback)"; fi
        }
        split_args='["--pprof-bind-address=127.0.0.1:6060","--ui-bind-address=:3000","--inline-webhook-bind-address=:8080"]'
        check_split_listeners split-manager-args "$(mgr_deploy --set deploymentMode=split --set webhook.enabled=true \
          --set-json "manager.args=$split_args")"
        check_split_listeners split-sharded-manager-args "$(mgr_sts --set deploymentMode=split --set webhook.enabled=true \
          --set manager.sharding.enabled=true --set-json "manager.args=$split_args")"
        before=$rc
        mono_mgr="$(mgr_deploy)"
        for want in '        - --ui-bind-address=:3000' '        - --mode=operator'; do
          if ! printf '%s\n' "$mono_mgr" | grep -qxF -- "$want"; then
            echo "FAIL[monolith-manager-args]: monolith lacks $want"; rc=1
          fi
        done
        if printf '%s\n' "$mono_mgr" | grep -qE -- '--inline-webhook-bind-address|--ui-bind-address=$'; then
          echo "FAIL[monolith-manager-args]: monolith must keep the default listeners"; rc=1
        fi
        if [ "$rc" -eq "$before" ]; then echo "ok[monolith-manager-args] (console and inline webhook at defaults)"; fi
        # A bare listener flag (two-item form) must fail in split mode: dropping only the
        # flag would leave its value as a positional argument.
        expect_fail split-bare-ui-flag --set deploymentMode=split \
          --set-json 'manager.args=["--ui-bind-address",":3000"]'
        expect_fail split-bare-inline-webhook-flag --set deploymentMode=split \
          --set-json 'manager.args=["--inline-webhook-bind-address",":8080"]'
        # The bare form stays valid in monolith mode.
        check_render monolith-bare-ui-flag --set-json 'manager.args=["--ui-bind-address",":3000"]'
        # Leading whitespace in a manager.args item must not defeat the split-mode filter:
        # the item is trimmed first, so the console listener is still dropped.
        leading_doc="$(mgr_deploy --set deploymentMode=split --set webhook.enabled=true \
          --set-json 'manager.args=[" --ui-bind-address=:3000","--pprof-bind-address=127.0.0.1:6060"]')"
        check_split_listeners split-manager-leading-space-arg "$leading_doc"
        # A null manager.args item has no flag to pass; it is refused rather than rendered as "<nil>".
        expect_fail manager-args-null-item --set-json 'manager.args=[null]'
        # The enabled switch is a boolean. A string "false" is truthy in a template, so it is refused.
        expect_fail manager-networkpolicy-string-enabled --set-string manager.networkPolicy.enabled=false
        # Split mode with mode=api: the manager Service keeps health and metrics, but not the api port.
        split_api_svc="$(helm template paprika charts/chart --namespace paprika-system --set deploymentMode=split --set mode=api 2>&1 \
          | awk 'BEGIN { RS="\n---\n" } /kind: Service/ && index($0, "\n  name: paprika-manager-api-service\n") { print }')"
        if [ -z "$split_api_svc" ]; then
          echo "FAIL[split-api-service]: manager Service not rendered"; rc=1
        elif printf '%s\n' "$split_api_svc" | grep -qE 'port: 3000$'; then
          echo "FAIL[split-api-service]: split-mode manager Service routes the console port 3000"; rc=1
        elif ! printf '%s\n' "$split_api_svc" | grep -qE 'port: 8081$'; then
          echo "FAIL[split-api-service]: split-mode manager Service lost the health port"; rc=1
        else
          echo "ok[split-api-service] (no console port, health kept)"
        fi
        if [ -n "$(mgr_policy)" ]; then
          echo "FAIL[manager-policy-default]: manager.networkPolicy must be off by default"; rc=1
        else
          echo "ok[manager-policy-default] (absent)"
        fi
        split_policy="$(mgr_policy --set deploymentMode=split --set webhook.enabled=true --set manager.networkPolicy.enabled=true)"
        if [ -z "$split_policy" ]; then
          echo "FAIL[manager-policy-split]: enabled policy not rendered"; rc=1
        else
          if printf '%s\n' "$split_policy" | grep -qE '^ +- Egress$|from:'; then
            echo "FAIL[manager-policy-split]: manager policy must be ingress-only, with no source restriction in split mode"; rc=1
          fi
          if ! printf '%s\n' "$split_policy" | grep -qxF '    - Ingress'; then
            echo "FAIL[manager-policy-split]: policyTypes must list Ingress"; rc=1
          fi
          got="$(printf '%s\n' "$split_policy" | policy_ports)"
          if [ "$got" != "8081 8443 9443 " ]; then
            echo "FAIL[manager-policy-split]: admitted ports were '$got', want '8081 8443 9443 '"; rc=1
          else
            echo "ok[manager-policy-split] (ingress-only: 8081 8443 9443)"
          fi
        fi
        metrics_off_policy="$(mgr_policy --set deploymentMode=split --set webhook.enabled=true --set metrics.enable=false --set manager.networkPolicy.enabled=true)"
        got="$(printf '%s\n' "$metrics_off_policy" | policy_ports)"
        if [ "$got" != "8081 9443 " ]; then
          echo "FAIL[manager-policy-metrics-off]: admitted ports were '$got', want '8081 9443 '"; rc=1
        else
          echo "ok[manager-policy-metrics-off] (no metrics port when metrics.enable=false)"
        fi
        # A values stack that omits manager.networkPolicy (or sets it to null) must still render.
        if ! helm template paprika charts/chart --namespace paprika-system --set manager.networkPolicy=null >/dev/null 2>&1; then
          echo "FAIL[manager-policy-null]: a null manager.networkPolicy must render"; rc=1
        else
          echo "ok[manager-policy-null]"
        fi
        mono_policy="$(mgr_policy --set manager.networkPolicy.enabled=true --set webhook.enabled=true)"
        got="$(printf '%s\n' "$mono_policy" | policy_ports)"
        if [ "$got" != "3000 8080 8081 8443 9443 " ]; then
          echo "FAIL[manager-policy-monolith]: admitted ports were '$got'"; rc=1
        elif ! printf '%s\n' "$mono_policy" | grep -qF 'kubernetes.io/metadata.name: paprika-system'; then
          echo "FAIL[manager-policy-monolith]: console and webhook ports must be limited to the release namespace"; rc=1
        else
          echo "ok[manager-policy-monolith] (console and webhook from the release namespace only)"
        fi
        if [ -n "$(mgr_policy --set manager.networkPolicy.enabled=true --set webhook.enabled=false --set deploymentMode=split | grep -E '^ +port: 9443$')" ]; then
          echo "FAIL[manager-policy-no-webhook]: 9443 admitted with webhook.enabled=false"; rc=1
        else
          echo "ok[manager-policy-no-webhook]"
        fi
        # The global template admits the admission port when webhooks are on. The
        # kube-apiserver is not in the release namespace, so this rule has no source
        # restriction; without it failurePolicy Ignore skips admission silently.
        global_on="$(global_policy --set networkPolicy.enabled=true --set webhook.enabled=true)"
        if [ "$(printf '%s\n' "$global_on" | grep -c 'port: 9443$')" -ne 1 ]; then
          echo "FAIL[global-policy-webhook]: global controller-manager policy must admit 9443 once"; rc=1
        elif [ "$(printf '%s\n' "$global_on" | awk '/^  ingress:/ { f = 1 } /^  egress:/ { f = 0 } f' | grep -c 'from:')" -ne 1 ]; then
          # Exactly one ingress rule (the existing console/API rule) carries a source
          # restriction; the 9443 rule must not.
          echo "FAIL[global-policy-webhook]: the 9443 rule must not be limited to a source namespace"; rc=1
        else
          echo "ok[global-policy-webhook] (9443 admitted from any source)"
        fi
        if [ -n "$(global_policy --set networkPolicy.enabled=true --set webhook.enabled=false | grep 'port: 9443$')" ]; then
          echo "FAIL[global-policy-no-webhook]: 9443 admitted with webhook.enabled=false"; rc=1
        else
          echo "ok[global-policy-no-webhook]"
        fi
        exit $rc

  chart:rules:
    desc: Render the PrometheusRule and run promtool check rules and promtool test rules (pinned prom/prometheus image; PROMTOOL=/path overrides docker; HELM_BIN selects helm).
    cmds:
      - bash charts/chart/tests/prometheus/run.sh

  # ---------------------------------------------------------------------------
  # Multi-cluster fleet rig (task fleet:*). Three kind clusters: a management
  # cluster running Paprika, two `direct` registrations, and one `agent`
  # registration served by a satellite. See hack/fleet-rig.sh for the topology
  # and the test-only choices it makes.
  # ---------------------------------------------------------------------------
  fleet:up:
    desc: Bring up the three-cluster fleet rig (management, two direct remotes, one satellite).
    cmds:
      - ./hack/fleet-rig.sh up

  fleet:status:
    desc: Show fleet registrations, satellite link state, applications, rollouts and the bundle store.
    cmds:
      - ./hack/fleet-rig.sh status

  fleet:seed:
    desc: Dispatch a sample bundle through the satellite link via the internal listener.
    cmds:
      - ./hack/fleet-rig.sh seed

  fleet:down:
    desc: Delete the fleet rig's kind clusters (perf and e2e clusters are never touched).
    cmds:
      - ./hack/fleet-rig.sh down
