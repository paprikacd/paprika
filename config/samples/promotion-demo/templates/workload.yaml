apiVersion: v1
kind: ConfigMap
metadata:
  name: promotion-demo-content
  namespace: {{ .Release.Namespace }}
data:
  healthz: "ok"
  environment: {{ .Values.environment | quote }}
  version: {{ .Values.demoVersion | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: promotion-demo
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: promotion-demo
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: promotion-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: promotion-demo
      annotations:
        checksum/content: {{ printf "%s:%s" .Values.environment .Values.demoVersion | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: http
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: content
              mountPath: /www
              readOnly: true
      volumes:
        - name: content
          configMap:
            name: promotion-demo-content
---
apiVersion: v1
kind: Service
metadata:
  name: promotion-demo
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: promotion-demo
  ports:
    - name: http
      port: 80
      targetPort: http
