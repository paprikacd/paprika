---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: clusters.clusters.paprika.io
spec:
  group: clusters.paprika.io
  names:
    kind: Cluster
    listKind: ClusterList
    plural: clusters
    singular: cluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.server
      name: Server
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Cluster registers a Kubernetes cluster for Paprika deployments.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ClusterSpec defines the desired state of a Cluster.
            properties:
              connectionTimeout:
                default: 30s
                type: string
              disabled:
                type: boolean
              displayName:
                type: string
              healthCheck:
                description: HealthCheckConfig configures periodic cluster health
                  probes.
                properties:
                  interval:
                    default: 30s
                    type: string
                  timeout:
                    default: 10s
                    type: string
                type: object
              kubeconfigSecretRef:
                description: SecretRef references a Kubernetes Secret.
                properties:
                  key:
                    type: string
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              labels:
                additionalProperties:
                  type: string
                type: object
              mode:
                default: in-cluster
                description: ClusterMode defines how the controller connects to a
                  cluster.
                enum:
                - direct
                - agent
                - in-cluster
                type: string
              provider:
                description: |-
                  Provider configures cloud-provider enrichment. Nil disables enrichment;
                  a non-nil provider with type "auto" still runs detection-only inventory.
                properties:
                  clusterId:
                    description: |-
                      ClusterID is the provider's own identifier for the cluster — the VKE
                      cluster UUID, the EKS cluster name, the GKE cluster name, or the AKS
                      resource name. When empty the enricher matches the cluster by API
                      endpoint where the provider supports it.
                    type: string
                  credentialsSecretRef:
                    description: |-
                      CredentialsSecretRef references a Secret holding the provider
                      credential. The referenced key contains a provider-specific document:

                        vultr — the API key, as a plain string.
                        eks   — optional; ambient identity (IRSA, pod identity, node role) is
                                used when absent. When set, JSON with access_key_id and
                                secret_access_key (session_token optional).
                        gke   — a Google credential JSON document: either a workload identity
                                federation external_account configuration or a service-account
                                key. When absent, application default credentials are used.
                        aks   — JSON with tenant_id, client_id and either client_secret or
                                federated_token_file. When absent, the AZURE_* workload
                                identity environment is used.
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                  project:
                    description: |-
                      Project is the GCP project for GKE or the Azure resource group for AKS.
                      Ignored by other providers.
                    type: string
                  region:
                    description: |-
                      Region narrows provider lookups: the EKS region, the GKE location, or
                      the AKS location. Vultr does not require it.
                    type: string
                  subscriptionId:
                    description: |-
                      SubscriptionID is the Azure subscription the AKS cluster lives in.
                      Ignored by other providers.
                    type: string
                  type:
                    default: auto
                    description: |-
                      Type selects the integration. "auto" detects the provider from node
                      providerID prefixes (vultr://, gce://, aws://, azure://).
                    enum:
                    - auto
                    - vultr
                    - gke
                    - eks
                    - aks
                    type: string
                type: object
              server:
                type: string
              serviceAccount:
                type: string
            required:
            - mode
            type: object
          status:
            description: ClusterStatus defines the observed state of a Cluster.
            properties:
              agentInfo:
                description: AgentInfo reports the status of an in-cluster agent.
                properties:
                  address:
                    type: string
                  connected:
                    format: date-time
                    type: string
                  version:
                    type: string
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              inventory:
                description: |-
                  Inventory is what the Kubernetes API reports about the cluster itself.
                  Populated on each successful health check; nil until the first one
                  completes.
                properties:
                  kubeletVersions:
                    items:
                      type: string
                    type: array
                  namespaceCount:
                    format: int32
                    type: integer
                  nodeCount:
                    format: int32
                    type: integer
                  podCount:
                    format: int32
                    type: integer
                  readyNodeCount:
                    format: int32
                    type: integer
                  regions:
                    items:
                      type: string
                    type: array
                  runningPodCount:
                    format: int32
                    type: integer
                  zones:
                    items:
                      type: string
                    type: array
                type: object
              lastHealthCheckTime:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: ClusterPhase represents the lifecycle phase of a Cluster.
                enum:
                - Pending
                - Healthy
                - Unhealthy
                - Disabled
                type: string
              provider:
                description: |-
                  Provider is what the cloud-provider integration observed. Detection
                  from node providerIDs always runs; the API-level fields (clusterID,
                  autoscaler bounds) only populate when the provider answered.
                properties:
                  clusterId:
                    type: string
                  nodePools:
                    items:
                      description: |-
                        ClusterNodePool describes one node pool as reported by the cloud provider
                        (or derived from node labels when no provider credential is configured).
                      properties:
                        autoScaled:
                          description: |-
                            AutoScaled reports whether the provider has the pool under autoscaler
                            control. Derived pools leave it false.
                          type: boolean
                        machineType:
                          type: string
                        maxNodes:
                          format: int32
                          type: integer
                        minNodes:
                          description: |-
                            MinNodes and MaxNodes are the autoscaler bounds. Zero when the pool is
                            not autoscaled or the bound is unknown.
                          format: int32
                          type: integer
                        name:
                          type: string
                        nodeCount:
                          format: int32
                          type: integer
                      required:
                      - name
                      - nodeCount
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  observedAt:
                    format: date-time
                    type: string
                  reason:
                    description: |-
                      Reason is a sanitized explanation for a non-OK state; it never carries
                      credential material or endpoint details.
                    type: string
                  region:
                    type: string
                  state:
                    enum:
                    - OK
                    - NotConfigured
                    - NotAvailable
                    - Error
                    - Forbidden
                    type: string
                  type:
                    description: Type is the provider the controller resolved, e.g.
                      "vultr".
                    type: string
                type: object
              version:
                type: string
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
