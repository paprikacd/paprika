---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: clusters.clusters.paprika.io
spec:
  group: clusters.paprika.io
  names:
    kind: Cluster
    listKind: ClusterList
    plural: clusters
    singular: cluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.server
      name: Server
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Cluster registers a Kubernetes cluster for Paprika deployments.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ClusterSpec defines the desired state of a Cluster.
            properties:
              connectionTimeout:
                default: 30s
                type: string
              disabled:
                type: boolean
              displayName:
                type: string
              healthCheck:
                description: HealthCheckConfig configures periodic cluster health
                  probes.
                properties:
                  interval:
                    default: 30s
                    type: string
                  timeout:
                    default: 10s
                    type: string
                type: object
              kubeconfigSecretRef:
                description: SecretRef references a Kubernetes Secret.
                properties:
                  key:
                    type: string
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              labels:
                additionalProperties:
                  type: string
                type: object
              managementPolicies:
                description: |-
                  ManagementPolicies is this cluster's ceiling: the most any placement
                  targeting it may do, whether the control plane dials it directly or drives
                  it through a satellite. Unset means full management; an explicitly empty
                  list makes the whole cluster read-only. A Stage's own policies are
                  intersected with this ceiling, never added to it.
                items:
                  description: |-
                    ManagementPolicy names one capability Paprika may exercise against a target
                    cluster. The vocabulary follows Crossplane's managementPolicies: a policy set
                    is an allow-list, so a nil set means "unspecified" and defaults to full
                    management, while an explicitly empty set grants nothing.

                    The set is evaluated per action, not per resource: a release that may Apply
                    but not Prune leaves removed manifests in the cluster rather than deleting
                    them, which is what an operator adopting an existing cluster needs.
                  enum:
                  - Observe
                  - Apply
                  - Prune
                  - Delete
                  - SelfHeal
                  - Rollout
                  - '*'
                  type: string
                maxItems: 8
                type: array
              mode:
                default: in-cluster
                description: ClusterMode defines how the controller connects to a
                  cluster.
                enum:
                - direct
                - agent
                - in-cluster
                type: string
              provider:
                description: |-
                  Provider configures cloud-provider enrichment. Nil disables enrichment;
                  a non-nil provider with type "auto" still runs detection-only inventory.
                properties:
                  clusterId:
                    description: |-
                      ClusterID is the provider's own identifier for the cluster — the VKE
                      cluster UUID, the EKS cluster name, the GKE cluster name, or the AKS
                      resource name. When empty the enricher matches the cluster by API
                      endpoint where the provider supports it.
                    type: string
                  credentialsSecretRef:
                    description: |-
                      CredentialsSecretRef references a Secret holding the provider
                      credential. The referenced key contains a provider-specific document:

                        vultr — the API key, as a plain string.
                        eks   — optional; ambient identity (IRSA, pod identity, node role) is
                                used when absent. When set, JSON with access_key_id and
                                secret_access_key (session_token optional).
                        gke   — a Google credential JSON document: either a workload identity
                                federation external_account configuration or a service-account
                                key. When absent, application default credentials are used.
                        aks   — JSON with tenant_id, client_id and either client_secret or
                                federated_token_file. When absent, the AZURE_* workload
                                identity environment is used.
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                  project:
                    description: |-
                      Project is the GCP project for GKE or the Azure resource group for AKS.
                      Ignored by other providers.
                    type: string
                  region:
                    description: |-
                      Region narrows provider lookups: the EKS region, the GKE location, or
                      the AKS location. Vultr does not require it.
                    type: string
                  subscriptionId:
                    description: |-
                      SubscriptionID is the Azure subscription the AKS cluster lives in.
                      Ignored by other providers.
                    type: string
                  type:
                    default: auto
                    description: |-
                      Type selects the integration. "auto" detects the provider from node
                      providerID prefixes (vultr://, gce://, aws://, azure://).
                    enum:
                    - auto
                    - vultr
                    - gke
                    - eks
                    - aks
                    type: string
                type: object
              satellite:
                description: |-
                  Satellite configures outbound state reporting. Direct clusters may keep
                  their kubeconfig deployment connection while reporting via a satellite.
                properties:
                  autonomy:
                    default: Failover
                    description: |-
                      Autonomy selects what the satellite does while it cannot reach the
                      control plane. ObserveOnly keeps it a pure reporter; Failover hands
                      reconciliation over after FailoverTimeout; Delegated always reconciles
                      locally.
                    enum:
                    - ObserveOnly
                    - Failover
                    - Delegated
                    type: string
                  failoverTimeout:
                    default: 2m
                    description: |-
                      FailoverTimeout is how long a satellite in Failover mode waits without
                      control-plane contact before taking over reconciliation. Ignored in the
                      other modes.
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                  tokenSecretRef:
                    description: SecretRef references a Kubernetes Secret.
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                required:
                - tokenSecretRef
                type: object
              server:
                type: string
              serviceAccount:
                type: string
            required:
            - mode
            type: object
          status:
            description: ClusterStatus defines the observed state of a Cluster.
            properties:
              agentInfo:
                description: AgentInfo reports the status of an in-cluster agent.
                properties:
                  address:
                    type: string
                  connected:
                    format: date-time
                    type: string
                  version:
                    type: string
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              inventory:
                description: |-
                  Inventory is what the Kubernetes API reports about the cluster itself.
                  Populated on each successful health check; nil until the first one
                  completes.
                properties:
                  kubeletVersions:
                    items:
                      type: string
                    type: array
                  namespaceCount:
                    format: int32
                    type: integer
                  nodeCount:
                    format: int32
                    type: integer
                  podCount:
                    format: int32
                    type: integer
                  readyNodeCount:
                    format: int32
                    type: integer
                  regions:
                    items:
                      type: string
                    type: array
                  runningPodCount:
                    format: int32
                    type: integer
                  zones:
                    items:
                      type: string
                    type: array
                type: object
              lastHealthCheckTime:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: ClusterPhase represents the lifecycle phase of a Cluster.
                enum:
                - Pending
                - Healthy
                - Unhealthy
                - Disabled
                type: string
              provider:
                description: |-
                  Provider is what the cloud-provider integration observed. Detection
                  from node providerIDs always runs; the API-level fields (clusterID,
                  autoscaler bounds) only populate when the provider answered.
                properties:
                  clusterId:
                    type: string
                  nodePools:
                    items:
                      description: |-
                        ClusterNodePool describes one node pool as reported by the cloud provider
                        (or derived from node labels when no provider credential is configured).
                      properties:
                        allocatableCpuMillis:
                          description: |-
                            AllocatableCPUMillis and AllocatableMemoryBytes sum the pool nodes'
                            status.allocatable: the CPU and memory workloads can actually draw on.
                            Derived pools always carry them; API-enriched pools inherit them from
                            the derived set when the provider does not report a figure.
                          format: int64
                          type: integer
                        allocatableMemoryBytes:
                          format: int64
                          type: integer
                        autoScaled:
                          description: |-
                            AutoScaled reports whether the provider has the pool under autoscaler
                            control. Derived pools leave it false.
                          type: boolean
                        machineType:
                          type: string
                        maxNodes:
                          format: int32
                          type: integer
                        minNodes:
                          description: |-
                            MinNodes and MaxNodes are the autoscaler bounds. Zero when the pool is
                            not autoscaled or the bound is unknown.
                          format: int32
                          type: integer
                        name:
                          type: string
                        nodeCount:
                          format: int32
                          type: integer
                      required:
                      - name
                      - nodeCount
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  observedAt:
                    format: date-time
                    type: string
                  reason:
                    description: |-
                      Reason is a sanitized explanation for a non-OK state; it never carries
                      credential material or endpoint details.
                    type: string
                  region:
                    type: string
                  state:
                    enum:
                    - OK
                    - NotConfigured
                    - NotAvailable
                    - Error
                    - Forbidden
                    type: string
                  type:
                    description: Type is the provider the controller resolved, e.g.
                      "vultr".
                    type: string
                type: object
              satellite:
                description: |-
                  SatelliteStatus persists the accepted baseline across API replica restarts.
                  A kube-system UID binds a registration to the physical cluster; sessions and
                  sequences protect delta application against gaps and duplicate deliveries.
                properties:
                  activeOverrides:
                    description: |-
                      ActiveOverrides counts local actions taken during an outage that the
                      control plane has not acknowledged. Non-zero puts the cluster in
                      OverrideHeld so an operator sees it before the next push overwrites it.
                    format: int32
                    type: integer
                  applications:
                    items:
                      description: |-
                        SatelliteApplication is an observation, not a desired-state Application.
                        Namespace and logical identity keep deployments in different tenants apart.
                      properties:
                        health:
                          type: string
                        identity:
                          type: string
                        name:
                          type: string
                        namespace:
                          type: string
                        outOfSync:
                          format: int32
                          type: integer
                        phase:
                          type: string
                        project:
                          type: string
                        resourceCount:
                          format: int32
                          type: integer
                        sourceRevision:
                          type: string
                        syncKnown:
                          type: boolean
                      required:
                      - name
                      - namespace
                      type: object
                    maxItems: 2000
                    type: array
                    x-kubernetes-list-map-keys:
                    - namespace
                    - name
                    x-kubernetes-list-type: map
                  autonomousSince:
                    description: |-
                      AutonomousSince records when the satellite last took over
                      reconciliation. Cleared when the control plane resumes authority.
                    format: date-time
                    type: string
                  capacity:
                    description: |-
                      Capacity is the satellite's resource accounting. Nil until a report
                      carries it, and never synthesized from the control plane's own cluster.
                    properties:
                      cpuMillicores:
                        description: |-
                          SatelliteResourceUsage is one resource dimension as the satellite measured
                          it. Used is only meaningful when UsedKnown is true: a cluster without
                          metrics.k8s.io reports requests and allocatable, and says so rather than
                          claiming zero usage.
                        properties:
                          allocatable:
                            format: int64
                            type: integer
                          requested:
                            format: int64
                            type: integer
                          used:
                            format: int64
                            type: integer
                          usedKnown:
                            description: |-
                              UsedKnown reports whether the cluster served metrics.k8s.io. When false,
                              Used is zero because nothing was measured, not because nothing is running.
                            type: boolean
                        type: object
                      memoryBytes:
                        description: |-
                          SatelliteResourceUsage is one resource dimension as the satellite measured
                          it. Used is only meaningful when UsedKnown is true: a cluster without
                          metrics.k8s.io reports requests and allocatable, and says so rather than
                          claiming zero usage.
                        properties:
                          allocatable:
                            format: int64
                            type: integer
                          requested:
                            format: int64
                            type: integer
                          used:
                            format: int64
                            type: integer
                          usedKnown:
                            description: |-
                              UsedKnown reports whether the cluster served metrics.k8s.io. When false,
                              Used is zero because nothing was measured, not because nothing is running.
                            type: boolean
                        type: object
                      observedAt:
                        format: date-time
                        type: string
                    type: object
                  clusterUid:
                    type: string
                  effectivePolicies:
                    description: |-
                      EffectivePolicies is the intersection of the latest satellite claim and
                      the Cluster ceiling, with the wildcard expanded. It describes the
                      satellite transport, not direct-transport permissions. It is unknown
                      until a claim is recorded. An empty list indicates no claimed actions.
                    items:
                      description: |-
                        ManagementPolicy names one capability Paprika may exercise against a target
                        cluster. The vocabulary follows Crossplane's managementPolicies: a policy set
                        is an allow-list, so a nil set means "unspecified" and defaults to full
                        management, while an explicitly empty set grants nothing.

                        The set is evaluated per action, not per resource: a release that may Apply
                        but not Prune leaves removed manifests in the cluster rather than deleting
                        them, which is what an operator adopting an existing cluster needs.
                      enum:
                      - Observe
                      - Apply
                      - Prune
                      - Delete
                      - SelfHeal
                      - Rollout
                      - '*'
                      type: string
                    maxItems: 8
                    type: array
                  lastSeen:
                    format: date-time
                    type: string
                  nodePools:
                    description: |-
                      NodePools is the pool shape the satellite derived from node labels. It is
                      present without any provider credential, which is what makes node pools
                      visible for clusters the control plane cannot dial.
                    items:
                      description: |-
                        ClusterNodePool describes one node pool as reported by the cloud provider
                        (or derived from node labels when no provider credential is configured).
                      properties:
                        allocatableCpuMillis:
                          description: |-
                            AllocatableCPUMillis and AllocatableMemoryBytes sum the pool nodes'
                            status.allocatable: the CPU and memory workloads can actually draw on.
                            Derived pools always carry them; API-enriched pools inherit them from
                            the derived set when the provider does not report a figure.
                          format: int64
                          type: integer
                        allocatableMemoryBytes:
                          format: int64
                          type: integer
                        autoScaled:
                          description: |-
                            AutoScaled reports whether the provider has the pool under autoscaler
                            control. Derived pools leave it false.
                          type: boolean
                        machineType:
                          type: string
                        maxNodes:
                          format: int32
                          type: integer
                        minNodes:
                          description: |-
                            MinNodes and MaxNodes are the autoscaler bounds. Zero when the pool is
                            not autoscaled or the bound is unknown.
                          format: int32
                          type: integer
                        name:
                          type: string
                        nodeCount:
                          format: int32
                          type: integer
                      required:
                      - name
                      - nodeCount
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  operatingState:
                    description: |-
                      OperatingState is what the satellite is doing right now. It follows
                      spec.satellite.autonomy, but records which branch the satellite is in
                      rather than what the operator asked for.
                    enum:
                    - Connecting
                    - Connected
                    - Autonomous
                    - OverrideHeld
                    - Disabled
                    type: string
                  providerType:
                    description: |-
                      ProviderType is the cloud provider the satellite detected from node
                      providerID prefixes. Empty when detection found nothing.
                    type: string
                  reportDigest:
                    type: string
                  reportedPolicies:
                    description: |-
                      ReportedPolicies is the latest policy claim received from the satellite.
                      An absent field means that no claim has been recorded yet; an explicit
                      empty list claims no actions. A legacy report with no policies means the
                      default wildcard. This is an observation, not a permission grant.
                    items:
                      description: |-
                        ManagementPolicy names one capability Paprika may exercise against a target
                        cluster. The vocabulary follows Crossplane's managementPolicies: a policy set
                        is an allow-list, so a nil set means "unspecified" and defaults to full
                        management, while an explicitly empty set grants nothing.

                        The set is evaluated per action, not per resource: a release that may Apply
                        but not Prune leaves removed manifests in the cluster rather than deleting
                        them, which is what an operator adopting an existing cluster needs.
                      enum:
                      - Observe
                      - Apply
                      - Prune
                      - Delete
                      - SelfHeal
                      - Rollout
                      - '*'
                      type: string
                    maxItems: 8
                    type: array
                  retiredSessions:
                    items:
                      type: string
                    maxItems: 16
                    type: array
                  sequence:
                    format: int64
                    minimum: 1
                    type: integer
                  sessionId:
                    type: string
                required:
                - clusterUid
                - sequence
                - sessionId
                type: object
              version:
                type: string
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
