# Omega (VKE) deployment overrides — applied AFTER deploy/test-values.yaml on
# the shared omega cluster:
#
#   helm upgrade paprika-e2e charts/chart/ -n paprika-e2e \
#     -f deploy/test-values.yaml -f deploy/omega-values.yaml ...
#
# auth.basic stays enabled in test-values because the kind e2e suite uses
# admin/admin123 as the interactive stand-in user when exercising the OAuth
# consent flow on a localhost cluster. Omega is publicly exposed, so basic
# auth must be OFF here: the only interactive login is OIDC (Google) and the
# only machine auth path is OAuth 2.1 tokens (or HMAC-minted test tokens).
# Without these flags the binary's buildAuthConfig leaves basic auth
# unconfigured. CI's deploy-vke workflow applies this file too.
auth:
  basic:
    enabled: false

# The same reasoning applies to the HMAC secret that signs and verifies
# console, MCP and observability tokens: test-values commits a dev secret for
# kind, and anyone who reads this repository could mint tokens with it. On
# omega every component that signs or verifies tokens reads the secret from
# the paprika-auth-token Secret, which deploy-vke.yml creates from
# VKE_AUTH_TOKEN_SECRET before each upgrade. These lists replace test-values'
# extraEnv wholesale, so the dev value never renders here. A manual upgrade
# needs that Secret to exist in paprika-e2e first.
# Large private Git packs can exceed the test cluster’s 768Mi controller cap.
# Reserve memory on the existing 8Gi core pool; keep the dedicated search pool
# untouched and avoid evicting workloads on the smaller 4Gi nodes.
manager:
  # Keep the controller on the other existing large node when capacity permits,
  # leaving room for bounded CI workers on cf404. Allow fallback after replacement.
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: ["core-large-a2ff109d4a7d"]
  nodeSelector:
    node.kubernetes.io/instance-type: vc2-4c-8gb
  resources:
    requests:
      cpu: 500m
      # Reserve observed steady capacity; retain the 3Gi cap for Git bursts.
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 3Gi
  extraEnv:
    - name: PAPRIKA_AUTH_TOKEN_SECRET
      valueFrom:
        secretKeyRef:
          name: paprika-auth-token
          key: token-secret

apiServer:
  extraEnv:
    - name: PAPRIKA_AUTH_TOKEN_SECRET
      valueFrom:
        secretKeyRef:
          name: paprika-auth-token
          key: token-secret

# Git fetching: the git CLI blobless fetch (PR #165, step 2 of 2). Step 1 pinned
# go-git so the one-off source-hash change for charts holding executable files
# landed on its own; it shipped in Helm revision 69. auto uses the git CLI,
# whose hashes match go-git's, so this upgrade creates no Releases. To roll
# back without an image change, set repoServer.git.backend: go-git here.
# See charts/chart/values.yaml repoServer.git.
repoServer:
  git:
    backend: auto

