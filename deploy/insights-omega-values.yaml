# Layer over Omega's current release values. Keep image digests in the deployment
# command/receipt so this file does not downgrade unrelated Paprika components.
insights:
  enabled: true
  token:
    existingSecretName: paprika-insights-service-token
    existingSecretKey: token
  persistence:
    enabled: true
    # Reuse Omega's recovered retained volume; never provision an empty
    # replacement during an upgrade. The deployment preflight requires Bound.
    existingClaim: paprika-e2e-insights
    size: 10Gi
    storageClassName: vultr-block-storage-retain
  # Providers are discovered from the existing authorized Observe gateway.
  providers: []
  # Limits who can reach Insights on the shared cluster. Only the Insights policy
  # is rendered, and only the api-server and observability-gateway can reach it.
  # The other components keep networkPolicy.enabled (false here). Every Omega
  # provider is shared through the gateway, so Insights needs no egress extras.
  # See internal/insights/README.md "Network policy".
  networkPolicy:
    enabled: true
    # Empty list: DNS and the observability-gateway only. Any managed provider needs an
    # egress entry here before it is added.
    egress: []
