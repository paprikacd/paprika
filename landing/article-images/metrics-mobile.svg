<svg xmlns="http://www.w3.org/2000/svg" width="600" height="820" viewBox="0 0 600 820" role="img"><title>From instrumentation to an alert</title><desc>Observe the operator and its delivery activity with Prometheus. An absent sample is not a zero. Check scrape reachability before interpreting a quiet metric.</desc><g font-family="Arial, Helvetica, sans-serif" fill="#1d2d3d"><rect width="600" height="820" fill="#f2f2f3"/><text x="26" y="38" font-size="16" fill="#416180" letter-spacing="2">PAPRIKA / CONCEPT GUIDE</text><text x="26" y="78" font-size="30" font-weight="700">From instrumentation to an</text><text x="26" y="114" font-size="30" font-weight="700">alert</text><path d="M26 156l6-6h548l-6 6 M574 156l6-6v150l-6 6" fill="#e7f0f8" stroke="#b8c7d4"/><rect x="26" y="156" width="548" height="150" fill="#ffffff" stroke="#b8c7d4"/><text x="48" y="185" font-size="17" fill="#416180" letter-spacing="2">01</text><text x="48" y="218" font-size="25" font-weight="700">Instrument</text><g transform="translate(51 251) scale(.6)"><g transform="translate(0 0)" fill="none" stroke="#416180" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 54V8 M4 54H61 M12 39L23 27L34 34L47 12L58 20"/></g></g><text x="278" y="201" font-size="20" fill="#52677b">Controller + reconciliation</text><text x="278" y="234" font-size="20" fill="#52677b">Delivery, drift + pruning</text><text x="278" y="267" font-size="20" fill="#52677b">Expose /metrics</text><path d="M300 309v17m-5-5l5 5 5-5" fill="none" stroke="#416180" stroke-width="2"/><path d="M26 330l6-6h548l-6 6 M574 330l6-6v150l-6 6" fill="#e7f0f8" stroke="#b8c7d4"/><rect x="26" y="330" width="548" height="150" fill="#ffffff" stroke="#b8c7d4"/><text x="48" y="359" font-size="17" fill="#416180" letter-spacing="2">02</text><text x="48" y="392" font-size="25" font-weight="700">Scrape</text><g transform="translate(51 425) scale(.6)"><g transform="translate(0 0)" fill="none" stroke="#416180" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="32" cy="11" rx="25" ry="8"/><path d="M7 11V48C7 59 57 59 57 48V11 M7 29C7 40 57 40 57 29"/></g></g><text x="278" y="375" font-size="20" fill="#52677b">Prometheus target</text><text x="278" y="408" font-size="20" fill="#52677b">Metric labels + time series</text><text x="278" y="441" font-size="20" fill="#52677b">Confirm sample freshness</text><path d="M300 483v17m-5-5l5 5 5-5" fill="none" stroke="#416180" stroke-width="2"/><path d="M26 504l6-6h548l-6 6 M574 504l6-6v150l-6 6" fill="#e7f0f8" stroke="#b8c7d4"/><rect x="26" y="504" width="548" height="150" fill="#ffffff" stroke="#b8c7d4"/><text x="48" y="533" font-size="17" fill="#416180" letter-spacing="2">03</text><text x="48" y="566" font-size="25" font-weight="700">Evaluate</text><g transform="translate(51 599) scale(.6)"><g transform="translate(0 0)" fill="none" stroke="#416180" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="25" cy="25" r="20"/><path d="M40 40L60 60 M14 25H36 M25 14V36"/></g></g><text x="278" y="549" font-size="20" fill="#52677b">Query the relevant signal</text><text x="278" y="582" font-size="20" fill="#52677b">Choose a useful duration</text><text x="278" y="615" font-size="20" fill="#52677b">Adapt alert thresholds</text><path d="M26 686H574" stroke="#b8c7d4"/><text x="26" y="715" font-size="19" fill="#52677b">An absent sample is not a zero.</text><text x="26" y="739" font-size="19" fill="#52677b">Check scrape reachability before interpreting a</text><text x="26" y="763" font-size="19" fill="#52677b">quiet metric.</text></g></svg>
