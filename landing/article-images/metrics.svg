<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>From instrumentation to an alert</title><desc>Observe the operator and its delivery activity with Prometheus. An absent sample is not a zero. Check scrape reachability before interpreting a quiet metric.</desc><g font-family="Arial, Helvetica, sans-serif" fill="#1d2d3d"><rect width="1200" height="675" fill="#f2f2f3"/><text x="40" y="38" font-size="16" fill="#416180" letter-spacing="2">PAPRIKA / CONCEPT GUIDE</text><text x="40" y="94" font-size="38" font-weight="700">From instrumentation to an alert</text><text x="40" y="135" font-size="23" fill="#52677b">Observe the operator and its delivery activity with Prometheus.</text><path d="M40 184l6-6h352l-6 6 M392 184l6-6v340l-6 6" fill="#e7f0f8" stroke="#b8c7d4"/><rect x="40" y="184" width="352" height="340" fill="#ffffff" stroke="#b8c7d4"/><text x="62" y="213" font-size="17" fill="#416180" letter-spacing="2">01</text><text x="62" y="256" font-size="28" font-weight="700">Instrument</text><g transform="translate(64 289)" fill="none" stroke="#416180" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 54V8 M4 54H61 M12 39L23 27L34 34L47 12L58 20"/></g><path d="M62 375H370" stroke="#b8c7d4"/><text x="62" y="414" font-size="21" fill="#52677b">Controller + reconciliation</text><text x="62" y="446" font-size="21" fill="#52677b">Delivery, drift + pruning</text><text x="62" y="478" font-size="21" fill="#52677b">Expose /metrics</text><path d="M400 354h17m-5-5l5 5-5 5" fill="none" stroke="#416180" stroke-width="2"/><path d="M424 184l6-6h352l-6 6 M776 184l6-6v340l-6 6" fill="#e7f0f8" stroke="#b8c7d4"/><rect x="424" y="184" width="352" height="340" fill="#ffffff" stroke="#b8c7d4"/><text x="446" y="213" font-size="17" fill="#416180" letter-spacing="2">02</text><text x="446" y="256" font-size="28" font-weight="700">Scrape</text><g transform="translate(448 289)" fill="none" stroke="#416180" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="32" cy="11" rx="25" ry="8"/><path d="M7 11V48C7 59 57 59 57 48V11 M7 29C7 40 57 40 57 29"/></g><path d="M446 375H754" stroke="#b8c7d4"/><text x="446" y="414" font-size="21" fill="#52677b">Prometheus target</text><text x="446" y="446" font-size="21" fill="#52677b">Metric labels + time series</text><text x="446" y="478" font-size="21" fill="#52677b">Confirm sample freshness</text><path d="M784 354h17m-5-5l5 5-5 5" fill="none" stroke="#416180" stroke-width="2"/><path d="M808 184l6-6h352l-6 6 M1160 184l6-6v340l-6 6" fill="#e7f0f8" stroke="#b8c7d4"/><rect x="808" y="184" width="352" height="340" fill="#ffffff" stroke="#b8c7d4"/><text x="830" y="213" font-size="17" fill="#416180" letter-spacing="2">03</text><text x="830" y="256" font-size="28" font-weight="700">Evaluate</text><g transform="translate(832 289)" fill="none" stroke="#416180" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="25" cy="25" r="20"/><path d="M40 40L60 60 M14 25H36 M25 14V36"/></g><path d="M830 375H1138" stroke="#b8c7d4"/><text x="830" y="414" font-size="21" fill="#52677b">Query the relevant signal</text><text x="830" y="446" font-size="21" fill="#52677b">Choose a useful duration</text><text x="830" y="478" font-size="21" fill="#52677b">Adapt alert thresholds</text><path d="M40 560H1160" stroke="#b8c7d4"/><text x="40" y="594" font-size="22" fill="#52677b">An absent sample is not a zero.</text><text x="40" y="626" font-size="22" fill="#52677b">Check scrape reachability before interpreting a quiet metric.</text></g></svg>
