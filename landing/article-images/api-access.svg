<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>A request to Paprika</title><desc>The CLI and Connect-RPC API act on the same Kubernetes resource model. A request is not a completed rollout. Inspect the resulting resource and its observed state.</desc><g font-family="Arial, Helvetica, sans-serif" fill="#1d2d3d"><rect width="1200" height="675" fill="#f2f2f3"/><text x="40" y="38" font-size="16" fill="#416180" letter-spacing="2">PAPRIKA / CONCEPT GUIDE</text><text x="40" y="94" font-size="38" font-weight="700">A request to Paprika</text><text x="40" y="135" font-size="23" fill="#52677b">The CLI and Connect-RPC API act on the same Kubernetes resource model.</text><path d="M40 184l6-6h352l-6 6 M392 184l6-6v340l-6 6" fill="#e7f0f8" stroke="#b8c7d4"/><rect x="40" y="184" width="352" height="340" fill="#ffffff" stroke="#b8c7d4"/><text x="62" y="213" font-size="17" fill="#416180" letter-spacing="2">01</text><text x="62" y="256" font-size="28" font-weight="700">Client</text><g transform="translate(64 289)" fill="none" stroke="#416180" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="60" height="45" rx="2"/><path d="M3 16H61 M13 26L22 33L13 40 M29 40H44"/></g><path d="M62 375H370" stroke="#b8c7d4"/><text x="62" y="414" font-size="21" fill="#52677b">Paprika CLI</text><text x="62" y="446" font-size="21" fill="#52677b">Connect JSON request</text><text x="62" y="478" font-size="21" fill="#52677b">Read or delivery action</text><path d="M400 354h17m-5-5l5 5-5 5" fill="none" stroke="#416180" stroke-width="2"/><path d="M424 184l6-6h352l-6 6 M776 184l6-6v340l-6 6" fill="#e7f0f8" stroke="#b8c7d4"/><rect x="424" y="184" width="352" height="340" fill="#ffffff" stroke="#b8c7d4"/><text x="446" y="213" font-size="17" fill="#416180" letter-spacing="2">02</text><text x="446" y="256" font-size="28" font-weight="700">Paprika API</text><g transform="translate(448 289)" fill="none" stroke="#416180" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M32 3L56 12V28C56 44 42 54 32 61C22 54 8 44 8 28V12Z M21 31L29 39L44 23"/></g><path d="M446 375H754" stroke="#b8c7d4"/><text x="446" y="414" font-size="21" fill="#52677b">Authenticate the caller</text><text x="446" y="446" font-size="21" fill="#52677b">Check resource access</text><text x="446" y="478" font-size="21" fill="#52677b">Run the requested action</text><path d="M784 354h17m-5-5l5 5-5 5" fill="none" stroke="#416180" stroke-width="2"/><path d="M808 184l6-6h352l-6 6 M1160 184l6-6v340l-6 6" fill="#e7f0f8" stroke="#b8c7d4"/><rect x="808" y="184" width="352" height="340" fill="#ffffff" stroke="#b8c7d4"/><text x="830" y="213" font-size="17" fill="#416180" letter-spacing="2">03</text><text x="830" y="256" font-size="28" font-weight="700">Kubernetes records</text><g transform="translate(832 289)" fill="none" stroke="#416180" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="23" height="23"/><rect x="38" y="4" width="23" height="23"/><rect x="21" y="39" width="23" height="23"/><path d="M14 27V33H49V27 M32 33V39"/></g><path d="M830 375H1138" stroke="#b8c7d4"/><text x="830" y="414" font-size="21" fill="#52677b">Applications + Releases</text><text x="830" y="446" font-size="21" fill="#52677b">Pipelines + related CRs</text><text x="830" y="478" font-size="21" fill="#52677b">Read back the result</text><path d="M40 560H1160" stroke="#b8c7d4"/><text x="40" y="594" font-size="22" fill="#52677b">A request is not a completed rollout.</text><text x="40" y="626" font-size="22" fill="#52677b">Inspect the resulting resource and its observed state.</text></g></svg>
