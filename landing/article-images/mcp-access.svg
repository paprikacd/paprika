<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>Connect a client to the right surface</title><desc>Codex, Claude Code and other remote MCP clients use native OAuth. Fleet and Observe use distinct token audiences and permissions. Installing a plugin does not grant access to a server.</desc><g font-family="Arial, Helvetica, sans-serif" fill="#1d2d3d"><rect width="1200" height="675" fill="#f2f2f3"/><text x="40" y="38" font-size="16" fill="#416180" letter-spacing="2">PAPRIKA / CONCEPT GUIDE</text><text x="40" y="94" font-size="38" font-weight="700">Connect a client to the right surface</text><text x="40" y="135" font-size="23" fill="#52677b">Codex, Claude Code and other remote MCP clients use native OAuth.</text><path d="M40 184l6-6h352l-6 6 M392 184l6-6v340l-6 6" fill="#e7f0f8" stroke="#b8c7d4"/><rect x="40" y="184" width="352" height="340" fill="#ffffff" stroke="#b8c7d4"/><text x="62" y="213" font-size="17" fill="#416180" letter-spacing="2">01</text><text x="62" y="256" font-size="28" font-weight="700">Configure client</text><g transform="translate(64 289)" fill="none" stroke="#416180" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="60" height="45" rx="2"/><path d="M3 16H61 M13 26L22 33L13 40 M29 40H44"/></g><path d="M62 375H370" stroke="#b8c7d4"/><text x="62" y="414" font-size="21" fill="#52677b">Plugin or endpoint setup</text><text x="62" y="446" font-size="21" fill="#52677b">Your Paprika server URL</text><text x="62" y="478" font-size="21" fill="#52677b">Fleet or Observe surface</text><path d="M400 354h17m-5-5l5 5-5 5" fill="none" stroke="#416180" stroke-width="2"/><path d="M424 184l6-6h352l-6 6 M776 184l6-6v340l-6 6" fill="#e7f0f8" stroke="#b8c7d4"/><rect x="424" y="184" width="352" height="340" fill="#ffffff" stroke="#b8c7d4"/><text x="446" y="213" font-size="17" fill="#416180" letter-spacing="2">02</text><text x="446" y="256" font-size="28" font-weight="700">Sign in</text><g transform="translate(448 289)" fill="none" stroke="#416180" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M32 3L56 12V28C56 44 42 54 32 61C22 54 8 44 8 28V12Z M21 31L29 39L44 23"/></g><path d="M446 375H754" stroke="#b8c7d4"/><text x="446" y="414" font-size="21" fill="#52677b">Native OAuth flow</text><text x="446" y="446" font-size="21" fill="#52677b">Review requested access</text><text x="446" y="478" font-size="21" fill="#52677b">Keep credentials private</text><path d="M784 354h17m-5-5l5 5-5 5" fill="none" stroke="#416180" stroke-width="2"/><path d="M808 184l6-6h352l-6 6 M1160 184l6-6v340l-6 6" fill="#e7f0f8" stroke="#b8c7d4"/><rect x="808" y="184" width="352" height="340" fill="#ffffff" stroke="#b8c7d4"/><text x="830" y="213" font-size="17" fill="#416180" letter-spacing="2">03</text><text x="830" y="256" font-size="28" font-weight="700">Verify access</text><g transform="translate(832 289)" fill="none" stroke="#416180" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="25" cy="25" r="20"/><path d="M40 40L60 60 M14 25H36 M25 14V36"/></g><path d="M830 375H1138" stroke="#b8c7d4"/><text x="830" y="414" font-size="21" fill="#52677b">/mcp: fleet tools</text><text x="830" y="446" font-size="21" fill="#52677b">/observe/mcp: telemetry</text><text x="830" y="478" font-size="21" fill="#52677b">Discover authorized tools</text><path d="M40 560H1160" stroke="#b8c7d4"/><text x="40" y="594" font-size="22" fill="#52677b">Fleet and Observe use distinct token audiences and permissions.</text><text x="40" y="626" font-size="22" fill="#52677b">Installing a plugin does not grant access to a server.</text></g></svg>
