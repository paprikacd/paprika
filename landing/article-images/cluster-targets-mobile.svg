<svg xmlns="http://www.w3.org/2000/svg" width="600" height="820" viewBox="0 0 600 820" role="img"><title>Choose where a Stage deploys</title><desc>A Cluster registration describes the target connection. Satellite reports carry observed state back to the control plane. Reporting alone does not establish a working deployment transport.</desc><g font-family="Arial, Helvetica, sans-serif" fill="#1d2d3d"><rect width="600" height="820" fill="#f2f2f3"/><text x="26" y="38" font-size="16" fill="#416180" letter-spacing="2">PAPRIKA / CONCEPT GUIDE</text><text x="26" y="78" font-size="30" font-weight="700">Choose where a Stage deploys</text><path d="M26 156l6-6h548l-6 6 M574 156l6-6v150l-6 6" fill="#e7f0f8" stroke="#b8c7d4"/><rect x="26" y="156" width="548" height="150" fill="#ffffff" stroke="#b8c7d4"/><text x="48" y="185" font-size="17" fill="#416180" letter-spacing="2">01</text><text x="48" y="218" font-size="25" font-weight="700">Application</text><g transform="translate(51 251) scale(.6)"><g transform="translate(0 0)" fill="none" stroke="#416180" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H43L54 13V60H13Z M43 2V13H54 M23 26H43 M23 36H43 M23 46H37"/></g></g><text x="278" y="201" font-size="20" fill="#52677b">Release + rendered YAML</text><text x="278" y="234" font-size="20" fill="#52677b">Stage selects a Cluster</text><text x="278" y="267" font-size="20" fill="#52677b">Target-specific settings</text><path d="M300 309v17m-5-5l5 5 5-5" fill="none" stroke="#416180" stroke-width="2"/><path d="M26 330l6-6h548l-6 6 M574 330l6-6v150l-6 6" fill="#e7f0f8" stroke="#b8c7d4"/><rect x="26" y="330" width="548" height="150" fill="#ffffff" stroke="#b8c7d4"/><text x="48" y="359" font-size="17" fill="#416180" letter-spacing="2">02</text><text x="48" y="392" font-size="25" font-weight="700">Connection mode</text><g transform="translate(51 425) scale(.6)"><g transform="translate(0 0)" fill="none" stroke="#416180" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 32H24 M24 32V12H55 M24 32V52H55 M48 5L55 12L48 19 M48 45L55 52L48 59"/></g></g><text x="278" y="375" font-size="20" fill="#52677b">in-cluster: local account</text><text x="278" y="408" font-size="20" fill="#52677b">direct: target API access</text><text x="278" y="441" font-size="20" fill="#52677b">agent: reachable apply agent</text><path d="M300 483v17m-5-5l5 5 5-5" fill="none" stroke="#416180" stroke-width="2"/><path d="M26 504l6-6h548l-6 6 M574 504l6-6v150l-6 6" fill="#e7f0f8" stroke="#b8c7d4"/><rect x="26" y="504" width="548" height="150" fill="#ffffff" stroke="#b8c7d4"/><text x="48" y="533" font-size="17" fill="#416180" letter-spacing="2">03</text><text x="48" y="566" font-size="25" font-weight="700">Target cluster</text><g transform="translate(51 599) scale(.6)"><g transform="translate(0 0)" fill="none" stroke="#416180" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="23" height="23"/><rect x="38" y="4" width="23" height="23"/><rect x="21" y="39" width="23" height="23"/><path d="M14 27V33H49V27 M32 33V39"/></g></g><text x="278" y="549" font-size="20" fill="#52677b">Namespaced resources</text><text x="278" y="582" font-size="20" fill="#52677b">Workload health + sync</text><text x="278" y="615" font-size="20" fill="#52677b">Satellite reports if enabled</text><path d="M26 686H574" stroke="#b8c7d4"/><text x="26" y="715" font-size="19" fill="#52677b">Satellite reports carry observed state back to</text><text x="26" y="739" font-size="19" fill="#52677b">the control plane.</text><text x="26" y="763" font-size="19" fill="#52677b">Reporting alone does not establish a working</text><text x="26" y="787" font-size="19" fill="#52677b">deployment transport.</text></g></svg>
