<svg xmlns="http://www.w3.org/2000/svg" width="600" height="820" viewBox="0 0 600 820" role="img"><title>Build a dashboard from real queries</title><desc>Provider discovery, saved queries and widgets form one explicit chain. A saved document does not prove its queries work. Dashboard authoring requires write scope and human Insights permissions.</desc><g font-family="Arial, Helvetica, sans-serif" fill="#1d2d3d"><rect width="600" height="820" fill="#f2f2f3"/><text x="26" y="38" font-size="16" fill="#416180" letter-spacing="2">PAPRIKA / CONCEPT GUIDE</text><text x="26" y="78" font-size="30" font-weight="700">Build a dashboard from real</text><text x="26" y="114" font-size="30" font-weight="700">queries</text><path d="M26 156l6-6h548l-6 6 M574 156l6-6v150l-6 6" fill="#e7f0f8" stroke="#b8c7d4"/><rect x="26" y="156" width="548" height="150" fill="#ffffff" stroke="#b8c7d4"/><text x="48" y="185" font-size="17" fill="#416180" letter-spacing="2">01</text><text x="48" y="218" font-size="25" font-weight="700">Discover</text><g transform="translate(51 251) scale(.6)"><g transform="translate(0 0)" fill="none" stroke="#416180" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="25" cy="25" r="20"/><path d="M40 40L60 60 M14 25H36 M25 14V36"/></g></g><text x="278" y="201" font-size="20" fill="#52677b">Canonical provider IDs</text><text x="278" y="234" font-size="20" fill="#52677b">Actual metrics + labels</text><text x="278" y="267" font-size="20" fill="#52677b">Execute a bounded query</text><path d="M300 309v17m-5-5l5 5 5-5" fill="none" stroke="#416180" stroke-width="2"/><path d="M26 330l6-6h548l-6 6 M574 330l6-6v150l-6 6" fill="#e7f0f8" stroke="#b8c7d4"/><rect x="26" y="330" width="548" height="150" fill="#ffffff" stroke="#b8c7d4"/><text x="48" y="359" font-size="17" fill="#416180" letter-spacing="2">02</text><text x="48" y="392" font-size="25" font-weight="700">Bind</text><g transform="translate(51 425) scale(.6)"><g transform="translate(0 0)" fill="none" stroke="#416180" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="58" height="56"/><rect x="11" y="13" width="17" height="13"/><rect x="36" y="13" width="17" height="13"/><rect x="11" y="35" width="42" height="17"/></g></g><text x="278" y="375" font-size="20" fill="#52677b">Saved query + parameters</text><text x="278" y="408" font-size="20" fill="#52677b">Widgets + provider IDs</text><text x="278" y="441" font-size="20" fill="#52677b">Exact ETag when editing</text><path d="M300 483v17m-5-5l5 5 5-5" fill="none" stroke="#416180" stroke-width="2"/><path d="M26 504l6-6h548l-6 6 M574 504l6-6v150l-6 6" fill="#e7f0f8" stroke="#b8c7d4"/><rect x="26" y="504" width="548" height="150" fill="#ffffff" stroke="#b8c7d4"/><text x="48" y="533" font-size="17" fill="#416180" letter-spacing="2">03</text><text x="48" y="566" font-size="25" font-weight="700">Verify</text><g transform="translate(51 599) scale(.6)"><g transform="translate(0 0)" fill="none" stroke="#416180" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="28"/><path d="M17 32L28 43L48 21"/></g></g><text x="278" y="549" font-size="20" fill="#52677b">Run query_dashboard</text><text x="278" y="582" font-size="20" fill="#52677b">Inspect freshness + errors</text><text x="278" y="615" font-size="20" fill="#52677b">Review the rendered layout</text><path d="M26 686H574" stroke="#b8c7d4"/><text x="26" y="715" font-size="19" fill="#52677b">A saved document does not prove its queries work.</text><text x="26" y="739" font-size="19" fill="#52677b">Dashboard authoring requires write scope and</text><text x="26" y="763" font-size="19" fill="#52677b">human Insights permissions.</text></g></svg>
