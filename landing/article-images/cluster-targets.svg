<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>Choose where a Stage deploys</title><desc>A Cluster registration describes the target connection. Satellite reports carry observed state back to the control plane. Reporting alone does not establish a working deployment transport.</desc><g font-family="Arial, Helvetica, sans-serif" fill="#1d2d3d"><rect width="1200" height="675" fill="#f2f2f3"/><text x="40" y="38" font-size="16" fill="#416180" letter-spacing="2">PAPRIKA / CONCEPT GUIDE</text><text x="40" y="94" font-size="38" font-weight="700">Choose where a Stage deploys</text><text x="40" y="135" font-size="23" fill="#52677b">A Cluster registration describes the target connection.</text><path d="M40 184l6-6h352l-6 6 M392 184l6-6v340l-6 6" fill="#e7f0f8" stroke="#b8c7d4"/><rect x="40" y="184" width="352" height="340" fill="#ffffff" stroke="#b8c7d4"/><text x="62" y="213" font-size="17" fill="#416180" letter-spacing="2">01</text><text x="62" y="256" font-size="28" font-weight="700">Application</text><g transform="translate(64 289)" fill="none" stroke="#416180" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H43L54 13V60H13Z M43 2V13H54 M23 26H43 M23 36H43 M23 46H37"/></g><path d="M62 375H370" stroke="#b8c7d4"/><text x="62" y="414" font-size="21" fill="#52677b">Release + rendered YAML</text><text x="62" y="446" font-size="21" fill="#52677b">Stage selects a Cluster</text><text x="62" y="478" font-size="21" fill="#52677b">Target-specific settings</text><path d="M400 354h17m-5-5l5 5-5 5" fill="none" stroke="#416180" stroke-width="2"/><path d="M424 184l6-6h352l-6 6 M776 184l6-6v340l-6 6" fill="#e7f0f8" stroke="#b8c7d4"/><rect x="424" y="184" width="352" height="340" fill="#ffffff" stroke="#b8c7d4"/><text x="446" y="213" font-size="17" fill="#416180" letter-spacing="2">02</text><text x="446" y="256" font-size="28" font-weight="700">Connection mode</text><g transform="translate(448 289)" fill="none" stroke="#416180" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 32H24 M24 32V12H55 M24 32V52H55 M48 5L55 12L48 19 M48 45L55 52L48 59"/></g><path d="M446 375H754" stroke="#b8c7d4"/><text x="446" y="414" font-size="21" fill="#52677b">in-cluster: local account</text><text x="446" y="446" font-size="21" fill="#52677b">direct: target API access</text><text x="446" y="478" font-size="21" fill="#52677b">agent: reachable apply agent</text><path d="M784 354h17m-5-5l5 5-5 5" fill="none" stroke="#416180" stroke-width="2"/><path d="M808 184l6-6h352l-6 6 M1160 184l6-6v340l-6 6" fill="#e7f0f8" stroke="#b8c7d4"/><rect x="808" y="184" width="352" height="340" fill="#ffffff" stroke="#b8c7d4"/><text x="830" y="213" font-size="17" fill="#416180" letter-spacing="2">03</text><text x="830" y="256" font-size="28" font-weight="700">Target cluster</text><g transform="translate(832 289)" fill="none" stroke="#416180" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="23" height="23"/><rect x="38" y="4" width="23" height="23"/><rect x="21" y="39" width="23" height="23"/><path d="M14 27V33H49V27 M32 33V39"/></g><path d="M830 375H1138" stroke="#b8c7d4"/><text x="830" y="414" font-size="21" fill="#52677b">Namespaced resources</text><text x="830" y="446" font-size="21" fill="#52677b">Workload health + sync</text><text x="830" y="478" font-size="21" fill="#52677b">Satellite reports if enabled</text><path d="M40 560H1160" stroke="#b8c7d4"/><text x="40" y="594" font-size="22" fill="#52677b">Satellite reports carry observed state back to the control plane.</text><text x="40" y="626" font-size="22" fill="#52677b">Reporting alone does not establish a working deployment transport.</text></g></svg>
