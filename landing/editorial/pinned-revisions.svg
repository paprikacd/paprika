 <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102334"/><stop offset=".62" stop-color="#1d3449"/><stop offset="1" stop-color="#112334"/></linearGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#81a6c1" stroke-width=".8" stroke-opacity=".13"/></pattern>
 <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#99c6ef" stop-opacity=".35"/><stop offset="1" stop-color="#99c6ef" stop-opacity="0"/></linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#night)"/>
<rect width="1200" height="675" fill="url(#grid)"/>
