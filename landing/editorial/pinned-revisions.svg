<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="art-title art-desc">
<title id="art-title">One pinned revision across deployment environments</title><desc id="art-desc">A source revision follows dev and staging verification while production preserves its accepted release.</desc>
