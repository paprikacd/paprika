1" aria-pressed="false">Optional approval</button><button type="button" data-step="2" aria-pressed="false">Preview handoff</button></div><p id="mechanism-description" role="status" aria-live="polite">A downstream Application can run configured tests; a stage can also use an HTTP smoke check or duration gate.</p></main><script>(() => {
    const details=[{"key":"verify","label":"Verification","readout":"01 / VERIFY","detail":"A downstream Application can run configured tests; a stage can also use an HTTP smoke check or duration gate."},{"key":"approval","label":"Optional approval","readout":"02 / APPROVAL","detail":"Manual approval is optional. When configured, it holds this candidate until an explicit approval action."},{"key":"next","label":"Preview handoff","readout":"03 / NEXT STAGE","detail":"After required checks and approval clear, a separate Application can deploy the same pinned Git commit. This is only an illustration."}];
    const buttons=[...document.querySelectorAll('[data-step]')];
    const svg=document.querySelector('.iso-svg');
    const assemblies=[...svg.querySelectorAll('[data-assembly]')];
    const readout=document.querySelector('[data-readout]');
    const description=document.querySelector('#mechanism-description');
    const index=document.querySelector('#pipeline-index');
    const shifts=[];
    const lift=document.querySelector('#promotion-lift');
    const liftShift=[0,-127.8571525122893];
    function select(i, focus=false) {
      const item=details[i];
      buttons.forEach((button,n)=>button.setAttribute('aria-pressed',String(n===i)));
      assemblies.forEach(node=>node.setAttribute('data-on',String(node.dataset.assembly===item.key)));
      if (index) index.setAttribute('transform','translate('+shifts[i][0]+' '+shifts[i][1]+')');
      if (lift) lift.setAttribute('transform',i===2?'translate('+liftShift[0]+' '+liftShift[1]+')':'translate(0 0)');
      readout.textContent=item.readout;
      description.textContent=item.detail;
      if (focus) buttons[i].focus();
    }
    buttons.forEach((button,i)=>{
      button.addEventListener('click',()=>select(i));
      button.addEventListener('keydown',event=>{
        const n={ArrowRight:(i+1)%buttons.length,ArrowDown:(i+1)%buttons.length,ArrowLeft:(i-1+buttons.length)%buttons.length,ArrowUp:(i-1+buttons.length)%buttons.length,Home:0,End:buttons.length-1}[event.key];
        if(n===undefined)return;
        event.preventDefault();select(n,true);
      });
    });
    select(0);
  })();</script></body></html>
