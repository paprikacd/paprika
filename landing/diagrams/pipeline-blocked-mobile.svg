<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 880" width="600" height="880" role="img" aria-labelledby="title desc"><title id="title">A failed prerequisite stops dependent work</title><desc id="desc">Illustrative Pipeline with maxParallel two. Build succeeds, then unit-test and policy-test can run concurrently. Policy-test fails and package cannot start. Artifacts are declared output references, not automatic environment promotion.</desc><!-- Isometric geometry: Anatomy, Copyright (c) 2026 Ryan, MIT. See ../anatomy/LICENSE. --><style>text{font-family:Arial,Helvetica,sans-serif;fill:#293b4d}.body{font-size:18px}.small{font-size:16px;fill:#566c80}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:17px}.kicker{font-size:13px;font-weight:700;letter-spacing:1.2px;fill:#566c80}.card-title{font-size:23px;font-weight:700;fill:#1d2d3d}.heading{font-size:29px;font-weight:700;fill:#1d2d3d}.subtitle{font-size:18px;fill:#566c80}.region{font-size:14px;font-weight:700;letter-spacing:1px;fill:#416180}.chip{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;font-weight:600}.status{font-size:18px;font-weight:600}.status-glyph{fill:white;font-size:16px;font-weight:700}.big-number{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:44px;font-weight:600}.iso-fill{fill:var(--anatomy-paper);stroke:none}.iso-top{fill:var(--anatomy-top)}.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}.iso-line{fill:none;stroke:var(--anatomy-hi);stroke-width:.8;stroke-linejoin:round}.iso-crease{stroke:var(--anatomy-faint);stroke-width:.6} .body{font-size:23px}.small{font-size:20px}.mono{font-size:21px}.kicker{font-size:17px}.card-title{font-size:28px}.heading{font-size:32px}.subtitle{font-size:22px}.region{font-size:19px}.chip{font-size:19px}.status{font-size:22px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#416180" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#986317" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#a63d3d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="600" height="880" fill="#f2f2f3"/><text x="28" y="40" class="heading" >A failed test blocks</text><text x="28" y="77" class="heading" >dependent work.</text><text x="28" y="120" class="subtitle" >Illustrative Pipeline · maxParallel: 2</text><rect x="20" y="150" width="560" height="615" rx="4" fill="#ffffff" fill-opacity=".65" stroke="#bac7d1" stroke-dasharray="4 5"/><text x="36" y="178" class="region" >MANAGEMENT CLUSTER</text><path d="M300 334 L300 370 L165 370 L165 410" fill="none" stroke="#416180" stroke-width="2" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M300 370 L435 370 L435 410" fill="none" stroke="#416180" stroke-width="2" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M165 552 L165 589 L300 589 L300 627" fill="none" stroke="#a63d3d" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5 6" marker-end="url(#arrow-red)"/><path d="M435 552 L435 589 L300 589" fill="none" stroke="#a63d3d" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5 6" /><g><path d="M155 220l7-7h282l-7 7Z" fill="#ffffff" stroke="#bac7d1"/><path d="M437 220l7-7v114l-7 7Z" fill="#e7f0f8" stroke="#bac7d1"/><rect x="155" y="220" width="282" height="114" rx="3" fill="#ffffff" stroke="#bac7d1" stroke-width="1.4"/><text x="173" y="246" class="kicker" >STEP 01</text><text x="173" y="289" class="card-title" >build</text><path d="M173 306 L419 306" fill="none" stroke="#bac7d1" stroke-width="1" stroke-linejoin="round"  /><circle cx="178" cy="317" r="10" fill="#2f6955"/><text x="178" y="322" class="status-glyph" text-anchor="middle">✓</text><text x="196" y="323" class="status" style="fill:#2f6955" font-size="18">Succeeded</text></g><g><path d="M48 414l7-7h231l-7 7Z" fill="#ffffff" stroke="#bac7d1"/><path d="M279 414l7-7v140l-7 7Z" fill="#e7f0f8" stroke="#bac7d1"/><rect x="48" y="414" width="231" height="140" rx="3" fill="#ffffff" stroke="#bac7d1" stroke-width="1.4"/><text x="66" y="440" class="kicker" >DEPENDS: BUILD</text><text x="66" y="483" class="card-title" >unit-test</text><path d="M66 500 L261 500" fill="none" stroke="#bac7d1" stroke-width="1" stroke-linejoin="round"  /><circle cx="70" cy="523" r="10" fill="#2f6955"/><text x="70" y="528" class="status-glyph" text-anchor="middle">✓</text><text x="88" y="529" class="status" style="fill:#2f6955" font-size="18">Succeeded</text></g><g><path d="M321 414l7-7h231l-7 7Z" fill="#ffffff" stroke="#a63d3d"/><path d="M552 414l7-7v140l-7 7Z" fill="#e7f0f8" stroke="#a63d3d"/><rect x="321" y="414" width="231" height="140" rx="3" fill="#fae8e5" stroke="#a63d3d" stroke-width="1.4"/><text x="339" y="440" class="kicker" >DEPENDS: BUILD</text><text x="339" y="483" class="card-title" >policy-test</text><path d="M339 500 L534 500" fill="none" stroke="#bac7d1" stroke-width="1" stroke-linejoin="round"  /><circle cx="343" cy="523" r="10" fill="#a63d3d"/><text x="343" y="528" class="status-glyph" text-anchor="middle">×</text><text x="361" y="529" class="status" style="fill:#a63d3d" font-size="18">Failed</text></g><g><path d="M155 632l7-7h282l-7 7Z" fill="#ffffff" stroke="#a63d3d"/><path d="M437 632l7-7v114l-7 7Z" fill="#e7f0f8" stroke="#a63d3d"/><rect x="155" y="632" width="282" height="114" rx="3" fill="#fae8e5" stroke="#a63d3d" stroke-width="1.4"/><text x="173" y="658" class="kicker" >DEPENDS: BOTH TESTS</text><text x="173" y="701" class="card-title" >package</text><path d="M173 718 L419 718" fill="none" stroke="#bac7d1" stroke-width="1" stroke-linejoin="round"  /><circle cx="178" cy="729" r="10" fill="#a63d3d"/><text x="178" y="734" class="status-glyph" text-anchor="middle">×</text><text x="196" y="735" class="status" style="fill:#a63d3d" font-size="18">Blocked</text></g><text x="30" y="810" class="body" >Outputs are declared references.</text><text x="30" y="842" class="small" >Example: oci://…/package:9f3a2c1</text></svg>
