<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 910" width="600" height="910" role="img" aria-labelledby="title desc"><title id="title">From source revision to observed deployment</title><desc id="desc">Illustrative deployment lifecycle. An Application source is pinned to Git revision 9f3a2c1. An optional Pipeline runs configured work. A Release renders manifests and applies to a Kubernetes target selected by Stage.cluster. Target health and desired/live synchronization are observed separately.</desc><!-- Isometric geometry: Anatomy, Copyright (c) 2026 Ryan, MIT. See ../anatomy/LICENSE. --><style>text{font-family:Arial,Helvetica,sans-serif;fill:#293b4d}.body{font-size:18px}.small{font-size:16px;fill:#566c80}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:17px}.kicker{font-size:13px;font-weight:700;letter-spacing:1.2px;fill:#566c80}.card-title{font-size:23px;font-weight:700;fill:#1d2d3d}.heading{font-size:29px;font-weight:700;fill:#1d2d3d}.subtitle{font-size:18px;fill:#566c80}.region{font-size:14px;font-weight:700;letter-spacing:1px;fill:#416180}.chip{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;font-weight:600}.status{font-size:18px;font-weight:600}.status-glyph{fill:white;font-size:16px;font-weight:700}.big-number{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:44px;font-weight:600}.iso-fill{fill:var(--anatomy-paper);stroke:none}.iso-top{fill:var(--anatomy-top)}.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}.iso-line{fill:none;stroke:var(--anatomy-hi);stroke-width:.8;stroke-linejoin:round}.iso-crease{stroke:var(--anatomy-faint);stroke-width:.6} .body{font-size:23px}.small{font-size:20px}.mono{font-size:21px}.kicker{font-size:17px}.card-title{font-size:28px}.heading{font-size:32px}.subtitle{font-size:22px}.region{font-size:19px}.chip{font-size:19px}.status{font-size:22px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#416180" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#986317" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#a63d3d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="600" height="910" fill="#f2f2f3"/><text x="28" y="42" class="heading" >Source → Release → target</text><text x="28" y="76" class="subtitle" >A pinned revision becomes a deployment,</text><text x="28" y="104" class="subtitle" >then Paprika observes the live resources.</text><rect x="20" y="135" width="560" height="428" rx="4" fill="#ffffff" fill-opacity=".65" stroke="#bac7d1" stroke-dasharray="4 5"/><text x="36" y="163" class="region" >MANAGEMENT CLUSTER</text><path d="M300 295 L300 332" fill="none" stroke="#416180" stroke-width="2" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M300 424 L300 461" fill="none" stroke="#416180" stroke-width="2" stroke-linejoin="round"  marker-end="url(#arrow)"/><g><path d="M55 192l7-7h484l-7 7Z" fill="#ffffff" stroke="#bac7d1"/><path d="M539 192l7-7v104l-7 7Z" fill="#e7f0f8" stroke="#bac7d1"/><rect x="55" y="192" width="484" height="104" rx="3" fill="#ffffff" stroke="#bac7d1" stroke-width="1.4"/><text x="73" y="218" class="kicker" >01 / SOURCE</text><path d="M77 240v31m0-13c0-12 23-3 23-16" fill="none" stroke="#416180" stroke-width="2.5"/><circle cx="77" cy="240" r="4" fill="#ff