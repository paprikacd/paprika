syntax = "proto3";

package paprika.insights.v1;

option go_package = "github.com/benebsworth/paprika/internal/api/paprika/insights/v1;insightsv1";

// Severity ranks a finding. Only error findings reject a save; warnings and
// info are advisory and never change whether a dashboard is stored.
enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_INFO = 1;
  SEVERITY_WARNING = 2;
  SEVERITY_ERROR = 3;
}

// Source names the check family that produced a finding. Save-time validation
// reports SOURCE_SCHEMA; the lint, data and visual families share the shape.
enum Source {
  SOURCE_UNSPECIFIED = 0;
  SOURCE_SCHEMA = 1;
  SOURCE_LINT = 2;
  SOURCE_DATA = 3;
  SOURCE_VISUAL = 4;
}

// CheckFinding locates one problem in a submitted dashboard document. Pointer
// is an RFC 6901 JSON Pointer into that document, for example
// /widgets/2/options/thresholds/1; it is empty when the problem concerns the
// whole document. Message and fix are short, fixed text, never upstream output.
message CheckFinding {
  string rule_id = 1;
  Severity severity = 2;
  Source source = 3;
  string widget_id = 4;
  string pointer = 5;
  string message = 6;
  string fix = 7;
}

// CheckReport is the result of a dry run. Findings holds at most 32 entries;
// total counts every finding, so truncated is true when some were omitted.
message CheckReport {
  repeated CheckFinding findings = 1;
  uint32 total = 2;
  bool truncated = 3;
}
