syntax = "proto3";

package paprika.insights.v1;

option go_package = "github.com/benebsworth/paprika/internal/api/paprika/insights/v1;insightsv1";

// Wire form: every JSON encoding of these messages is protojson with the
// standard names. Enum values appear as their proto names (SEVERITY_ERROR,
// SOURCE_SCHEMA) and fields as lowerCamelCase (ruleId). Lowercase words such
// as "error" appear only in prose: MCP text and UI labels.

// Severity ranks a finding. Only error findings reject a save; warnings and
// info are advisory and never change whether a dashboard is stored.
enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_INFO = 1;
  SEVERITY_WARNING = 2;
  SEVERITY_ERROR = 3;
}

// Source names the check family that produced a finding. Save-time validation
// reports SOURCE_SCHEMA; the lint, data and visual families share the shape.
enum Source {
  SOURCE_UNSPECIFIED = 0;
  SOURCE_SCHEMA = 1;
  SOURCE_LINT = 2;
  SOURCE_DATA = 3;
  SOURCE_VISUAL = 4;
}

// CheckFinding locates one problem in a submitted dashboard document. Pointer
// is an RFC 6901 JSON Pointer into that document: /widgets/2 names a widget,
// /widgets/2/layout a field of it, and the empty string the whole document.
// Message and fix are short, fixed text, never upstream output.
message CheckFinding {
  string rule_id = 1;
  Severity severity = 2;
  Source source = 3;
  string widget_id = 4;
  string pointer = 5;
  string message = 6;
  string fix = 7;
}

// CheckReport is the one list shape for issues: the 400 response to a rejected
// save and the validate dry run both carry it. Issues holds at most 32 entries;
// total counts every finding, and truncated is true when some were omitted.
// The per-severity counts cover every finding, not only the listed ones, so a
// truncated list never understates how many errors a check found.
message CheckReport {
  repeated CheckFinding issues = 1;
  uint32 total = 2;
  bool truncated = 3;
  uint32 error_count = 4;
  uint32 warning_count = 5;
  uint32 info_count = 6;
}
