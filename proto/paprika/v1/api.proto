  repeated FleetSyncBucket sync = 4;
  uint64 attention_total = 5;
  repeated ApplicationSummary attention = 6;
  bool has_more_attention = 7;
}

message QueryApplicationsRequest {
  FleetFilter filter = 1;
  string search = 2;
  FleetSortField sort = 3;
  FleetSortDirection direction = 4;
  uint32 page_size = 5;
  string cursor = 6;
}

message QueryApplicationsResponse {
