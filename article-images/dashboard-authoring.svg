<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>Build a dashboard from real queries</title><desc>Provider discovery, saved queries and widgets form one explicit chain. A saved document does not prove its queries work. Dashboard authoring requires write scope and human Insights permissions.</desc><g font-family="Arial, Helvetica, sans-serif" fill="#1d2d3d"><rect width="1200" height="675" fill="#f2f2f3"/><text x="40" y="38" font-size="16" fill="#416180" letter-spacing="2">PAPRIKA / CONCEPT GUIDE</text><text x="40" y="94" font-size="38" font-weight="700">Build a dashboard from real queries</text><text x="40" y="135" font-size="23" fill="#52677b">Provider discovery, saved queries and widgets form one explicit chain.</text><path d="M40 184l6-6h352l-6 6 M392 184l6-6v340l-6 6" fill="#e7f0f8" stroke="#b8c7d4"/><rect x="40" y="184" width="352" height="340" fill="#ffffff" stroke="#b8c7d4"/><text x="62" y="213" font-size="17" fill="#416180" letter-spacing="2">01</text><text x="62" y="256" font-size="28" font-weight="700">Discover</text><g transform="translate(64 289)" fill="none" stroke="#416180" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="25" cy="25" r="20"/><path d="M40 40L60 60 M14 25H36 M25 14V36"/></g><path d="M62 375H370" stroke="#b8c7d4"/><text x="62" y="414" font-size="21" fill="#52677b">Canonical provider IDs</text><text x="62" y="446" font-size="21" fill="#52677b">Actual metrics + labels</text><text x="62" y="478" font-size="21" fill="#52677b">Execute a bounded query</text><path d="M400 354h17m-5-5l5 5-5 5" fill="none" stroke="#416180" stroke-width="2"/><path d="M424 184l6-6h352l-6 6 M776 184l6-6v340l-6 6" fill="#e7f0f8" stroke="#b8c7d4"/><rect x="424" y="184" width="352" height="340" fill="#ffffff" stroke="#b8c7d4"/><text x="446" y="213" font-size="17" fill="#416180" letter-spacing="2">02</text><text x="446" y="256" font-size="28" font-weight="700">Bind</text><g transform="translate(448 289)" fill="none" stroke="#416180" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="58" height="56"/><rect x="11" y="13" width="17" height="13"/><rect x="36" y="13" width="17" height="13"/><rect x="11" y="35" width="42" height="17"/></g><path d="M446 375H754" stroke="#b8c7d4"/><text x="446" y="414" font-size="21" fill="#52677b">Saved query + parameters</text><text x="446" y="446" font-size="21" fill="#52677b">Widgets + provider IDs</text><text x="446" y="478" font-size="21" fill="#52677b">Exact ETag when editing</text><path d="M784 354h17m-5-5l5 5-5 5" fill="none" stroke="#416180" stroke-width="2"/><path d="M808 184l6-6h352l-6 6 M1160 184l6-6v340l-6 6" fill="#e7f0f8" stroke="#b8c7d4"/><rect x="808" y="184" width="352" height="340" fill="#ffffff" stroke="#b8c7d4"/><text x="830" y="213" font-size="17" fill="#416180" letter-spacing="2">03</text><text x="830" y="256" font-size="28" font-weight="700">Verify</text><g transform="translate(832 289)" fill="none" stroke="#416180" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="28"/><path d="M17 32L28 43L48 21"/></g><path d="M830 375H1138" stroke="#b8c7d4"/><text x="830" y="414" font-size="21" fill="#52677b">Run query_dashboard</text><text x="830" y="446" font-size="21" fill="#52677b">Inspect freshness + errors</text><text x="830" y="478" font-size="21" fill="#52677b">Review the rendered layout</text><path d="M40 560H1160" stroke="#b8c7d4"/><text x="40" y="594" font-size="22" fill="#52677b">A saved document does not prove its queries work.</text><text x="40" y="626" font-size="22" fill="#52677b">Dashboard authoring requires write scope and human Insights permissions.</text></g></svg>
