<svg xmlns="http://www.w3.org/2000/svg" width="600" height="820" viewBox="0 0 600 820" role="img"><title>Query across telemetry sources</title><desc>Paprika Observe provides a separate authenticated MCP surface. Provider health describes reachability, not the health of a service. Inspect returned samples, errors and timestamps.</desc><g font-family="Arial, Helvetica, sans-serif" fill="#1d2d3d"><rect width="600" height="820" fill="#f2f2f3"/><text x="26" y="38" font-size="16" fill="#416180" letter-spacing="2">PAPRIKA / CONCEPT GUIDE</text><text x="26" y="78" font-size="30" font-weight="700">Query across telemetry sources</text><path d="M26 156l6-6h548l-6 6 M574 156l6-6v150l-6 6" fill="#e7f0f8" stroke="#b8c7d4"/><rect x="26" y="156" width="548" height="150" fill="#ffffff" stroke="#b8c7d4"/><text x="48" y="185" font-size="17" fill="#416180" letter-spacing="2">01</text><text x="48" y="218" font-size="25" font-weight="700">MCP client</text><g transform="translate(51 251) scale(.6)"><g transform="translate(0 0)" fill="none" stroke="#416180" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="60" height="45" rx="2"/><path d="M3 16H61 M13 26L22 33L13 40 M29 40H44"/></g></g><text x="278" y="201" font-size="20" fill="#52677b">Sign in with OAuth</text><text x="278" y="234" font-size="20" fill="#52677b">Connect to /observe/mcp</text><text x="278" y="267" font-size="20" fill="#52677b">Discover available sources</text><path d="M300 309v17m-5-5l5 5 5-5" fill="none" stroke="#416180" stroke-width="2"/><path d="M26 330l6-6h548l-6 6 M574 330l6-6v150l-6 6" fill="#e7f0f8" stroke="#b8c7d4"/><rect x="26" y="330" width="548" height="150" fill="#ffffff" stroke="#b8c7d4"/><text x="48" y="359" font-size="17" fill="#416180" letter-spacing="2">02</text><text x="48" y="392" font-size="25" font-weight="700">Observe gateway</text><g transform="translate(51 425) scale(.6)"><g transform="translate(0 0)" fill="none" stroke="#416180" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M32 3L56 12V28C56 44 42 54 32 61C22 54 8 44 8 28V12Z M21 31L29 39L44 23"/></g></g><text x="278" y="375" font-size="20" fill="#52677b">Require paprika:observe</text><text x="278" y="408" font-size="20" fill="#52677b">Authorize provider access</text><text x="278" y="441" font-size="20" fill="#52677b">Bound the requested query</text><path d="M300 483v17m-5-5l5 5 5-5" fill="none" stroke="#416180" stroke-width="2"/><path d="M26 504l6-6h548l-6 6 M574 504l6-6v150l-6 6" fill="#e7f0f8" stroke="#b8c7d4"/><rect x="26" y="504" width="548" height="150" fill="#ffffff" stroke="#b8c7d4"/><text x="48" y="533" font-size="17" fill="#416180" letter-spacing="2">03</text><text x="48" y="566" font-size="25" font-weight="700">Providers</text><g transform="translate(51 599) scale(.6)"><g transform="translate(0 0)" fill="none" stroke="#416180" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="32" cy="11" rx="25" ry="8"/><path d="M7 11V48C7 59 57 59 57 48V11 M7 29C7 40 57 40 57 29"/></g></g><text x="278" y="549" font-size="20" fill="#52677b">Metrics</text><text x="278" y="582" font-size="20" fill="#52677b">Logs</text><text x="278" y="615" font-size="20" fill="#52677b">Traces</text><path d="M26 686H574" stroke="#b8c7d4"/><text x="26" y="715" font-size="19" fill="#52677b">Provider health describes reachability, not the</text><text x="26" y="739" font-size="19" fill="#52677b">health of a service.</text><text x="26" y="763" font-size="19" fill="#52677b">Inspect returned samples, errors and timestamps.</text></g></svg>
