<svg xmlns="http://www.w3.org/2000/svg" width="600" height="820" viewBox="0 0 600 820" role="img"><title>Inspect the saved dashboard visually</title><desc>The optional renderer captures the authenticated Insights interface. The worker must be explicitly deployed and configured. Also run query_dashboard to check data freshness and query results.</desc><g font-family="Arial, Helvetica, sans-serif" fill="#1d2d3d"><rect width="600" height="820" fill="#f2f2f3"/><text x="26" y="38" font-size="16" fill="#416180" letter-spacing="2">PAPRIKA / CONCEPT GUIDE</text><text x="26" y="78" font-size="30" font-weight="700">Inspect the saved dashboard</text><text x="26" y="114" font-size="30" font-weight="700">visually</text><path d="M26 156l6-6h548l-6 6 M574 156l6-6v150l-6 6" fill="#e7f0f8" stroke="#b8c7d4"/><rect x="26" y="156" width="548" height="150" fill="#ffffff" stroke="#b8c7d4"/><text x="48" y="185" font-size="17" fill="#416180" letter-spacing="2">01</text><text x="48" y="218" font-size="25" font-weight="700">Authorize</text><g transform="translate(51 251) scale(.6)"><g transform="translate(0 0)" fill="none" stroke="#416180" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M32 3L56 12V28C56 44 42 54 32 61C22 54 8 44 8 28V12Z M21 31L29 39L44 23"/></g></g><text x="278" y="201" font-size="20" fill="#52677b">Dashboard ID + viewport</text><text x="278" y="234" font-size="20" fill="#52677b">Human access permissions</text><text x="278" y="267" font-size="20" fill="#52677b">Bind the document ETag</text><path d="M300 309v17m-5-5l5 5 5-5" fill="none" stroke="#416180" stroke-width="2"/><path d="M26 330l6-6h548l-6 6 M574 330l6-6v150l-6 6" fill="#e7f0f8" stroke="#b8c7d4"/><rect x="26" y="330" width="548" height="150" fill="#ffffff" stroke="#b8c7d4"/><text x="48" y="359" font-size="17" fill="#416180" letter-spacing="2">02</text><text x="48" y="392" font-size="25" font-weight="700">Private worker</text><g transform="translate(51 425) scale(.6)"><g transform="translate(0 0)" fill="none" stroke="#416180" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="60" height="47"/><rect x="41" y="29" width="21" height="32"/><path d="M3 15H61 M18 25H31 M18 34H31"/></g></g><text x="278" y="375" font-size="20" fill="#52677b">Loopback-only sidecar</text><text x="278" y="408" font-size="20" fill="#52677b">Trusted Insights origin</text><text x="278" y="441" font-size="20" fill="#52677b">Real Chromium capture</text><path d="M300 483v17m-5-5l5 5 5-5" fill="none" stroke="#416180" stroke-width="2"/><path d="M26 504l6-6h548l-6 6 M574 504l6-6v150l-6 6" fill="#e7f0f8" stroke="#b8c7d4"/><rect x="26" y="504" width="548" height="150" fill="#ffffff" stroke="#b8c7d4"/><text x="48" y="533" font-size="17" fill="#416180" letter-spacing="2">03</text><text x="48" y="566" font-size="25" font-weight="700">Inspect</text><g transform="translate(51 599) scale(.6)"><g transform="translate(0 0)" fill="none" stroke="#416180" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="25" cy="25" r="20"/><path d="M40 40L60 60 M14 25H36 M25 14V36"/></g></g><text x="278" y="549" font-size="20" fill="#52677b">PNG + matching revision</text><text x="278" y="582" font-size="20" fill="#52677b">Desktop / mobile layout</text><text x="278" y="615" font-size="20" fill="#52677b">Values, labels + tooltips</text><path d="M26 686H574" stroke="#b8c7d4"/><text x="26" y="715" font-size="19" fill="#52677b">The worker must be explicitly deployed and</text><text x="26" y="739" font-size="19" fill="#52677b">configured.</text><text x="26" y="763" font-size="19" fill="#52677b">Also run query_dashboard to check data freshness</text><text x="26" y="787" font-size="19" fill="#52677b">and query results.</text></g></svg>
