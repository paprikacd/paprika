{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-%s" .Release.Namespace (include "paprika-satellite.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "paprika-satellite.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes, pods, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [pipelines.paprika.io]
    resources: [applications]
    verbs: [get, list, watch]
  - nonResourceURLs: [/version]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s" .Release.Namespace (include "paprika-satellite.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "paprika-satellite.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-%s" .Release.Namespace (include "paprika-satellite.fullname" .) | trunc 63 | trimSuffix "-" }}
subjects:
  - kind: ServiceAccount
    name: {{ include "paprika-satellite.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
