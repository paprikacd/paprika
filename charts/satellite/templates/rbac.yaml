{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-%s" .Release.Namespace (include "paprika-satellite.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "paprika-satellite.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes, pods, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [pipelines.paprika.io]
    resources: [applications]
    verbs: [get, list, watch]
  - nonResourceURLs: [/version]
    verbs: [get]
  {{- with .Values.rbac.extraClusterRoleRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-%s" .Release.Namespace (include "paprika-satellite.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "paprika-satellite.labels" . | nindent 4 }}
rules:
  # The bundle store is what lets a satellite keep enforcing the last applied
  # state through a control-plane outage, and what a restart re-reads.
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [paprika-satellite-bundles]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-%s" .Release.Namespace (include "paprika-satellite.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "paprika-satellite.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-%s" .Release.Namespace (include "paprika-satellite.fullname" .) | trunc 63 | trimSuffix "-" }}
subjects:
  - kind: ServiceAccount
    name: {{ include "paprika-satellite.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s" .Release.Namespace (include "paprika-satellite.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "paprika-satellite.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-%s" .Release.Namespace (include "paprika-satellite.fullname" .) | trunc 63 | trimSuffix "-" }}
subjects:
  - kind: ServiceAccount
    name: {{ include "paprika-satellite.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
