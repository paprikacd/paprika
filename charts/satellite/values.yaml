# Central Paprika API origin, for example https://paprika.example.com.
controlPlaneURL: ""

cluster:
  # Cluster registration identity in the central control plane. Use a unique
  # name for each physical cluster and keep it stable across reinstallations.
  name: ""
  namespace: paprika-system
  displayName: ""

# Provision a scoped enrollment token outside Helm, in the satellite release
# namespace. This chart never creates a Secret or embeds a literal token.
token:
  existingSecret: ""
  key: token

# Optional private CA bundle for the central HTTPS endpoint. Public CAs work
# without this setting. The ConfigMap must exist in the satellite namespace.
ca:
  existingConfigMap: ""
  key: ca.crt

heartbeatInterval: 30s
batchInterval: 2s

# autonomy is what this satellite does while it cannot reach the control plane:
#   ObserveOnly — report only, never reconcile locally.
#   Failover    — the control plane reconciles while connected; the satellite
#                 takes over after failoverTimeout without contact.
#   Delegated   — the satellite always reconciles; the control plane supplies
#                 desired state.
# It is reported to the control plane and must agree with the Cluster's own
# spec.satellite.autonomy; the Cluster's ceiling stays authoritative there.
autonomy: Failover
failoverTimeout: 2m

# managementPolicies is the set of actions this satellite claims it permits:
# Observe, Apply, Prune, Delete, SelfHeal, Rollout, or "*". It is a claim, not a
# grant: the Cluster's spec.managementPolicies is what the control plane
# enforces, and a disagreement is visible in status.effectivePolicies.
managementPolicies:
  - "*"

# stream keeps one bidirectional link to the control plane instead of posting
# each report. It is what lets the control plane dispatch work — an apply —
# down the same connection, so a cluster behind a firewall needs no inbound
# route. Off by default: the POST transport is what every existing satellite
# runs, and switching is a deployment decision.
stream:
  enabled: false

image:
  repository: ghcr.io/paprikacd/paprika
  # Required unless repository contains an immutable @sha256 digest. Choose
  # a build containing satellite mode; the chart does not infer an image tag.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

nameOverride: ""
fullnameOverride: ""
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# Additional non-secret satellite flags. Authentication uses the token file.
extraArgs: []
