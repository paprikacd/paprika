# promtool unit tests for the PrometheusRule rendered from
# charts/chart/templates/prometheus/prometheusrules.yaml. Run them with
# charts/chart/tests/prometheus/run.sh (or task chart:rules), which renders
# the chart and copies rules.yaml next to this file.
rule_files:
  - rules.yaml
evaluation_interval: 30s
tests:
  # Release failures are transition counters. The first Failed transition makes
  # a new series at 1, a later increment makes increase() positive, and the
  # alert resolves once neither holds.
  - interval: 30s
    input_series:
      - series: 'paprika_release_phase_total{release="app-r1",namespace="apps",phase="Failed"}'
        values: '_x10 1x40'
      - series: 'paprika_release_phase_total{release="app-r2",namespace="apps",phase="Failed"}'
        values: '_x40 1x10 2x20'
    alert_rule_test:
      - eval_time: 4m
        alertname: PaprikaReleaseFailed
        exp_alerts: []
      - eval_time: 7m
        alertname: PaprikaReleaseFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              release: app-r1
              namespace: apps
              phase: Failed
            exp_annotations:
              summary: Paprika release failed
              description: Release app-r1 in namespace apps failed.
      - eval_time: 12m
        alertname: PaprikaReleaseFailed
        exp_alerts: []
      - eval_time: 28m
        alertname: PaprikaReleaseFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              release: app-r2
              namespace: apps
              phase: Failed
            exp_annotations:
              summary: Paprika release failed
              description: Release app-r2 in namespace apps failed.
      - eval_time: 33m
        alertname: PaprikaReleaseFailed
        exp_alerts: []

  # Application rollbacks follow the same first-transition pattern.
  - interval: 30s
    input_series:
      - series: 'paprika_application_phase_total{application="app-1",namespace="apps",phase="RolledBack"}'
        values: '_x10 1x40'
    alert_rule_test:
      - eval_time: 4m
        alertname: PaprikaApplicationRolledBack
        exp_alerts: []
      - eval_time: 7m
        alertname: PaprikaApplicationRolledBack
        exp_alerts:
          - exp_labels:
              severity: warning
              application: app-1
              namespace: apps
              phase: RolledBack
            exp_annotations:
              summary: Paprika application rolled back
              description: Application app-1 in namespace apps was rolled back.
      - eval_time: 12m
        alertname: PaprikaApplicationRolledBack
        exp_alerts: []

  # Scrape gaps. A target that misses scrapes writes staleness markers for its
  # series, and Prometheus down writes nothing; either way the series returns
  # with the same counter value. An old failure that comes back is not a new
  # failure, so neither gap may fire. Without the history check, a gap fires
  # these alerts for every release that failed before the gap.
  - interval: 30s
    input_series:
      # Failed 10 minutes ago. The last sample is at 10m, the stale marker at 10m30s,
      # one scrape is missing, and it resumes at 11m30s: 90 s after the last sample.
      - series: 'paprika_release_phase_total{release="old-r1",namespace="apps",phase="Failed"}'
        values: '1x20 stale _ 1x60'
      # Failed 10 minutes ago. The last sample is at 10m, then 13 scrapes are missing
      # with no stale marker (as when Prometheus is down). It resumes at 17m, 7 min later.
      # The 7 min case also checks 18m, where the unfixed expression (X unless X
      # offset 5m) fires: it is active from 17m to 22m.
      - series: 'paprika_release_phase_total{release="old-r2",namespace="apps",phase="Failed"}'
        values: '1x20 _x13 1x60'
      # Rolled back 10 minutes ago, with the same 90s gap.
      - series: 'paprika_application_phase_total{application="old-a1",namespace="apps",phase="RolledBack"}'
        values: '3x20 stale _ 3x60'
    alert_rule_test:
      - eval_time: 16m30s
        alertname: PaprikaReleaseFailed
        exp_alerts: []
      - eval_time: 18m
        alertname: PaprikaReleaseFailed
        exp_alerts: []
      - eval_time: 21m30s
        alertname: PaprikaReleaseFailed
        exp_alerts: []
      - eval_time: 25m
        alertname: PaprikaReleaseFailed
        exp_alerts: []
      - eval_time: 16m30s
        alertname: PaprikaApplicationRolledBack
        exp_alerts: []
      - eval_time: 21m30s
        alertname: PaprikaApplicationRolledBack
        exp_alerts: []
      - eval_time: 25m
        alertname: PaprikaApplicationRolledBack
        exp_alerts: []

  # A genuinely new failure still fires while an old failure sits behind a
  # 90s gap in the same group. Only the new release may appear.
  - interval: 30s
    input_series:
      # First failed at 10 minutes, so this is a new transition.
      - series: 'paprika_release_phase_total{release="new-r3",namespace="apps",phase="Failed"}'
        values: '_x20 1x40'
      # Old failure with a 90s gap; it must stay silent.
      - series: 'paprika_release_phase_total{release="old-r4",namespace="apps",phase="Failed"}'
        values: '1x20 stale _ 1x60'
    alert_rule_test:
      - eval_time: 12m
        alertname: PaprikaReleaseFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              release: new-r3
              namespace: apps
              phase: Failed
            exp_annotations:
              summary: Paprika release failed
              description: Release new-r3 in namespace apps failed.
      - eval_time: 16m30s
        alertname: PaprikaReleaseFailed
        exp_alerts: []

  # The same gaps with the target's instance and pod labels, as the manager's
  # ServiceMonitor attaches them. The restart check joins process_start_time_seconds
  # on instance and pod, so these series carry both. The process started at 0,
  # before every sample, so nothing here is a restart and both gaps must stay silent.
  - interval: 30s
    input_series:
      - series: 'paprika_release_phase_total{release="old-r5",namespace="apps",phase="Failed",instance="manager-0:8443",pod="paprika-controller-manager-0"}'
        values: '1x20 stale _ 1x60'
      - series: 'paprika_release_phase_total{release="old-r6",namespace="apps",phase="Failed",instance="manager-0:8443",pod="paprika-controller-manager-0"}'
        values: '1x20 _x13 1x60'
      - series: 'paprika_application_phase_total{application="old-a2",namespace="apps",phase="RolledBack",instance="manager-0:8443",pod="paprika-controller-manager-0"}'
        values: '3x20 stale _ 3x60'
      - series: 'process_start_time_seconds{instance="manager-0:8443",pod="paprika-controller-manager-0"}'
        values: '0x80'
    alert_rule_test:
      - eval_time: 16m30s
        alertname: PaprikaReleaseFailed
        exp_alerts: []
      - eval_time: 18m30s
        alertname: PaprikaReleaseFailed
        exp_alerts: []
      - eval_time: 25m
        alertname: PaprikaReleaseFailed
        exp_alerts: []
      - eval_time: 16m30s
        alertname: PaprikaApplicationRolledBack
        exp_alerts: []
      - eval_time: 25m
        alertname: PaprikaApplicationRolledBack
        exp_alerts: []

  # An in-place container restart. The old process last reports the series at 10m.
  # At 10m30s the scrape gives a stale marker, and process_start_time_seconds steps
  # from 0 to 660 (the new process). The new process does not report the series
  # until it fails again at 15m, with its counter at 1. The old process's history
  # must not hide that failure: without the restart check, this alert is suppressed
  # for up to an hour.
  - interval: 30s
    input_series:
      - series: 'paprika_release_phase_total{release="restart-r7",namespace="apps",phase="Failed",instance="manager-0:8443",pod="paprika-controller-manager-0"}'
        values: '1x20 stale _x8 1x20'
      - series: 'paprika_application_phase_total{application="restart-a3",namespace="apps",phase="RolledBack",instance="manager-0:8443",pod="paprika-controller-manager-0"}'
        values: '1x20 stale _x8 1x20'
      - series: 'process_start_time_seconds{instance="manager-0:8443",pod="paprika-controller-manager-0"}'
        values: '0x21 660x41'
    alert_rule_test:
      - eval_time: 12m
        alertname: PaprikaReleaseFailed
        exp_alerts: []
      - eval_time: 17m
        alertname: PaprikaReleaseFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              release: restart-r7
              namespace: apps
              phase: Failed
              instance: manager-0:8443
              pod: paprika-controller-manager-0
            exp_annotations:
              summary: Paprika release failed
              description: Release restart-r7 in namespace apps failed.
      - eval_time: 25m
        alertname: PaprikaReleaseFailed
        exp_alerts: []
      - eval_time: 12m
        alertname: PaprikaApplicationRolledBack
        exp_alerts: []
      - eval_time: 17m
        alertname: PaprikaApplicationRolledBack
        exp_alerts:
          - exp_labels:
              severity: warning
              application: restart-a3
              namespace: apps
              phase: RolledBack
              instance: manager-0:8443
              pod: paprika-controller-manager-0
            exp_annotations:
              summary: Paprika application rolled back
              description: Application restart-a3 in namespace apps was rolled back.
      - eval_time: 25m
        alertname: PaprikaApplicationRolledBack
        exp_alerts: []

  # A repeat failure during a Prometheus outage. Prometheus is down for seven minutes
  # (no samples, from 10m to 17m), and the counter goes from 1 to 2 while it is down.
  # Scraping resumes at 17m with 2. The series has history, and increase() sees only the resumed
  # value, so the "rose above history" branch must fire it.
  - interval: 30s
    input_series:
      - series: 'paprika_release_phase_total{release="outage-r8",namespace="apps",phase="Failed",instance="manager-0:8443",pod="paprika-controller-manager-0"}'
        values: '1x20 _x13 2x60'
      - series: 'process_start_time_seconds{instance="manager-0:8443",pod="paprika-controller-manager-0"}'
        values: '0x80'
    alert_rule_test:
      - eval_time: 16m
        alertname: PaprikaReleaseFailed
        exp_alerts: []
      - eval_time: 18m30s
        alertname: PaprikaReleaseFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              release: outage-r8
              namespace: apps
              phase: Failed
              instance: manager-0:8443
              pod: paprika-controller-manager-0
            exp_annotations:
              summary: Paprika release failed
              description: Release outage-r8 in namespace apps failed.
      - eval_time: 25m
        alertname: PaprikaReleaseFailed
        exp_alerts: []

  # Degraded is current state from the phase gauge. Two replicas report the same
  # cluster-wide value; max() collapses them, so the alert has no labels and
  # reports one application, not two. It needs five minutes to fire.
  - interval: 30s
    input_series:
      - series: 'paprika_applications_by_phase_ratio{phase="Degraded",instance="manager-0:8443"}'
        values: '_x10 1x40'
      - series: 'paprika_applications_by_phase_ratio{phase="Degraded",instance="manager-1:8443"}'
        values: '_x10 1x40'
    alert_rule_test:
      - eval_time: 8m
        alertname: PaprikaApplicationDegraded
        exp_alerts: []
      - eval_time: 11m
        alertname: PaprikaApplicationDegraded
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Paprika applications are degraded
              description: "1 application(s) are in the Degraded phase. The gauge has no application label; list them with kubectl get applications -A."
      - eval_time: 32m
        alertname: PaprikaApplicationDegraded
        exp_alerts: []

  # Gauge alerts take the max over replicas. One replica reporting 0 does not
  # hide a 1 from the other.
  - interval: 30s
    input_series:
      - series: 'paprika_releases_stuck{instance="manager-0:8443"}'
        values: '1x40'
      - series: 'paprika_releases_stuck{instance="manager-1:8443"}'
        values: '0x40'
      - series: 'paprika_applications_release_retries_exhausted{instance="manager-0:8443"}'
        values: '1x40'
      - series: 'paprika_applications_release_retries_exhausted{instance="manager-1:8443"}'
        values: '1x40'
      - series: 'paprika_fleet_index_degraded{instance="manager-0:8443"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 7m
        alertname: PaprikaReleasesStuck
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Paprika releases are stuck
              description: "1 non-terminal releases are older than the stuck-release threshold (30m)."
      - eval_time: 7m
        alertname: PaprikaReleaseRetriesExhausted
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Paprika application release retries exhausted
              description: "1 applications hold the ReleaseRetriesExhausted condition. The gauge has no application label; find them with kubectl get applications -A."
      - eval_time: 7m
        alertname: PaprikaFleetIndexDegraded
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Paprika fleet index is degraded
              description: The installed fleet index health is degraded; fleet queries may be serving stale data.

  # OOM comes from cAdvisor, and only the chart's containers count: a sidecar in
  # the same pod must not fire.
  - interval: 30s
    input_series:
      - series: 'container_oom_events_total{namespace="paprika-system",pod="paprika-controller-manager-7d9f",container="manager",instance="10.0.0.1:10250"}'
        values: '0x20 1x30'
      - series: 'container_oom_events_total{namespace="paprika-system",pod="paprika-controller-manager-7d9f",container="istio-proxy",instance="10.0.0.1:10250"}'
        values: '0x20 1x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: PaprikaOOMKilled
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: paprika-system
              pod: paprika-controller-manager-7d9f
              container: manager
            exp_annotations:
              summary: Paprika container OOM killed
              description: Container manager in pod paprika-controller-manager-7d9f was OOM killed.
      - eval_time: 20m
        alertname: PaprikaOOMKilled
        exp_alerts: []

  # The other long-running containers count too: the observability gateway,
  # the dashboard renderer sidecar and Insights. Their OOM kills must alert.
  # The istio-proxy sidecar still must not.
  - interval: 30s
    input_series:
      - series: 'container_oom_events_total{namespace="paprika-system",pod="paprika-observability-gateway-6c9d4f7b8-x2k4p",container="observability-gateway",instance="10.0.0.2:10250"}'
        values: '0x20 1x30'
      - series: 'container_oom_events_total{namespace="paprika-system",pod="paprika-observability-gateway-6c9d4f7b8-x2k4p",container="dashboard-renderer",instance="10.0.0.2:10250"}'
        values: '0x20 1x30'
      - series: 'container_oom_events_total{namespace="paprika-system",pod="paprika-insights-7b8f9c5d6-qz7lw",container="insights",instance="10.0.0.3:10250"}'
        values: '0x20 1x30'
      - series: 'container_oom_events_total{namespace="paprika-system",pod="paprika-insights-7b8f9c5d6-qz7lw",container="istio-proxy",instance="10.0.0.3:10250"}'
        values: '0x20 1x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: PaprikaOOMKilled
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: paprika-system
              pod: paprika-observability-gateway-6c9d4f7b8-x2k4p
              container: observability-gateway
            exp_annotations:
              summary: Paprika container OOM killed
              description: Container observability-gateway in pod paprika-observability-gateway-6c9d4f7b8-x2k4p was OOM killed.
          - exp_labels:
              severity: critical
              namespace: paprika-system
              pod: paprika-observability-gateway-6c9d4f7b8-x2k4p
              container: dashboard-renderer
            exp_annotations:
              summary: Paprika container OOM killed
              description: Container dashboard-renderer in pod paprika-observability-gateway-6c9d4f7b8-x2k4p was OOM killed.
          - exp_labels:
              severity: critical
              namespace: paprika-system
              pod: paprika-insights-7b8f9c5d6-qz7lw
              container: insights
            exp_annotations:
              summary: Paprika container OOM killed
              description: Container insights in pod paprika-insights-7b8f9c5d6-qz7lw was OOM killed.
      - eval_time: 20m
        alertname: PaprikaOOMKilled
        exp_alerts: []

  # The agent DaemonSet and the Redis deployment are long-running containers too.
  # The agent pod's istio-proxy sidecar still must not fire.
  - interval: 30s
    input_series:
      - series: 'container_oom_events_total{namespace="paprika-system",pod="paprika-agent-k7x2m",container="agent",instance="10.0.0.4:10250"}'
        values: '0x20 1x30'
      - series: 'container_oom_events_total{namespace="paprika-system",pod="paprika-agent-k7x2m",container="istio-proxy",instance="10.0.0.4:10250"}'
        values: '0x20 1x30'
      - series: 'container_oom_events_total{namespace="paprika-system",pod="paprika-redis-5c4d7f8b9-q2wzt",container="redis",instance="10.0.0.5:10250"}'
        values: '0x20 1x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: PaprikaOOMKilled
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: paprika-system
              pod: paprika-agent-k7x2m
              container: agent
            exp_annotations:
              summary: Paprika container OOM killed
              description: Container agent in pod paprika-agent-k7x2m was OOM killed.
          - exp_labels:
              severity: critical
              namespace: paprika-system
              pod: paprika-redis-5c4d7f8b9-q2wzt
              container: redis
            exp_annotations:
              summary: Paprika container OOM killed
              description: Container redis in pod paprika-redis-5c4d7f8b9-q2wzt was OOM killed.
      - eval_time: 20m
        alertname: PaprikaOOMKilled
        exp_alerts: []

  # Dashboard expressions: replicas collapse under max, and out-of-sync counts
  # each application once.
  - interval: 30s
    input_series:
      - series: 'paprika_applications_by_phase_ratio{phase="Healthy",instance="manager-0:8443"}'
        values: '2x40'
      - series: 'paprika_applications_by_phase_ratio{phase="Healthy",instance="manager-1:8443"}'
        values: '2x40'
      - series: 'paprika_applications_by_phase_ratio{phase="Degraded",instance="manager-0:8443"}'
        values: '1x40'
    promql_expr_test:
      - expr: max by (phase) (paprika_applications_by_phase_ratio)
        eval_time: 5m
        exp_samples:
          - labels: '{phase="Healthy"}'
            value: 2
          - labels: '{phase="Degraded"}'
            value: 1
  - interval: 30s
    input_series:
      - series: 'paprika_application_reconcile_lag{application="app-1",namespace="apps",instance="manager-0:8443"}'
        values: '3x40'
      - series: 'paprika_application_reconcile_lag{application="app-2",namespace="other",instance="manager-0:8443"}'
        values: '7x40'
      - series: 'paprika_out_of_sync{app="a1",namespace="apps",instance="manager-0:8443"}'
        values: '4x40'
      - series: 'paprika_out_of_sync{app="a1",namespace="apps",instance="manager-1:8443"}'
        values: '4x40'
      - series: 'paprika_out_of_sync{app="a2",namespace="apps",instance="manager-0:8443"}'
        values: '1x40'
    promql_expr_test:
      - expr: max(paprika_application_reconcile_lag{namespace=~"apps"})
        eval_time: 5m
        exp_samples:
          - labels: '{}'
            value: 3
      - expr: sum(max by (app, namespace) (paprika_out_of_sync{namespace=~"apps"}))
        eval_time: 5m
        exp_samples:
          - labels: '{}'
            value: 5
