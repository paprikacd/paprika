{{- if .Values.crd.enable }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.20.1
  name: observabilityproviders.observability.paprika.io
spec:
  group: observability.paprika.io
  names:
    kind: ObservabilityProvider
    listKind: ObservabilityProviderList
    plural: observabilityproviders
    singular: observabilityprovider
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ObservabilityProvider registers a backend the observability gateway
          connects to — a Prometheus, Loki, Tempo, or OTLP endpoint — so the rest
          of Paprika can read metrics, logs, and traces through one door instead
          of one credential copy per consumer.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ObservabilityProviderSpec defines the desired state of an
              ObservabilityProvider.
            properties:
              config:
                description: |-
                  Config is the connector's own configuration. Each connector supplies
                  its schema and validates this at admission, so the CRD does not
                  become a union of every implementation's fields.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              credentialsSecretRef:
                description: |-
                  CredentialsSecretRef references the Secret holding the credential
                  used to authenticate against the backend. Nil means no credentials,
                  which is not an error — connectors that reach anonymous or ambient-
                  identity backends work without one.
                properties:
                  key:
                    description: |-
                      Key within the Secret holding the credential document. Defaults to
                      "credentials" when empty.
                    type: string
                  name:
                    description: Name of the Secret.
                    type: string
                  namespace:
                    description: |-
                      Namespace of the Secret. Defaults to the provider's own namespace
                      when empty.
                    type: string
                required:
                - name
                type: object
              type:
                description: |-
                  Type is the kind of backend this provider connects to. Each type has
                  a connector in the observability gateway that knows how to reach and
                  authenticate against it.
                enum:
                - prometheus
                - loki
                - tempo
                - otlp
                - gcp-cloudlogging
                - gcp-cloudmonitoring
                - gcp-cloudtrace
                - aws-cloudwatch-logs
                - aws-cloudwatch-metrics
                - aws-xray
                - aws-cloudtrail
                - mock
                type: string
            required:
            - type
            type: object
          status:
            description: ObservabilityProviderStatus defines the observed state of
              an ObservabilityProvider.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              reason:
                description: |-
                  Reason is a fixed sentence describing the current state, chosen from
                  a closed set by the connector. Reasons never carry credential or
                  endpoint detail — a provider that fails must say why in words an
                  operator can act on without leaking what it authenticates with.
                type: string
              state:
                description: |-
                  State is the connector's current reachability verdict. One of OK,
                  NotConfigured, NotAvailable, Error, Forbidden.
                enum:
                - OK
                - NotConfigured
                - NotAvailable
                - Error
                - Forbidden
                type: string
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
