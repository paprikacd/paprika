                        rule: '!has(self.slo) || has(self.httpProbe)'
                    maxItems: 32
                    type: array
                    x-kubernetes-validations:
                    - message: at most four availability SLOs can retain history per
                        application
                      rule: self.filter(c, has(c.slo)).size() <= 4
                    - message: health check names must be unique
                      rule: self.all(c, self.filter(other, other.name == c.name).size()
                        == 1)
                  ignoreDifferences:
                    description: IgnoreDifferences lists JSON pointer paths to exclude
                      from diff computation.
                    items:
                      description: |-
                        IgnoreDiff specifies JSON pointer paths to ignore during diff computation,
                        analogous to ArgoCD's ignoreDifferences. Group, Kind, Name, and Namespace
                        scope the rule to matching resources; empty fields match everything.
                      properties:
                        createdAt:
                          description: CreatedAt records when the rule was added.
                          format: date-time
                          type: string
                        createdBy:
                          description: CreatedBy records the principal that added
                            the rule.
                          type: string
                        group:
                          description: Group limits the rule to an API group ("" matches
                            core and any group).
                          type: string
                        jsonPointers:
                          description: |-
                            JSONPointers lists JSON paths to ignore during diff computation.
                            Each path follows RFC 6901 JSON Pointer format (e.g., "/spec/replicas").
                          items:
                            type: string
                          type: array
                        kind:
                          description: Kind limits the rule to a resource kind.
                          type: string
                        name:
                          description: Name limits the rule to a resource name.
                          type: string
                        namespace:
                          description: Namespace limits the rule to a resource namespace.
                          type: string
                        reason:
                          description: Reason records why the rule exists (set by
                            IgnoreDriftedField).
                          type: string
                      type: object
                    type: array
                  metadata:
                    description: |-
                      Metadata sets labels and annotations on generated Applications.
