                  conftestPolicies:
                    description: |-
                      ConftestPolicies are Rego policies evaluated against rendered manifests before each
                      promotion. References are namespace-scoped. A missing or uncompilable policy blocks
                      promotion (fail-closed).
                    items:
                      description: ConftestPolicyRef references a ConftestPolicy by
                        name in the Application's namespace.
                      properties:
                        name:
                          description: Name of the ConftestPolicy.
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                  healthChecks:
                    description: HealthChecks define custom CEL-based health checks
                      for the application.
                    items:
                      description: HealthCheck defines a health check.
                      properties:
                        expression:
                          description: |-
                            CEL expression to evaluate. Available variables:
                              app (Application spec), status (Application status), http (HTTP probe results).
                            HTTP results expose http.statusCode, http.body, http.headers, and parsed
                            JSON response bodies as http.bodyJson and http.json.
                            Expression must return a boolean or a string matching HealthStatus.
                          type: string
                        httpProbe:
                          description: |-
                            Optional HTTP probe to run before evaluating the expression.
                            Results available in CEL as http.statusCode, http.body, http.headers,
                            http.bodyJson, and http.json.
                          properties:
                            body:
                              description: Request body (for POST/PUT)
                              type: string
                            expectedStatus:
                              description: Expected HTTP status code (default 200)
                              type: integer
                            headers:
                              additionalProperties:
                                type: string
                              description: Request headers
                              type: object
                            method:
                              default: GET
                              description: HTTP method (GET, POST, PUT, DELETE, HEAD)
                              type: string
                            timeout:
                              default: 5
                              description: Timeout in seconds (default 5)
                              type: integer
                            url:
                              description: URL to probe
                              type: string
                          required:
                          - url
                          type: object
                        interval:
                          default: 30s
                          description: How often to run this check (default 30s)
                          type: string
                        name:
                          description: Name of the health check
                          maxLength: 128
                          minLength: 1
                          type: string
                        slo:
                          description: |-
                            SLO adds rolling availability analysis to this HTTP check. The interval
                            must be a whole number of seconds from 10s to 1h; GET/HEAD only.
                          properties:
                            targetPercentage:
                              maximum: 99.9999
                              minimum: 1
                              type: number
                            window:
                              enum:
