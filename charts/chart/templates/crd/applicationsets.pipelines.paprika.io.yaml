                                  format: int32
                                  type: integer
                                stableService:
                                  type: string
                              required:
                              - mirrorPercent
                              type: object
                            rolling:
                              description: RollingStrategy performs a standard rolling
                                update.
                              properties:
                                maxSurge:
                                  anyOf:
                                  - type: integer
                                  - type: string
                                  x-kubernetes-int-or-string: true
                                maxUnavailable:
                                  anyOf:
                                  - type: integer
                                  - type: string
                                  x-kubernetes-int-or-string: true
                              type: object
                            type:
                              enum:
                              - Rolling
                              - Canary
                              - BlueGreen
                              - ABTest
                              - Mirror
                              type: string
                          required:
                          - type
                          type: object
                        strategy:
                          description: Delivery strategy for this stage (overrides
                            spec.strategy if set)
                          type: string
                      required:
                      - name
                      - ring
                      type: object
                    type: array
                  strategy:
                    default: Rolling
                    description: |-
                      Strategy is the default delivery strategy for all stages.
                      Can be overridden per-stage.
                    enum:
                    - Rolling
                    - Canary
                    - BlueGreen
                    type: string
                  syncOptions:
                    description: SyncOptions fine-tunes how manifests are applied
                      and pruned.
                    properties:
                      applyOutOfSyncOnly:
                        description: |-
                          ApplyOutOfSyncOnly skips applying resources whose live state already
                          matches the desired manifest.
                        type: boolean
                      force:
                        description: Force enables force-conflicts for server-side
                          apply.
                        type: boolean
                      hookTimeoutSeconds:
                        description: |-
                          HookTimeoutSeconds is the max time to wait for any single hook to reach
                          a terminal state, and the bound for a sync wave waiting for its
                          resources to become Healthy. Default 300 (5 minutes). 0 means
                          fire-and-forget (skip the per-hook/wave poll entirely).
                        format: int32
                        type: integer
                      prune:
                        description: |-
                          Prune deletes live resources that carry Paprika management labels but are
                          no longer present in the applied manifest set. Default false.
                        type: boolean
                      pruneClusterScopedKinds:
                        description: |-
                          PruneClusterScopedKinds lists cluster-scoped kinds eligible for pruning.
                          Only these kinds are considered; Namespaces, CRDs, and other critical
                          cluster resources are never pruned. Default ["ClusterRole",
                          "ClusterRoleBinding"].
                        items:
                          type: string
                        type: array
                      prunePropagationPolicy:
                        description: |-
                          PrunePropagationPolicy selects the deletion propagation policy used when
                          pruning managed resources.
                        enum:
                        - Foreground
                        - Background
                        - Orphan
                        type: string
                      replace:
                        description: Replace uses Update instead of server-side apply.
                        type: boolean
                      serverSideValidate:
                        description: |-
                          ServerSideValidate dry-run applies every sync-phase document before any
                          real mutation, so admission webhooks and schema violations fail the
                          release before the cluster is touched rather than midway through apply.
                          Costs one extra API round trip per document per sync. Default false.
                        type: boolean
                    type: object
                  syncPolicy:
                    default: Auto
                    description: SyncPolicy controls whether changes are applied automatically.
                    enum:
                    - Auto
                    - Manual
                    type: string
                  syncWindows:
                    description: SyncWindows restrict when automatic sync may run.
                    items:
                      description: SyncWindow defines a cron-based time window that
                        controls automatic sync.
                      properties:
                        duration:
                          description: |-
                            Duration is how long the window stays active after each scheduled start.
                            Parsed with time.ParseDuration, e.g. "8h".
                          type: string
                        kind:
                          description: Kind is whether this window allows or blocks
                            sync.
                          enum:
                          - Allow
                          - Block
                          type: string
                        schedule:
                          description: |-
                            Schedule is a standard 5-field cron expression:
                              MIN HOUR DOM MONTH DOW
                            Example: "0 9 * * MON-FRI" for 09:00 on weekdays.
                          type: string
                        stages:
                          description: Stages limits the window to the named stages.
                            Empty means all stages.
                          items:
                            type: string
                          type: array
                        timezone:
                          description: |-
                            Timezone is an IANA timezone name (e.g. "America/New_York"). Defaults to
                            UTC when empty.
                          type: string
                      required:
                      - duration
                      - kind
                      - schedule
                      type: object
                    type: array
                required:
                - source
                - stages
                type: object
            required:
            - generators
            - template
            type: object
          status:
            description: ApplicationSetStatus defines the observed state of an ApplicationSet.
            properties:
              applications:
                description: Applications is the number of Applications currently
                  owned by this set.
                type: integer
              conditions:
                description: Conditions represent the current state of the ApplicationSet.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the last observed generation of
                  the spec.
                format: int64
                type: integer
              rollingSync:
                description: |-
                  RollingSync reports progressive-sync progress while a RollingSync
                  rollout is active; cleared (nil) once all apps are at desired state.
                properties:
                  pending:
                    description: Pending lists generated apps not yet at desired state,
                      sorted by name.
                    items:
                      type: string
                    type: array
                  step:
                    description: |-
                      Step is the 1-based index of the step currently applying;
                      len(steps)+1 means the implicit trailing step for unmatched apps.
                      0 means every generated app is at desired state.
                    type: integer
                  waitingFor:
                    description: |-
                      WaitingFor names the earlier-step application gating progress —
                      still out-of-date or not yet Healthy. Empty when the active step is
                      updating rather than gated.
                    type: string
                required:
                - step
                type: object
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
