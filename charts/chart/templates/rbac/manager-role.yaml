  verbs:
  - get
  - list
  - watch
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - get
  - list
  - watch
{{- if .Values.githubActionsTokenExchange.enabled }}
- apiGroups:
  - ""
  resources:
  - serviceaccounts/token
  resourceNames:
  - {{ .Values.githubActionsTokenExchange.serviceAccount.name | quote }}
  verbs:
  - create
{{- end }}
