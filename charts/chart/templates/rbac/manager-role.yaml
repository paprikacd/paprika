# nodes is what KubernetesCapacity sums status.allocatable across, and pods
# what it sums container requests across, on the cluster a capacity read is
# scoped to. Read-only, and only the objects themselves: nothing on this path
# writes a Node or a Pod, evicts from one, or reads the node proxy.
- apiGroups:
  - ""
  resources:
  - nodes
  - pods
  - secrets
  verbs:
  - get
  - list
  - watch
# The diff engine compares cluster-scoped configuration objects by name — a
# PriorityClass or a GKE ComputeClass rendered by an Application — without a
# cluster-wide LIST/WATCH informer. Each read is a direct GET of a desired
# name, so only get is granted.
- apiGroups:
  - scheduling.k8s.io
  resources:
  - priorityclasses
  verbs:
  - get
- apiGroups:
  - cloud.google.com
  resources:
  - computeclasses
  verbs:
  - get
# The api-server's CreateObservabilityProvider RPC stores the wizard-supplied
# credential document as a new Secret (stringData, the credentials key) and
# deletes it best-effort when the admission webhook then rejects the CR — it
# never updates an existing Secret, so an overwrite stays impossible. Both
# write paths land in the release namespace only.
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
- apiGroups:
  - ""
  resources:
  - pods/log
  verbs:
  - get
  - list
# nodes/pods in metrics.k8s.io is what MetricsServer sums live usage across
# for the capacity board's `used` meter. Read-only, same blast radius as the
# core node/pod reads above: where the aggregated API is absent the provider
# reports NOT_AVAILABLE rather than needing this grant at all.
- apiGroups:
  - metrics.k8s.io
  resources:
  - nodes
  - pods
  verbs:
  - get
  - list
