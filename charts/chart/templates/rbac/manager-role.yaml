# The observability gateway resolves ObservabilityProviders and hands them to
# the matching connector; the provider-discovery controller also writes them
# (materializing annotated Services — core Services are already granted
# above). The gateway's status prober writes reachability verdicts (state,
# reason, Ready condition) through the status subresource on the same
# identity, so `kubectl get observabilityproviders` shows backend health.
- apiGroups:
  - observability.paprika.io
  resources:
  - observabilityproviders
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - observability.paprika.io
  resources:
  - observabilityproviders/status
  verbs:
  - get
