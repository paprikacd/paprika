{{- if .Values.prometheus.rules.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "paprika.resourceName" (dict "suffix" "alerts" "context" $) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "paprika.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- range $k, $v := .Values.commonLabels }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
spec:
  groups:
    - name: paprika
      rules:
        - alert: PaprikaComponentDown
          expr: |
            up{job=~".*{{ include "paprika.resourceName" (dict "suffix" "" "context" $) }}.*"} == 0
            or
            absent(up{job=~".*{{ include "paprika.resourceName" (dict "suffix" "" "context" $) }}.*"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Paprika component is down
            description: A Paprika component ({{ "{{ $labels.job }}" }}) has been unreachable for 5m.

        - alert: PaprikaReconcileErrors
          expr: rate(controller_runtime_reconcile_errors_total{service="{{ include "paprika.resourceName" (dict "suffix" "controller-manager-metrics-service" "context" $) }}"}[5m]) > 0.1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Paprika controller reconcile error rate is high
            description: Controller {{ "{{ $labels.controller }}" }} has an elevated error rate.

        - alert: PaprikaReconcileLatencyHigh
          expr: histogram_quantile(0.95, rate(controller_runtime_reconcile_time_seconds_bucket{service="{{ include "paprika.resourceName" (dict "suffix" "controller-manager-metrics-service" "context" $) }}"}[5m])) > 30
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Paprika reconcile latency is high
            description: Controller {{ "{{ $labels.controller }}" }} 95th percentile latency exceeds 30s.

        # Transition counters are created lazily: a series first appears at 1,
        # so increase() alone misses the first transition. Three branches:
        # - increase() catches a transition in the last five minutes.
        # - The "unless" branch catches a series that is new to this process: no
        #   sample in the hour before the last five minutes, or only samples
        #   written by an earlier process (its newest sample predates
        #   process_start_time_seconds on the same target). The range selector
        #   matters: an instant "offset 5m" lookback re-fires every old failure
        #   after a scrape gap, while last_over_time over a range sees the samples
        #   from before the gap.
        # - The last branch catches a value that rose above the last sample from
        #   before the last five minutes: an increment hidden by a Prometheus outage.
        # Blind spot: the restart check needs process_start_time_seconds on the
        #   same instance and pod. Without it (for example when the pod label is
        #   dropped), a failure in a container restarted in place, with the same
        #   label set, is missed for up to an hour while the old history remains.
        - alert: PaprikaReleaseFailed
          expr: |
            increase(paprika_release_phase_total{phase="Failed"}[5m]) > 0
            or
            paprika_release_phase_total{phase="Failed"} unless (
              last_over_time(paprika_release_phase_total{phase="Failed"}[1h] offset 5m)
              unless
              last_over_time(timestamp(paprika_release_phase_total{phase="Failed"})[1h:30s] offset 5m) < on (instance, pod) group_left () process_start_time_seconds
            )
            or
            paprika_release_phase_total{phase="Failed"} > last_over_time(paprika_release_phase_total{phase="Failed"}[1h] offset 5m)
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: Paprika release failed
            description: Release {{ "{{ $labels.release }}" }} in namespace {{ "{{ $labels.namespace }}" }} failed.

        # Current state, not a transition count: the gauge is per pod with the
        # same cluster-wide value, so max() collapses the replicas.
        - alert: PaprikaApplicationDegraded
          expr: max(paprika_applications_by_phase_ratio{phase="Degraded"}) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Paprika applications are degraded
            description: "{{ "{{ $value }}" }} application(s) are in the Degraded phase. The gauge has no application label; list them with kubectl get applications -A."

        - alert: PaprikaApplicationRolledBack
          expr: |
            increase(paprika_application_phase_total{phase="RolledBack"}[5m]) > 0
            or
            paprika_application_phase_total{phase="RolledBack"} unless (
              last_over_time(paprika_application_phase_total{phase="RolledBack"}[1h] offset 5m)
              unless
              last_over_time(timestamp(paprika_application_phase_total{phase="RolledBack"})[1h:30s] offset 5m) < on (instance, pod) group_left () process_start_time_seconds
            )
            or
            paprika_application_phase_total{phase="RolledBack"} > last_over_time(paprika_application_phase_total{phase="RolledBack"}[1h] offset 5m)
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: Paprika application rolled back
            description: Application {{ "{{ $labels.application }}" }} in namespace {{ "{{ $labels.namespace }}" }} was rolled back.

        - alert: PaprikaReleasesStuck
          expr: max(paprika_releases_stuck) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Paprika releases are stuck
            description: "{{ "{{ $value }}" }} non-terminal releases are older than the stuck-release threshold (30m)."

        - alert: PaprikaReleaseRetriesExhausted
          expr: max(paprika_applications_release_retries_exhausted) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Paprika application release retries exhausted
            description: "{{ "{{ $value }}" }} applications hold the ReleaseRetriesExhausted condition. The gauge has no application label; find them with kubectl get applications -A."

        - alert: PaprikaFleetIndexDegraded
          expr: max(paprika_fleet_index_degraded) == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Paprika fleet index is degraded
            description: The installed fleet index health is degraded; fleet queries may be serving stale data.

        # Depends on cAdvisor, not on Paprika: container_oom_events_total is
        # exported by the kubelet's cAdvisor endpoint and only reaches the
        # user's own Prometheus. The container names are the chart's
        # long-running containers: manager, api-server, repo-server,
        # webhook-receiver, observability-gateway (its dashboard-renderer
        # sidecar), insights, agent (the agent DaemonSet) and redis (the
        # extras Redis). Sidecars such as istio-proxy stay out.
        - alert: PaprikaOOMKilled
          expr: |
            sum by (namespace, pod, container) (
              increase(container_oom_events_total{namespace="{{ .Release.Namespace }}", pod=~"{{ include "paprika.resourceName" (dict "suffix" "" "context" $) }}-.*", container=~"manager|api-server|repo-server|webhook-receiver|observability-gateway|dashboard-renderer|insights|agent|redis"}[5m])
            ) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: Paprika container OOM killed
            description: Container {{ "{{ $labels.container }}" }} in pod {{ "{{ $labels.pod }}" }} was OOM killed.

        - alert: PaprikaApiServerHighRequestLatency
          expr: histogram_quantile(0.95, rate(paprika_api_request_duration_seconds_bucket[5m])) > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Paprika API server high request latency
            description: API server 95th percentile request latency exceeds 5s.
{{- end }}
