{{- if and .Values.satellite.internalDispatch.enabled (eq .Values.deploymentMode "split") }}
{{- /*
  Split mode puts the satellite links in the API server's process while the
  release reconciler runs in another pod. The token below is what lets the
  reconciler ask that process to dispatch a task; the listener refuses every
  request when no token is configured, so the two pods must share one.

  The lookup keeps the token stable across upgrades. Without it every helm
  upgrade would rotate the credential and interrupt dispatch until both pods
  restarted on the new value.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "paprika.resourceName" (dict "suffix" "satellite-internal" "context" .)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "paprika.resourceName" (dict "suffix" "satellite-internal" "context" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "paprika.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  {{- if and $existing (index $existing.data "token") }}
  token: {{ index $existing.data "token" }}
  {{- else }}
  token: {{ randAlphaNum 48 | b64enc | quote }}
  {{- end }}
{{- end }}
