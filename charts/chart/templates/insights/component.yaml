{{- if .Values.insights.enabled }}
{{- $name := include "paprika.resourceName" (dict "suffix" "insights" "context" .) }}
{{- $fallbackImage := .Values.apiServer.image }}
{{- if eq .Values.deploymentMode "monolith" }}
{{- $fallbackImage = .Values.manager.image }}
{{- end }}
{{- $repository := .Values.insights.image.repository | default $fallbackImage.repository }}
{{- $tag := .Values.insights.image.tag | default $fallbackImage.tag | default .Chart.AppVersion }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
data:
  providers.json: {{ dict "providers" .Values.insights.providers | toJson | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: insights
  ports:
    - name: http
      port: 8090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "paprika.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: insights
spec:
  # The atomic-file store has exactly one writer. Recreate prevents overlap.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: insights
  template:
    metadata:
      annotations:
        checksum/providers: {{ .Values.insights.providers | toJson | sha256sum }}
      labels:
        app.kubernetes.io/name: {{ include "paprika.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: insights
    spec:
      automountServiceAccountToken: false
      {{- with .Values.insights.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: insights
          image: "{{ $repository }}{{- if not (contains "@" $repository) }}:{{ $tag }}{{- end }}"
          imagePullPolicy: {{ .Values.insights.image.pullPolicy }}
          command: ["/insights"]
          args:
            - --listen=:8090
            - --data-dir=/var/lib/paprika-insights
            - --providers=/etc/paprika-insights/providers.json
          ports:
            - name: http
              containerPort: 8090
          env:
            {{- if .Values.observabilityGateway.enabled }}
            - name: PAPRIKA_OBSERVABILITY_GATEWAY_ADDR
              value: http://{{ include "paprika.resourceName" (dict "suffix" "observability-gateway" "context" .) }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.observabilityGateway.service.port }}
            {{- end }}
            - name: PAPRIKA_INSIGHTS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "insights.token.existingSecretName is required when Insights is enabled" .Values.insights.token.existingSecretName }}
                  key: {{ .Values.insights.token.existingSecretKey | default "token" }}
            {{- with .Values.insights.extraEnv }}
            {{- include "paprika.extraEnv" . | nindent 12 }}
            {{- end }}
          {{- with .Values.insights.extraEnvFrom }}
          envFrom:
            {{- include "paprika.extraEnvFrom" . | nindent 12 }}
          {{- end }}
          resources: {{ toYaml .Values.insights.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/paprika-insights
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/paprika-insights
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: dashboards
          {{- if .Values.insights.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.insights.persistence.existingClaim | default $name }}
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- if and .Values.insights.persistence.enabled (not .Values.insights.persistence.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Saved dashboards and queries must survive disabling/removing Insights.
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.insights.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.insights.persistence.size }}
{{- end }}
{{- end }}
