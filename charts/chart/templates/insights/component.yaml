{{- if .Values.insights.enabled }}
{{- $name := include "paprika.resourceName" (dict "suffix" "insights" "context" .) }}
{{- $fallbackImage := .Values.apiServer.image }}
{{- if eq .Values.deploymentMode "monolith" }}
{{- $fallbackImage = .Values.manager.image }}
{{- end }}
{{- $repository := .Values.insights.image.repository | default $fallbackImage.repository }}
{{- $tag := .Values.insights.image.tag | default $fallbackImage.tag | default .Chart.AppVersion }}
{{- $capacity := .Values.insights.capacity }}
{{- /*
  The gateway's effective values, from observabilityGateway.capacity and its
  built-ins. A null value takes the built-in; provider concurrency 0 means
  min(2, query concurrency), as the gateway reads it.
*/}}
{{- if .Values.observabilityGateway.enabled }}
{{- $gateway := .Values.observabilityGateway.capacity }}
{{- $gatewayQueryConcurrency := 4 }}
{{- if not (kindIs "invalid" $gateway.queryConcurrency) }}{{ $gatewayQueryConcurrency = int $gateway.queryConcurrency }}{{ end }}
{{- $gatewayQueryQueue := 32 }}
{{- if not (kindIs "invalid" $gateway.queryQueue) }}{{ $gatewayQueryQueue = int $gateway.queryQueue }}{{ end }}
{{- $gatewayProviderConcurrency := min 2 $gatewayQueryConcurrency }}
{{- if and (not (kindIs "invalid" $gateway.queryProviderConcurrency)) (gt (int $gateway.queryProviderConcurrency) 0) }}{{ $gatewayProviderConcurrency = int $gateway.queryProviderConcurrency }}{{ end }}
{{- $gatewayProviderQueue := 8 }}
{{- if not (kindIs "invalid" $gateway.queryProviderQueue) }}{{ $gatewayProviderQueue = int $gateway.queryProviderQueue }}{{ end }}
{{- /* Insights' queries and catalog listings both take the gateway's global budget. */}}
{{- if or (not (kindIs "invalid" $capacity.queryConcurrency)) (not (kindIs "invalid" $capacity.catalogConcurrency)) }}
{{- $insightsQueryConcurrency := 16 }}
{{- if not (kindIs "invalid" $capacity.queryConcurrency) }}{{ $insightsQueryConcurrency = int $capacity.queryConcurrency }}{{ end }}
{{- $insightsCatalogConcurrency := 4 }}
{{- if not (kindIs "invalid" $capacity.catalogConcurrency) }}{{ $insightsCatalogConcurrency = int $capacity.catalogConcurrency }}{{ end }}
{{- if gt (add $insightsQueryConcurrency $insightsCatalogConcurrency) (add $gatewayQueryConcurrency $gatewayQueryQueue) }}
{{- fail (printf "insights.capacity queryConcurrency %d plus catalogConcurrency %d (effective values) exceeds the gateway's queryConcurrency plus queryQueue (%d): the gateway would refuse the extra load" $insightsQueryConcurrency $insightsCatalogConcurrency (add $gatewayQueryConcurrency $gatewayQueryQueue)) }}
{{- end }}
{{- end }}
{{- if not (kindIs "invalid" $capacity.catalogConcurrency) }}
{{- if gt (int $capacity.catalogConcurrency) (add $gatewayProviderConcurrency $gatewayProviderQueue) }}
{{- fail (printf "insights.capacity.catalogConcurrency=%d exceeds the gateway's queryProviderConcurrency plus queryProviderQueue (%d): the gateway would refuse the extra catalog reads" (int $capacity.catalogConcurrency) (add $gatewayProviderConcurrency $gatewayProviderQueue)) }}
{{- end }}
{{- end }}
{{- /* The dashboard parallelism the binary runs with: null takes its built-in, 2. Each read holds one gateway
      orchestration slot and up to parallelism-1 more data requests, so the effective value may not exceed the
      per-provider bulkhead, and the gateway must keep a work slot free for console reads. Parallelism 1 is the
      serial path, which adds no load beyond master, so it is not checked. */}}
{{- $parallelism := 2 }}
{{- if not (kindIs "invalid" $capacity.dashboardQueryParallelism) }}{{ $parallelism = int $capacity.dashboardQueryParallelism }}{{ end }}
{{- if gt $parallelism 1 }}
{{- if gt $parallelism $gatewayProviderConcurrency }}
{{- fail (printf "insights.capacity.dashboardQueryParallelism (effective %d) exceeds the gateway's queryProviderConcurrency (%d): the extra queries would queue at its per-provider bulkhead. Set dashboardQueryParallelism to %d or lower" $parallelism $gatewayProviderConcurrency $gatewayProviderConcurrency) }}
{{- end }}
{{- $gatewayWorkSlots := $gatewayQueryConcurrency }}
{{- if and (not (kindIs "invalid" $gateway.httpWorkSlots)) (gt (int $gateway.httpWorkSlots) 0) }}{{ $gatewayWorkSlots = int $gateway.httpWorkSlots }}{{ end }}
{{- $gatewayDashboardSlots := min 2 $gatewayQueryConcurrency }}
{{- if and (not (kindIs "invalid" $gateway.httpDashboardSlots)) (gt (int $gateway.httpDashboardSlots) 0) }}{{ $gatewayDashboardSlots = int $gateway.httpDashboardSlots }}{{ end }}
{{- if ge (add $gatewayDashboardSlots (sub $parallelism 1)) $gatewayWorkSlots }}
{{- fail (printf "insights.capacity.dashboardQueryParallelism (effective %d) plus the gateway's httpDashboardSlots (%d) must stay below its httpWorkSlots (%d), so console reads keep a work slot. Lower dashboardQueryParallelism; 1 runs reads serially" $parallelism $gatewayDashboardSlots $gatewayWorkSlots) }}
{{- end }}
{{- end }}
{{- end }}
{{- /* The two waits must sum to less than the Insights query budget (22s), or the
      binary refuses to start. Waits are whole seconds or milliseconds. */}}
{{- if or (not (kindIs "invalid" $capacity.queryQueueWait)) (not (kindIs "invalid" $capacity.catalogQueueWait)) }}
{{- $queryWaitMs := 2000 }}
{{- if not (kindIs "invalid" $capacity.queryQueueWait) }}{{ $queryWaitMs = include "paprika.insightsWaitMillis" (dict "value" $capacity.queryQueueWait "field" "queryQueueWait") | int }}{{ end }}
{{- $catalogWaitMs := 5000 }}
{{- if not (kindIs "invalid" $capacity.catalogQueueWait) }}{{ $catalogWaitMs = include "paprika.insightsWaitMillis" (dict "value" $capacity.catalogQueueWait "field" "catalogQueueWait") | int }}{{ end }}
{{- if ge (add $queryWaitMs $catalogWaitMs) 22000 }}
{{- fail (printf "insights.capacity queryQueueWait plus catalogQueueWait (effective %dms + %dms) must be under the 22s query budget" $queryWaitMs $catalogWaitMs) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
data:
  providers.json: {{ dict "providers" .Values.insights.providers | toJson | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: insights
  ports:
    - name: http
      port: 8090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "paprika.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: insights
spec:
  # The atomic-file store has exactly one writer. Recreate prevents overlap.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: insights
  template:
    metadata:
      annotations:
        checksum/providers: {{ .Values.insights.providers | toJson | sha256sum }}
      labels:
        app.kubernetes.io/name: {{ include "paprika.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: insights
    spec:
      automountServiceAccountToken: false
      {{- with .Values.insights.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: insights
          image: "{{ $repository }}{{- if not (contains "@" $repository) }}:{{ $tag }}{{- end }}"
          imagePullPolicy: {{ .Values.insights.image.pullPolicy }}
          command: ["/insights"]
          args:
            - --listen=:8090
            - --data-dir=/var/lib/paprika-insights
            - --providers=/etc/paprika-insights/providers.json
            {{- /* Each capacity flag is emitted only when set, so an older image still starts on its built-in. */}}
            {{- if not (kindIs "invalid" $capacity.queryConcurrency) }}
            - --query-concurrency={{ $capacity.queryConcurrency }}
            {{- end }}
            {{- if not (kindIs "invalid" $capacity.queryQueue) }}
            - --query-queue={{ $capacity.queryQueue }}
            {{- end }}
            {{- if not (kindIs "invalid" $capacity.queryQueueWait) }}
            - --query-queue-wait={{ $capacity.queryQueueWait }}
            {{- end }}
            {{- if not (kindIs "invalid" $capacity.catalogConcurrency) }}
            - --catalog-concurrency={{ $capacity.catalogConcurrency }}
            {{- end }}
            {{- if not (kindIs "invalid" $capacity.catalogQueue) }}
            - --catalog-queue={{ $capacity.catalogQueue }}
            {{- end }}
            {{- if not (kindIs "invalid" $capacity.catalogQueueWait) }}
            - --catalog-queue-wait={{ $capacity.catalogQueueWait }}
            {{- end }}
            {{- if not (kindIs "invalid" $capacity.dashboardQueryParallelism) }}
            - --dashboard-query-parallelism={{ $capacity.dashboardQueryParallelism }}
            {{- end }}
            {{- /* The result cache budget is emitted only when set, so an older image still starts on its built-in. */}}
            {{- if not (kindIs "invalid" .Values.insights.resultCacheMiB) }}
            - --result-cache-mib={{ .Values.insights.resultCacheMiB }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8090
          env:
            {{- if .Values.observabilityGateway.enabled }}
            - name: PAPRIKA_OBSERVABILITY_GATEWAY_ADDR
              value: http://{{ include "paprika.resourceName" (dict "suffix" "observability-gateway" "context" .) }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.observabilityGateway.service.port }}
            {{- end }}
            - name: PAPRIKA_INSIGHTS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "insights.token.existingSecretName is required when Insights is enabled" .Values.insights.token.existingSecretName }}
                  key: {{ .Values.insights.token.existingSecretKey | default "token" }}
            {{- with .Values.insights.extraEnv }}
            {{- include "paprika.extraEnv" . | nindent 12 }}
            {{- end }}
          {{- with .Values.insights.extraEnvFrom }}
          envFrom:
            {{- include "paprika.extraEnvFrom" . | nindent 12 }}
          {{- end }}
          resources: {{ toYaml .Values.insights.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/paprika-insights
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/paprika-insights
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: dashboards
          {{- if .Values.insights.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.insights.persistence.existingClaim | default $name }}
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- if and .Values.insights.persistence.enabled (not .Values.insights.persistence.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Saved dashboards and queries must survive disabling/removing Insights.
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.insights.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.insights.persistence.size }}
{{- end }}
{{- end }}
