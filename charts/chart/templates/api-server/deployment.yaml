{{- if and .Values.mcp.enabled (ne .Values.deploymentMode "split") }}
{{- fail "mcp.enabled=true requires deploymentMode: split. MCP support (the --mcp-* flags and PAPRIKA_MCP_PUBLIC_URL) is currently wired only into the split-mode api-server Deployment; deploymentMode: monolith does not render any of it, which would otherwise be a silent no-op with no flags, no warning, and a deployment that looks healthy. Set deploymentMode: split to use MCP; monolith support is not yet implemented." }}
{{- end }}
{{- if eq .Values.deploymentMode "split" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "paprika.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api-server
    {{- range $k, $v := .Values.commonLabels }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
  name: {{ include "paprika.resourceName" (dict "suffix" "api-server" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  {{- with .Values.apiServer.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.revisionHistoryLimit }}
  revisionHistoryLimit: {{ . }}
  {{- end }}
  replicas: {{ .Values.apiServer.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "paprika.name" . }}
      app.kubernetes.io/component: api-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "paprika.name" . }}
        helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/component: api-server
        {{- range $k, $v := .Values.commonLabels }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
    spec:
      automountServiceAccountToken: {{ .Values.apiServer.automountServiceAccountToken | default false }}
      {{- with .Values.apiServer.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apiServer.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.apiServer.tolerations }}
      tolerations: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.apiServer.affinity }}
      affinity: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.apiServer.topologySpreadConstraints }}
      topologySpreadConstraints: {{ toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.apiServer.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      securityContext:
        {{- if .Values.apiServer.podSecurityContext }}
        {{- toYaml .Values.apiServer.podSecurityContext | nindent 8 }}
        {{- else }}
        {}
        {{- end }}
      {{- with .Values.apiServer.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.mcp.enabled }}
      {{- if not .Values.auth.enabled }}
      {{- fail "mcp.enabled requires auth.enabled: refusing to expose fleet mutation unauthenticated" }}
      {{- end }}
      {{- $mcpHasTokenSecret := false }}
      {{- range .Values.apiServer.extraEnv }}
      {{- if eq .name "PAPRIKA_AUTH_TOKEN_SECRET" }}
      {{- $mcpHasTokenSecret = true }}
      {{- end }}
      {{- end }}
      {{- if and (not $mcpHasTokenSecret) (eq (len .Values.apiServer.extraEnvFrom) 0) }}
      {{- fail "mcp.enabled requires a non-empty auth token secret: set PAPRIKA_AUTH_TOKEN_SECRET via apiServer.extraEnv or apiServer.extraEnvFrom (the MCP server signs and verifies tokens with the same secret the API server's self-signed authenticator uses)" }}
      {{- end }}
      {{- if not .Values.mcp.oauth.clientId }}
      {{- fail "mcp.oauth.clientId is required when mcp.enabled=true" }}
      {{- end }}
      {{- if eq (len .Values.mcp.oauth.redirectUris) 0 }}
      {{- fail "mcp.oauth.redirectUris is required when mcp.enabled=true" }}
      {{- end }}
      {{- if not .Values.mcp.publicURL }}
      {{- fail "mcp.publicURL is required when mcp.enabled=true: it is embedded in RFC 9728/8414 discovery metadata and used as the minted token's issuer, so it must be set explicitly rather than defaulting to a loopback address" }}
      {{- end }}
      {{- end }}
      containers:
      - args:
        - --mode=api
        - --health-probe-bind-address=:8081
        # See the manager deployment: the release namespace, not the flag's
        # default, is what bounds Global-scoped DataProviderBindings.
        - --operator-namespace={{ .Release.Namespace }}
        - --metrics-bind-address={{ .Values.metrics.bindAddress }}
        {{- include "paprika.authArgs" . | nindent 8 }}
        {{- if .Values.mcp.enabled }}
        - --mcp-enabled=true
        - --mcp-bind-address={{ .Values.mcp.bindAddress }}
        - --mcp-access-token-ttl={{ .Values.mcp.accessTokenTTL }}
        - --mcp-refresh-token-ttl={{ .Values.mcp.refreshTokenTTL }}
        - --mcp-oauth-client-id={{ .Values.mcp.oauth.clientId }}
        - --mcp-oauth-redirect-uris={{ join "," .Values.mcp.oauth.redirectUris }}
        {{- end }}
        {{- range .Values.apiServer.args }}
        - {{ . }}
        {{- end }}
        command:
        - /manager
        image: "{{ .Values.apiServer.image.repository }}{{- if not (contains "@" .Values.apiServer.image.repository) }}:{{ .Values.apiServer.image.tag | default .Chart.AppVersion }}{{- end }}"
        {{- with .Values.apiServer.image.pullPolicy }}
        imagePullPolicy: {{ . }}
        {{- end }}
        {{- with .Values.apiServer.startupProbe }}
        startupProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: api-server
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        - containerPort: 3000
          name: api
          protocol: TCP
        - containerPort: 8080
          name: metrics
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- if .Values.apiServer.resources }}
          {{- toYaml .Values.apiServer.resources | nindent 10 }}
          {{- else }}
          {}
          {{- end }}
        securityContext:
          {{- if .Values.apiServer.securityContext }}
          {{- toYaml .Values.apiServer.securityContext | nindent 10 }}
          {{- else }}
          {}
          {{- end }}
        volumeMounts:
          {{- toYaml .Values.apiServer.extraVolumeMounts | nindent 10 }}
          {{- if .Values.mtls.enabled }}
          - name: mtls-cert
            mountPath: /etc/paprika/tls
            readOnly: true
          {{- end }}
        env:
        {{- include "paprika.cacheEnv" . | nindent 8 }}
        {{- include "paprika.auditEnv" . | nindent 8 }}
        {{- include "paprika.githubActionsTokenExchangeEnv" . | nindent 8 }}
        {{- include "paprika.oidcSecretEnv" . | nindent 8 }}
        {{- if .Values.repoServer.enabled }}
        - name: PAPRIKA_REPO_SERVER_ADDR
          value: http://{{ include "paprika.resourceName" (dict "suffix" "repo-server" "context" .) }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.repoServer.service.port }}
        {{- if .Values.repoServer.clientTimeout }}
        - name: PAPRIKA_REPO_SERVER_TIMEOUT
          value: {{ .Values.repoServer.clientTimeout | quote }}
        {{- end }}
        {{- end }}
        {{- if and .Values.auth.enabled (gt (len .Values.auth.rbac) 0) }}
        - name: PAPRIKA_AUTH_RBAC_RULES
          valueFrom:
            configMapKeyRef:
              name: {{ include "paprika.resourceName" (dict "suffix" "auth-rbac" "context" .) }}
              key: rbac.json
        {{- end }}
        {{- if .Values.mtls.enabled }}
        - name: PAPRIKA_MTLS_ENABLED
          value: "true"
        - name: PAPRIKA_TLS_CERT
          value: /etc/paprika/tls/tls.crt
        - name: PAPRIKA_TLS_KEY
          value: /etc/paprika/tls/tls.key
        {{- end }}
        {{- if .Values.mcp.enabled }}
        - name: PAPRIKA_MCP_PUBLIC_URL
          value: {{ .Values.mcp.publicURL | quote }}
        {{- end }}
        {{- include "paprika.otelEnv" . | nindent 8 }}
        {{- include "paprika.downwardEnv" . | nindent 8 }}
        {{- with .Values.apiServer.extraEnv }}
        {{- include "paprika.extraEnv" . | nindent 8 }}
        {{- end }}
        {{- with .Values.apiServer.extraEnvFrom }}
        envFrom:
        {{- include "paprika.extraEnvFrom" . | nindent 8 }}
        {{- end }}
      securityContext:
        {{- if .Values.apiServer.podSecurityContext }}
        {{- toYaml .Values.apiServer.podSecurityContext | nindent 8 }}
        {{- else }}
        {}
        {{- end }}
      serviceAccountName: {{ include "paprika.serviceAccountName" . }}
      {{- $pc := .Values.apiServer.priorityClassName | default .Values.priorityClassName }}
      {{- if $pc }}
      priorityClassName: {{ $pc | quote }}
      {{- end }}
      volumes:
        {{- toYaml .Values.apiServer.extraVolumes | nindent 8 }}
        {{- if .Values.mtls.enabled }}
        - name: mtls-cert
          secret:
            secretName: {{ include "paprika.resourceName" (dict "suffix" "api-server-mtls" "context" $) }}
        {{- end }}
{{- end }}
