    existingSecretKey: "secret"

# Remote cluster connection (api mode only)
remoteCluster:
  # -- Kubernetes API server URL (e.g., https://1.2.3.4:443)
  apiServer: ""
  # -- Path to mounted service account token file
  tokenFile: ""

## Repo server caches git/S3 sources and renders manifests.
##
repoServer:
  enabled: false
  replicas: 2
  # -- Client timeout used by controllers/webhooks when calling the repo server.
  clientTimeout: 5m

  ## Git fetching (PAPRIKA_GIT_* env vars, also set on the manager, whose
  ## local fallback renderer resolves sources the same way). With the git CLI
  ## the repo server
  ## resolves a branch with ls-remote (one round trip), fetches the commit at
  ## depth 1 as a blobless partial clone (the commit and its trees), then
  ## fetches only the blobs under the source's path: brandbrain's 102 KB chart
  ## costs about 1 MB and 3 s cold, where go-git downloaded its 8.9 GB tip in
  ## 13 minutes. Concurrent resolves of one commit share one fetch.
  git:
    # -- auto uses the git CLI when the image ships git (the cluster image built
    # from Dockerfile does; the release image does not) and go-git otherwise.
    # go-git downloads every blob of the tip tree. Upgrading an existing
    # install: this release makes go-git check out executable files, which
    # changes the source hash of apps with one in their path, so first deploy
    # with go-git, let those apps' one Release of the same commit settle, then
    # set auto (hash-neutral) in a separate upgrade.
    backend: auto
    # -- Git fetches the repo server runs at once across all repositories.
    # Fetches into one repository are serialized, so a slow repository holds
    # at most one slot and never blocks the others.
    maxConcurrentFetches: 4
    # -- Upper bound on one git fetch. At it the git process and every process
    # it started are killed.
    fetchTimeout: 10m

  ## Git cache on disk: <work dir>/git-cache holds one blobless mirror per
  ## repository and the checked-out source paths. maxSize and minAge apply to
  ## each work dir (the manager's fallback renderer has two).
  cache:
    # -- Size bound. Above it the least recently used mirrors and checkouts
    # are evicted. Keep it below the volume holding the cache (the /tmp
    # emptyDir's sizeLimit, or persistence.size). "" or 0 disables eviction.
    maxSize: 20Gi
    # -- Entries used more recently than this are never evicted: a render may
    # still be reading them.
    minAge: 15m
    ## Keep the cache across restarts on a PersistentVolumeClaim mounted at the
    ## repo server's work dir.
    ##
    ## Trade-off: a ReadWriteOnce volume needs one replica and a strategy that
    ## stops the old pod first (Recreate, rendered when repoServer.strategy is
    ## unset, or RollingUpdate with maxSurge 0), so every rollout leaves the
    ## repo server unavailable while the volume detaches and attaches (tens of
    ## seconds on Vultr block storage); the controller renders locally if it
    ## cannot reach the repo server. With the git CLI backend a cold cache
    ## costs about one commit's trees plus the source path's files per
    ## repository, so persistence pays off mainly for whole-repository sources
    ## (no path) and for the go-git backend.
    persistence:
      enabled: false
      # -- Use an existing claim instead of creating one.
      existingClaim: ""
      size: 30Gi
      storageClassName: ""
      accessMode: ReadWriteOnce
      # -- Mount path; the repo server's --repo-workdir is set to it.
      mountPath: /tmp/paprika-repo

  image:
    repository: controller
    ## Image tag (defaults to Chart.appVersion if not set)
    ##
    # tag: ""
    pullPolicy: IfNotPresent

  ## Image pull secrets
  ##
  # imagePullSecrets:
  #   - name: myregistrykey

  args:
    - --mode=repo-server
    - --ui-bind-address=:8082
    - --health-probe-bind-address=:8081

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  resources:
    limits:
      cpu: 2000m
      memory: 3Gi
    requests:
      cpu: 500m
      memory: 1Gi

  ## Deployment strategy
  ##
  # strategy:
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxSurge: 25%
  #     maxUnavailable: 25%

  extraEnv: []

  extraEnvFrom: []

  # priorityClassName: ""

  ## Init containers (run before the main container)
  ##
  # initContainers:
  #   - name: init-deps
  #     image: busybox:1.36
  #     command: ['sh', '-c', 'until nc -z redis 6379; do sleep 1; done']

  ## Node selector (pins pods to specific node pools)
  ##
  nodeSelector: {}

  ## Pod affinity / anti-affinity (recommended for HA)
  ##
  affinity: {}

  ## Pod tolerations (tolerate spot/preemptible nodes)
  ##
  tolerations: []

  ## Topology spread constraints (spread across zones)
  ##
  # topologySpreadConstraints: []

  ## Termination grace period (seconds). Defaults to 30 if unset.
  ##
  # terminationGracePeriodSeconds: 20

  ## Startup probe configures the kubelet startup check.
  ## Disabled by default — configure if startup takes > 15s.
  # startupProbe:
  #   initialDelaySeconds: 10
  #   periodSeconds: 10
  #   failureThreshold: 6

  ## /tmp holds the git cache unless repoServer.cache.persistence is enabled.
  ## sizeLimit bounds it: past it the kubelet evicts the pod, which restarts
  ## with an empty cache, instead of the cache filling the node's disk (117 GB
  ## of one repository's go-git packs did, 2026-10-11). repoServer.cache.maxSize
  ## keeps the cache itself below it. Overriding repoServer.extraVolumes
  ## replaces this list and drops the limit.
  extraVolumes:
    - emptyDir:
        sizeLimit: 50Gi
      name: tmp

  extraVolumeMounts:
    - mountPath: /tmp
      name: tmp

  service:
    type: ClusterIP
    port: 8082
    ## Service annotations (e.g., for AWS NLB, service mesh)
    ##
    # annotations:
    #   service.beta.kubernetes.io/aws-load-balancer-type: "nlb"

  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 75

  vpa:
    enabled: false
    mode: "Off"

  pdb:
    enabled: false
    minAvailable: 1

## Observability gateway: the MCP surface for querying observability backends
## (logs, metrics, traces) through pluggable connectors. Runs as its own
## Deployment in split mode and serves https://<mcp.publicURL>/observe/mcp with
## the paprika:observe scope and paprika-observability token audience — tokens
## minted for the console MCP surface at /mcp are not valid here and vice
## versa. Requires auth.enabled, deploymentMode: split, mcp.publicURL, and the
## shared HMAC token secret via extraEnv/extraEnvFrom. mcp.enabled controls the
## independent fleet surface and may remain false for a gateway-only install.
##
observabilityGateway:
  enabled: false
  # -- Retain Observe OAuth sessions in a separate Kubernetes Secret.
  # Enabling this on an existing in-memory installation needs a fresh grant.
  persistSessions: false
  replicas: 1

  ## How often the gateway probes every registered provider and writes the
  ## reachability verdict (state, reason, Ready condition) onto each CR's
  ## status. 0 disables status writes.
  probeInterval: 5m

  ## Query-path capacity per gateway process. Each value is passed to the
  ## gateway only when set: null (the default) omits its flag, so the gateway's
  ## built-in value applies, and an older gateway image still starts. An
  ## explicit 0 or "0s" is passed as set. The gateway validates the
  ## combination at startup and refuses to start on one that cannot work,
  ## naming the value to change. Durations need a unit ("5s"); "0s" rejects at
  ## once. Docs: docs/guides/observability-gateway.md ("End-to-end capacity").
  capacity:
    ## Queries executing at once across all providers (1-1024). Built-in: 4.
    ## Also the default for httpWorkSlots, and the cap on httpDashboardSlots.
    queryConcurrency: null
    ## Queries executing at once per provider (1 to queryConcurrency). Built-in:
    ## 0, which means min(2, queryConcurrency). Provider listing shares this
    ## per-provider bulkhead, so 1 also serialises listings.
    queryProviderConcurrency: null
    ## Queries waiting for a slot across all providers (0-65536). Built-in: 32.
    ## With 0, set queryProviderQueue to 0 as well.
    queryQueue: null
    ## Queries waiting for one provider's slot. Must not exceed queryQueue.
    ## Built-in: 8.
    queryProviderQueue: null
    ## Longest a query waits for a slot. Above 0 and below the 30s request
    ## timeout. The sum of httpAdmissionWait, the 2s MCP rate queue, this wait
    ## and the 30s execution budget must not exceed 40s, which leaves 5s before
    ## the 45s write timeout. Durations below 1ms are refused. Built-in: 5s.
    queryQueueWait: null
    ## HTTP slots for MCP data-tool requests (0-65536). Built-in: 0, which means
    ## queryConcurrency. Explicit values may go up to queryConcurrency +
    ## queryQueue. Up to queryQueue requests may wait at the edge for a slot, so
    ## the edge admits the same burst the budget can queue (4 running + 32
    ## waiting at defaults).
    httpWorkSlots: null
    ## HTTP slots for provider discovery and MCP handshakes. Built-in: 0, which
    ## follows httpWorkSlots.
    httpCatalogSlots: null
    ## HTTP slots for orchestration tools, query_dashboard and render_dashboard,
    ## which run nested data requests (0-65536). Built-in: 0, which means
    ## min(2, queryConcurrency). Explicit values may go up to queryConcurrency.
    ## Not tied to queryProviderConcurrency.
    httpDashboardSlots: null
    ## Slots held only while a body is read and classified (0-65536). Built-in:
    ## 0, which means twice httpWorkSlots. Not a cap on all in-flight requests.
    httpIntakeSlots: null
    ## One deadline per request, shared by its intake and pool waits. At most
    ## 5s; "0s" refuses at once. Must not exceed queryQueueWait. A refused
    ## request gets 429 with Retry-After: 1. Built-in: 1s.
    httpAdmissionWait: null

  # Avoid overlapping gateways unless every component's state has been
  # configured and verified for the intended replica count.
  strategy:
    type: Recreate

  # Existing service account for a separately approved least-privilege identity.
  # Empty retains the release service account; this chart grants no extra
  # permissions to a custom identity.
  serviceAccountName: ""

  # Disable for manually approved providers and a query-only service account.
  discovery:
    enabled: true

  # Additional NetworkPolicy egress rules for explicitly selected in-cluster
  # providers (for example a Prometheus podSelector and TCP port 9090).
  # Empty does not grant access to nonstandard backend ports.
  additionalEgress: []

  # Additional public CA certificates for provider TLS verification, keyed by
  # filename (.crt or .pem; one PEM certificate per file). Helm mounts these
  # read-only and restarts the gateway when they change. System trust remains
  # available; do not also set SSL_CERT_DIR in extraEnv when using this map.
  # Never put private keys or provider credentials here.
  additionalCACertificates: {}

  image:
    repository: controller
    ## Image tag (defaults to Chart.appVersion if not set)
    ##
    # tag: ""
    pullPolicy: IfNotPresent

  ## Extra args for the gateway container. --ui-bind-address is the serve
  ## address (the gateway reuses the binary's UI listener flag, like
  ## repo-server); it must match service.port below.
  args:
    - --ui-bind-address=:8090

  ## The gateway reads ObservabilityProvider CRs and credential Secrets through
  ## the Kubernetes API — the service account token must stay mounted.
  automountServiceAccountToken: true

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 96Mi

  service:
    type: ClusterIP
    port: 8090
    annotations: {}

  ## Public exposure. The gateway reuses the api-server's Gateway API
  ## gatewayRef and hostname and routes only the /observe path prefix — no
  ## separate DNS name or TLS identity is needed.
  ingress:
    enabled: false
    annotations: {}
    ## Gateway API request timeout for the /observe route. Envoy Gateway's
    ## default is 15 s, which cut a six-read query_dashboard at 15.00 s with a
    ## 504. Keep it above the gateway's 45 s HTTP write timeout (so the gateway,
    ## not the edge, decides a slow query's outcome) and below Cloudflare's
    ## 125 s default proxy read timeout. Must be a single-unit Go duration between 46s and
    ## 119s; chart-validated. Edge bounds: docs/guides/observability-gateway.md.
    requestTimeout: "50s"

  extraEnv: []
  extraEnvFrom: []
  extraVolumes: []
  extraVolumeMounts: []

  # Optional, isolated screenshot worker for read-only render_dashboard.
  # Never enable before publishing and testing the pinned renderer image.
  renderWorker:
    enabled: false
    image: "" # exact ghcr.io/paprikacd/paprika-render-worker@sha256:<digest>
    uiOrigin: "" # trusted in-cluster Paprika API UI origin
    secretName: "" # pre-existing K8s Secret, never checked into values
    secretKey: secret
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 75

  vpa:
    enabled: false
    mode: "Off"

  pdb:
    enabled: false
    minAvailable: 1

## In-cluster agent for remote cluster deployments.
## The agent runs as a DaemonSet and applies manifests sent by the controller.
##
agent:
  enabled: false

  tls:
    enabled: false
    certSecret: ""
    caSecret: ""

  image:
    repository: controller
    ## Image tag (defaults to Chart.appVersion if not set)
    ##
    # tag: ""
    pullPolicy: IfNotPresent

  ## Image pull secrets
  ##
  # imagePullSecrets:
  #   - name: myregistrykey

  args:
    - --mode=agent
    - --ui-bind-address=:8083
    - --health-probe-bind-address=:8081

  clusterId: ""

  ## Termination grace period (seconds). Defaults to 30 if unset.
  ##
  # terminationGracePeriodSeconds: 20

  ## Startup probe configures the kubelet startup check.
  ## Disabled by default — configure if startup takes > 15s.
  # startupProbe:
  #   initialDelaySeconds: 10
  #   periodSeconds: 10
  #   failureThreshold: 6

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

  extraEnv: []

  extraEnvFrom: []

  # priorityClassName: ""

  ## Init containers (run before the main container)
  ##
  # initContainers:
  #   - name: init-deps
  #     image: busybox:1.36
  #     command: ['sh', '-c', 'until nc -z redis 6379; do sleep 1; done']

  extraVolumes:
    - emptyDir: {}
      name: tmp

  extraVolumeMounts:
    - mountPath: /tmp
      name: tmp

  service:
    type: ClusterIP
    port: 3000
    ## Service annotations (e.g., for AWS NLB, service mesh)
    ##
    # annotations:
    #   service.beta.kubernetes.io/aws-load-balancer-type: "nlb"

  nodeSelector: {}

  tolerations: []

  affinity: {}

  topologySpreadConstraints: []

  vpa:
    enabled: false
    mode: "Off"

## API server authentication and authorization
##
## Independent observability query and dashboard component. Available in both
## deployment modes through the authenticated /api/insights/ proxy.
insights:
  enabled: false
  # Uses the main Paprika image, which includes /insights. Override when needed.
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  token:
    # Required when enabled; use the same >=32-character token in both services.
    existingSecretName: ""
    existingSecretKey: token
  # With observabilityGateway.enabled, Insights also discovers authorized
  # Prometheus/Tempo ObservabilityProvider CRs used by paprika-observe MCP.
  # Shared providers use the signed-in caller's namespace RBAC and Secrets stay
  # in the gateway. The local list below is optional for standalone providers.
  # Provider URLs and credential environment-variable names are administrator
  # configuration. Actual credentials belong in Secrets via extraEnv/extraEnvFrom.
  providers: []
  # - id: prometheus
  #   name: Production metrics
  #   type: prometheus
  #   url: http://prometheus.monitoring.svc.cluster.local:9090
  # - id: tempo
  #   name: Production traces
  #   type: tempo
  #   url: http://tempo.monitoring.svc.cluster.local:3200
  #   headersEnv:
  #     X-Scope-OrgID: TEMPO_TENANT
  # Admission capacity for Insights' own pools (1 to 1024 per count). Each null
  # omits its flag, so the Insights built-in applies and an older image still
  # starts. With observabilityGateway.enabled, the render fails when the
  # effective queryConcurrency plus catalogConcurrency exceeds the gateway's
  # queryConcurrency plus queryQueue (both are global budget slots), or an
  # explicit catalogConcurrency exceeds the gateway's queryProviderConcurrency
  # plus queryProviderQueue. Built-in: queryConcurrency 16, queryQueue 64,
  # queryQueueWait 2s, catalogConcurrency 4, catalogQueue 16, catalogQueueWait 5s.
  # Waits are whole seconds (2s) or milliseconds (500ms). queryQueueWait plus
  # catalogQueueWait must stay under the 22s Insights query budget, or the
  # render fails and the binary would refuse to start.
  capacity:
    queryConcurrency: null
    queryQueue: null
    queryQueueWait: null
    catalogConcurrency: null
    catalogQueue: null
    catalogQueueWait: null
    # Queries one dashboard read runs at once (1-4). Built-in: 2. 1 runs them one
    # at a time. With observabilityGateway.enabled, the effective value (null is
    # 2) must not exceed the gateway's queryProviderConcurrency, and
    # dashboardQueryParallelism minus one plus the gateway's httpDashboardSlots
    # must stay below its httpWorkSlots, so console reads keep a work slot. Both
    # checks are skipped at 1.
    dashboardQueryParallelism: null
  extraEnv: []
  extraEnvFrom: []
  persistence:
    enabled: true
    existingClaim: ""
    size: 1Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # Per-component NetworkPolicy switch for Insights only. It renders the Insights
  # policy alone, and only when insights.enabled is true. The policies of the other
  # components follow networkPolicy.enabled, which also renders the Insights policy.
  # Ingress on :8090 comes from the api-server and the observability-gateway. The
  # controller-manager is admitted only in monolith mode, where it serves the console.
  # In split mode the api-server serves the console.
  # Egress goes to DNS, to the observability-gateway when enabled, and to the extras below.
  # See internal/insights/README.md "Network policy".
  networkPolicy:
    enabled: false
    # Egress extras. Provider ports beyond these need an entry here, or queries to
    # those providers time out. Each entry has no `to`, so it reaches any
    # destination on its ports. Add a `to` with namespace or pod selectors to narrow it.
    egress:
      - ports:
          - { protocol: TCP, port: 80 }
          - { protocol: TCP, port: 443 }
          - { protocol: TCP, port: 9090 }
          - { protocol: TCP, port: 3200 }

auth:
  # -- Enable authentication and authorization for the API server
  enabled: false

  ## HTTP Basic authentication
  ##
  basic:
    enabled: false
    username: ""
    # -- bcrypt hash of the password
    passwordHash: ""

  ## OpenID Connect authentication
  ##
  oidc:
    enabled: false
    issuerURL: ""
    clientID: ""
    # -- Deprecated and rejected when nonempty. Use existingSecretName/existingSecretKey.
    clientSecret: ""
    # -- Pull the OIDC client secret from a Kubernetes Secret. Leave both fields
    # empty for a public client; otherwise both fields must be set.
    existingSecretName: ""
    existingSecretKey: ""
    # -- OIDC callback URL used by the browser login flow.
    redirectURL: ""

  # -- Secret key for signing self-issued auth tokens (HMAC-SHA256).
  # Required for the basic auth login flow. Set via env var PAPRIKA_AUTH_TOKEN_SECRET
  # using apiServer.extraEnv (avoid putting secrets in values.yaml).
  # tokenSecret: ""

  ## RBAC authorization rules
  ## Subjects may be user names or "group:<group-name>".
  ## Actions: read, write, admin (or * for all).
  ## Resources: applications, pipelines, releases, stages, templates, artifacts, insights (or *).
  ## Insights is global: its RBAC rules must use namespaces: ["*"].
  ## Namespaces: specific namespace or * for all.
  ##
  rbac: []
  # - subjects: ["admin"]
  #   actions: ["*"]
  #   resources: ["*"]
  #   namespaces: ["*"]
  # - subjects: ["group:readers"]
  #   actions: ["read"]
  #   resources: ["applications"]
  #   namespaces: ["default"]

## MCP (Model Context Protocol) server: serves Paprika's fleet API to MCP
## clients (e.g. an LLM agent) over OAuth 2.1.
##
## Disabled by default. This is the only surface that lets a language model
## mutate fleet state, and the binary refuses to start it unless
## auth.enabled=true, a non-empty auth token secret, an OAuth client ID,
## at least one OAuth redirect URI, and mcp.publicURL are all set — the
## chart mirrors every one of those checks as a `helm template`-time `fail`
## so a broken configuration is caught before a CrashLoopBackOff, not after.
##
## Once those preconditions are met, writes are additionally gated by the
## paprika:write OAuth scope, and destructive operations require a
## two-phase confirmation bound to the exact tool arguments. See
## docs/superpowers/specs/2026-09-11-mcp-server-design.md for the full
## design.
##
## deploymentMode: split ONLY. MCP is wired solely into the split-mode
## api-server Deployment; deploymentMode: monolith has no MCP support yet
## and enabling mcp.enabled there fails the `helm template` render rather
## than silently doing nothing.
##
## The OAuth 2.1 + PKCE flow is functional end to end: /mcp/authorize
## authenticates the console user (Google OIDC or a Paprika self-signed
## token, never an MCP-audience token) and hands off through the /mcp/consent
## page, so the authorize/token circularity is closed. In-process tool calls
## re-enter the Connect chain on a freshly minted aud=paprika-api credential
## (Server.mintConsoleCredential), so the console authenticator strictly
## requires its own audience and an MCP token cannot be replayed against it.
mcp:
  enabled: false
  # -- Address advertised for the MCP server. Routes are mounted on the same
  # shared API mux as the rest of the API server, not a separate listener.
  bindAddress: ":8090"
  accessTokenTTL: "24h"
  refreshTokenTTL: "720h"
  oauth:
    # -- Retain public dynamic client IDs/redirect allowlists in chart-managed
    # ConfigMaps across pod replacement. This does not store OAuth tokens or
    # make the remaining in-memory authorization/refresh cache durable.
    persistClients: true
    # -- Store fleet MCP OAuth state and rotating refresh grants in a retained,
    # resource-bound Secret. Observe uses observabilityGateway.persistSessions.
    persistSessions: false
    # -- Statically registered OAuth client ID accepted by the MCP
    # authorization server. Required for the fleet when mcp.enabled=true;
    # the gateway permits both OAuth fields empty for dynamic registration only.
    clientId: ""
    # -- Exact-match allowlist of OAuth redirect URIs accepted by the MCP
    # authorization server. Required (non-empty) for the fleet when
    # mcp.enabled=true; the gateway requires both fields configured or both empty.
    redirectUris: []
  # -- Externally-reachable base URL of this API server, e.g.
  # "https://paprika.example.com". Embedded in RFC 9728/8414 discovery
  # metadata and used as the issuer of minted tokens, so it must be set
  # explicitly rather than silently defaulting to a loopback address.
  # Required (PAPRIKA_MCP_PUBLIC_URL) when mcp.enabled=true.
  publicURL: ""

## GitHub Actions OIDC token exchange for CI cluster access.
## When enabled, the API server exposes /auth/github-actions/token. The endpoint
## verifies GitHub's OIDC token claims before minting a short-lived Kubernetes
## service-account token for kubectl/Helm.
githubActionsTokenExchange:
  enabled: false
  audience: "paprika-vke-deploy"
  repository: ""
  environment: ""
  subject: ""
  # GitHub event_name claim values accepted by the exchange.
  allowedEventNames: []
  # Exact Git ref required for every caller.
  ref: ""
  # Exact caller workflow_ref claims accepted by the exchange.
  allowedWorkflowRefs: []
  # Exact reusable workflow job_workflow_ref required by the exchange.
  jobWorkflowRef: ""
  tokenTTL: "15m"
  serviceAccount:
    namespace: ""
    name: "github-actions-vke-deployer"

## RBAC configuration
##
rbac:
  ## RBAC resource scope
  ## - false (default): ClusterRole/ClusterRoleBinding (all namespaces)
  ## - true: Role/RoleBinding (release namespace only)
  ##
  namespaced: false

  ## Helper roles for CRD management (admin/editor/viewer)
  ##
  helpers:
    ## Install convenience admin/editor/viewer roles for CRDs
    ##
    enable: false

  ## Optional permissions for managing Actions Runner Controller resources.
  ## Roles are restricted to the listed ARC namespaces; PriorityClass changes
  ## are restricted to the configured names except creation (Kubernetes limitation).
  arc:
    enabled: false
    namespaces: []
    priorityClasses:
      - arc-spare

  ## Optional GKE ComputeClass permissions for ARC capacity management.
  ## CREATE is type-scoped; later reads and changes are restricted to these names.
  arcComputeClass:
    enabled: false
    resourceNames:
      - arc-ci-fast

## ServiceAccount configuration
##
serviceAccount:
  # Install default ServiceAccount provided
  enable: true

  ## Existing ServiceAccount name (only when enable=false)
  ## Note: When enable=true, respects nameOverride/fullnameOverride
  ##
  # name: ""

  ## Custom ServiceAccount annotations
  ##
  # annotations: {}

  ## Custom ServiceAccount labels
  ##
  # labels: {}

## Custom Resource Definitions
##
satellite:
  # observationStore moves satellite observations out of Cluster.status.
  # kubernetes (the default) keeps today's behaviour; redis writes them to a
  # shared store so a registration's application list is no longer rewritten
  # into the Cluster object on every report.
  observationStore:
    # -- Provider: kubernetes, memory or redis.
    provider: kubernetes
    redis:
      # -- host:port of the Redis used when provider=redis.
      addr: ""
      # -- Existing Secret holding the Redis password (optional).
      existingSecret: ""
      # -- Key inside that Secret.
      existingSecretKey: password
      # -- Redis database index.
      db: 0

  internalDispatch:
    # -- Enable the API server's internal listener and point the controller at
    # it. Required in split mode for releases that target a satellite-only
    # cluster: the links live in the API server pod, and without this the
    # controller cannot dispatch an apply through them. Ignored in monolith
    # mode, where the reconciler holds the hub directly.
    enabled: false
    # -- Port the internal listener binds inside the API server pod.
    port: 8082
    # -- Bind address inside the API server pod.
    bindAddress: ":8082"
    # -- Token file path, identical in both pods.
    tokenFile: /etc/paprika-satellite-internal/token
    # -- Directory the token Secret mounts at.
    mountPath: /etc/paprika-satellite-internal

crd:
  # Install CRDs with the chart
  enable: true
  # Keep CRDs when uninstalling
  keep: true

## Cluster capacity data providers.
##
## Capacity meters are served by a CapacityProvider (which implementation
## collects the numbers) bound to a scope by a DataProviderBinding (where it
## applies: Namespace > Cluster > Project > Global, most specific wins).
##
capacity:
  defaultProvider:
    # Ship a KubernetesCapacity provider bound at Global scope, so the console's
    # capacity board has real allocatable and requested figures on a default
    # install. It reads nodes and pods through each cluster's own API and needs
    # no configuration; `used` reports NOT_CONFIGURED until a usage provider
    # (MetricsServer or Prometheus) is bound alongside it.
    #
    # Requires the providers.paprika.io CRDs, which crd.enable installs. Set
    # this to false to manage capacity providers yourself; see
    # docs/guides/multi-cluster.md.
    enabled: true
  metricsServer:
    # Ship a MetricsServer provider bound at Global scope, completing the
    # `used` meter alongside KubernetesCapacity's requested/allocatable. On
    # clusters without the metrics.k8s.io aggregated API (metrics-server is
    # an optional add-on) the provider reports an honest NOT_AVAILABLE state
    # rather than failing — so enabling it is safe even where usage cannot
    # be read yet, and the meter completes itself if metrics-server is
    # installed later. Set to false to manage usage providers yourself.
    enabled: true

## Cluster inventory and provider enrichment.
##
## The self-registration Cluster CR is what makes the cluster board non-empty
## on a default install: stages with no cluster ref deploy to the cluster
## Paprika runs in, and this object is how that cluster enters the fleet
## index. The cluster controller health-checks it with the pod's own service
## account and fills status.inventory (node/pod counts, regions, zones,
## kubelet versions) from the Kubernetes API.
##
cluster:
  self:
    # Ship a mode: in-cluster Cluster so applications with no explicit cluster
    # ref resolve to it. Set to false to manage the registration yourself.
    enabled: true
    # Label shown on the cluster card; defaults to "In-cluster".
    displayName: ""
    # Cloud-provider enrichment. type: auto detects the provider from node
    # providerID prefixes and reports node-label-derived pools with no
    # credential at all. Set the provider's identity fields plus a
    # credentialsSecretRef (Vultr API key, GCP WIF/SA JSON, AWS static keys,
    # Azure SP JSON) for full enrichment — autoscaler bounds, plan names, the
    # managed-cluster ID. eks/gke/aks also accept ambient identity
    # (IRSA/GKE WI/Azure WI) with no secret at all.
    provider:
      type: auto
      clusterId: ""
      region: ""
      project: ""
      subscriptionId: ""
      credentialsSecretRef: {}
      # credentialsSecretRef: {name: vultr-api-key, namespace: "", key: credentials}

## Controller metrics endpoint.
## Enable to expose /metrics endpoint
##
metrics:
  enable: true
  # Metrics server port
  port: 8443
  # Enable secure metrics: HTTPS with certs/auth (true) or HTTP (false).
  # Note: Metrics authn/authz needs ClusterRole access.
  secure: true
  # Metrics bind address for split-plane deployments.
  # Set to ":8080" to enable on HTTP, or ":0" to disable.
  # The webhook receiver uses dedicated port :8082 when this is enabled because :8080 serves webhooks.
  bindAddress: ":0"
  # Prometheus ServiceMonitor configuration
  serviceMonitor:
    enabled: false
    labels: {}
    # Scrape interval (e.g. "30s")
    interval: ""
    # Scrape timeout (e.g. "10s")
    scrapeTimeout: ""

## Cert-manager integration for TLS certificates.
## Required for webhook certificates and metrics endpoint certificates.
##
certManager:
  enable: false

## Prometheus ServiceMonitor for metrics scraping.
## Requires prometheus-operator to be installed in the cluster.
##
prometheus:
  enable: false

  rules:
    enabled: false

grafana:
  dashboards:
    enabled: false
    ## Labels used by Grafana sidecar to discover dashboards.
    ##
    labelSelectors:
      grafana_dashboard: "1"
    ## Key prefix for ConfigMap data keys (sidecar-specific). Some sidecars
    ## require a specific prefix (e.g. "test-" or "data/") to detect JSON content.
    ##
    # configMapKeyPrefix: ""

## OpenTelemetry configuration
## Ref: https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/
otel:
  enabled: false
  # OTLP endpoint (e.g., "otel-collector.observability.svc:4317" for gRPC, ":4318" for HTTP)
  endpoint: ""
  # Exporter protocol: "grpc" or "http"
  protocol: "grpc"
  # Disable TLS (use plaintext)
  insecure: true
  # Path to CA certificate for TLS verification
  certificatePath: ""
  # Additional headers (e.g., for auth)
  headers: {}
  # Sampler: always_on, always_off, traceidratio, parentbased_traceidratio
  sampler: "always_on"
  # Sampler argument (ratio for traceidratio/parentbased, 0.0-1.0)
  samplerArg: ""
  # Propagators (comma-separated): tracecontext,baggage
  propagators: "tracecontext,baggage"
  # Resource attributes (key-value pairs)
  resourceAttributes: {}

## Redis cache configuration.
## When enabled, components use Redis for rendered manifest and source caching.
##
redis:
  enabled: false
  addr: "redis:6379"
  password: ""
  db: 0

## Audit logging. When enabled, the API server records structured JSON audit
## events for mutating operations to stdout.
audit:
  enabled: true

## Disaster recovery via Velero. When enabled, renders a Velero Schedule that backs up the
## Paprika control-plane state (CRDs in the release namespace) on a cron schedule.
## Velero must already be installed in the cluster (https://velero.io/docs/) with a
## BackupStorageLocation; the Schedule is created in the Velero namespace.
##
velero:
  enabled: false
  ## Namespace where Velero is installed. Schedules must live here for Velero to reconcile them.
  namespace: velero
  ## Name of an existing Velero BackupStorageLocation to send backups to.
  storageLocation: default
  ## Cron schedule for backups. Default: every 6 hours.
  schedule: "0 */6 * * *"
  ## How long Velero retains each backup. Default: 30 days.
  ttl: "720h"
  ## Extra namespaces to include in the backup (e.g. namespaces where your Applications live).
  ## The Paprika release namespace is always included, and cluster-scoped CRDs are backed up
  ## so the custom resource definitions are restored before their instances.
  includeNamespaces: []

## External secrets management.
## Integrates with external-secrets operator (https://external-secrets.io) to
## pull secrets from external providers (AWS Secrets Manager, GCP Secret Manager,
## HashiCorp Vault, Azure Key Vault, etc.) instead of storing them in the cluster.
## Requires the external-secrets operator to be installed.
##
externalSecrets:
  enabled: false

  ## Refresh interval for the ExternalSecret.
  refreshInterval: "1h"

  ## SecretStore to use. Either a ClusterSecretStore name or a namespaced SecretStore.
  ## If storeRef.kind is not set, defaults to ClusterSecretStore.
  storeRef:
    name: ""
    # kind: ClusterSecretStore

  ## Secrets to manage via external-secrets. Each entry creates an ExternalSecret.
  ## The resulting Secret is referenced by the component's existingSecretName fields.
  ##
  secrets:
    ## Webhook secret pulled from external provider.
    ## The resulting secret name is referenced via webhookReceiver.secret.existingSecretName.
    ##
    # - name: paprika-webhook-secret
    #   remoteRef:
    #     key: paprika/prod/webhook-secret
    #     property: secret
    #   targetKey: secret

    ## OIDC client secret pulled from external provider.
    ## The resulting secret name is referenced via auth.oidc.existingSecretName.
    ##
    # - name: paprika-oidc-secret
    #   remoteRef:
    #     key: paprika/prod/oidc-client-secret
    #     property: client-secret

## Helm lifecycle hooks. Hooks run as Jobs before/after install, upgrade, or delete.
##
hooks:
  ## Pre-delete hook that cleans up all CRD instances before uninstall.
  ## Prevents finalizer blocks and orphaned resources when the operator is removed.
  preDeleteCleanup:
    enabled: false
    image:
      repository: docker.io/alpine/k8s
      tag: "1.32.0"
      pullPolicy: IfNotPresent
    # priorityClassName: ""

  crdCheck:
    ## Pre-upgrade hook that validates CRD storage versions and existing resources
    ## before the operator is upgraded. Requires ClusterRole permissions.
    enabled: true
    image:
      repository: docker.io/alpine/k8s
      tag: "1.32.0"
      pullPolicy: IfNotPresent
    ## Priority class for the hook pod (defaults to .priorityClassName)
    # priorityClassName: ""

## Mutual TLS for inter-service communication (split-plane mode).
## When enabled, renders cert-manager Certificates for each component's
## serving TLS + a CA Certificate. Components mount the certs and serve TLS.
## Requires cert-manager to be installed.
mtls:
  enabled: false
  # cert-manager Issuer to use for the mTLS CA (self-signed if empty).
  caIssuer: ""
