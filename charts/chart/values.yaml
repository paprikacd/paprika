    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

  ## Deployment strategy
  ##
  # strategy:
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxSurge: 25%
  #     maxUnavailable: 25%

  extraEnv: []

  extraEnvFrom: []

  # priorityClassName: ""

  ## Init containers (run before the main container)
  ##
  # initContainers:
  #   - name: init-deps
  #     image: busybox:1.36
  #     command: ['sh', '-c', 'until nc -z redis 6379; do sleep 1; done']

  ## Node selector (pins pods to specific node pools)
  ##
  nodeSelector: {}

  ## Pod affinity / anti-affinity (recommended for HA)
  ##
  affinity: {}

  ## Pod tolerations (tolerate spot/preemptible nodes)
  ##
  tolerations: []

  ## Topology spread constraints (spread across zones)
  ##
  # topologySpreadConstraints: []

  ## Termination grace period (seconds). Defaults to 30 if unset.
  ##
  # terminationGracePeriodSeconds: 20

  ## Startup probe configures the kubelet startup check.
  ## Disabled by default — configure if startup takes > 15s.
  # startupProbe:
  #   initialDelaySeconds: 10
  #   periodSeconds: 10
  #   failureThreshold: 6

  extraVolumes:
    - emptyDir: {}
      name: tmp

  extraVolumeMounts:
    - mountPath: /tmp
      name: tmp

  service:
    type: ClusterIP
    port: 8080
    ## Service annotations (e.g., for AWS NLB, service mesh)
    ##
    # annotations:
    #   service.beta.kubernetes.io/aws-load-balancer-type: "nlb"

  ingress:
    enabled: false
    # -- Ingress type: "gateway-api" or "ingress"
    type: gateway-api
    annotations: {}
    gateway:
      # gatewayRef:
      #   name: paprika
      #   namespace: envoy-gateway-system
      # hostname: paprika.example.com
      path: /webhook
    ingress:
      # className: nginx
      # hostname: paprika.example.com
      path: /webhook
      annotations: {}
      # tls:
      #   - secretName: paprika-webhook-tls
      #     hosts:
      #       - paprika.example.com

  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 75

  vpa:
    enabled: false
