## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
# fullnameOverride: ""

## Common labels added to all resources. Useful for cost-centre, environment, team, etc.
##
# commonLabels:
#   environment: production
#   team: platform

## Number of old ReplicaSets to retain. Defaults to 10 if unset.
##
# revisionHistoryLimit: 5

## Pod priority class name for all components. Override per-component below.
##
# priorityClassName: production-high

## NetworkPolicy configuration.
## The global switch renders each component's policy: agent, api-server,
## controller-manager, observability-gateway and repo-server always; webhook-receiver
## in split mode when webhookReceiver.enabled (the default); insights when
## insights.enabled is true. Insights can also be isolated alone with
## insights.networkPolicy.enabled (see internal/insights/README.md "Network policy").
##
networkPolicy:
  enabled: false

## Webhook configuration.
##
webhook:
  # Enable Kubernetes admission webhooks. This requires serving certificates,
  # normally by setting certManager.enable=true in clusters with cert-manager.
  enabled: false
  port: 8080
  # Admission failure policy for Paprika webhooks. Use Ignore on managed
  # control planes that cannot reliably reach in-cluster webhook services.
  failurePolicy: Fail
  timeoutSeconds: 10
  service:
    ## Service annotations (e.g., for AWS NLB, service mesh)
    ##
    annotations: {}

## Configure the controller manager deployment
##
manager:
  ## Set to false to skip manager installation
  ##
  enabled: true

  replicas: 1

  ## The controller-manager needs in-cluster credentials to watch and
  ## reconcile Paprika resources. Keep this enabled unless you provide
  ## credentials through another mechanism.
  ##
  automountServiceAccountToken: true

  image:
    repository: controller
    ## Image tag (defaults to Chart.appVersion if not set)
    ##
    # tag: ""
    pullPolicy: IfNotPresent

  ## Reconcile-rate tuning (rendered as args in both operator and api modes).
  ## Empty fields fall back to the binary defaults; set only what you need to
  ## tune. Per-application steady-state polling stays on
  ## spec.source.pollInterval — these values control the fallback and the
  ## in-flight/work-queue behavior.
  ##
  reconcile:
    ## Requeue interval for in-flight Application states (pending, building,
    ## releasing) and the steady-state poll fallback when
    ## spec.source.pollInterval is unset.
    ##
    transientRequeue: ""
    ## How long a source resolve (git fetch) result is reused by the
    ## steady-state application poll. "0s" resolves on every poll; sync
    ## triggers always bypass the cache.
    ##
    sourceResolveTTL: ""
    ## Upper bound on each repo-server call the Application controller makes
    ## (binary default 1m). A timed-out call is retried on a later reconcile,
    ## never repeated with a local clone. Release rendering keeps
    ## repoServer.clientTimeout.
    ##
    repoServerTimeout: ""
    ## Full resync period for the manager's informer cache.
    ##
    cacheResyncPeriod: ""
    ## Parallel reconcile workers per controller.
    ##
    maxConcurrentReconciles:
      application: 0
      release: 0
      stage: 0
      pipeline: 0
    ## Reconcile token-bucket limits. globalRate <= 0 disables reconcile rate
    ## limiting entirely.
    ##
    rateLimit:
      # globalRate renders even at 0 (disables limiting) — only null/absent
      # leaves the flag off the command line.
      globalRate: null
      globalBurst: 0
      appRate: 0
      appBurst: 0

  ## Arguments (added in both operator and api modes)
  ##
  ## In split mode, --flag=value entries that name --ui-bind-address or
  ## --inline-webhook-bind-address are dropped, and the two-item form (the bare flag
  ## followed by a value) fails to render. The split-mode manager runs with both
  ## listeners off.
  args:
    - --ui-bind-address=:3000

  ## Per-component ingress policy for the controller-manager pods. Off by default.
  ## When on, the policy admits only:
  ##   - the health probe port (8081), from any source; the policy does not restrict probes,
  ##     because a NetworkPolicy does not reliably match kubelet traffic from the pod's node;
  ##   - the admission webhook port (9443) when webhook.enabled, from any source,
  ##     because the kube-apiserver calls it;
  ##   - the metrics port (metrics.port) when metrics.enable, from any source;
  ##   - in monolith mode only, the console (3000) and inline webhook (8080) ports
  ##     from the release namespace.
  ## The policy restricts ingress only. Egress stays with the global networkPolicy
  ## template.
  networkPolicy:
    enabled: false

  ## Image pull secrets
  ##
  # imagePullSecrets:
  #   - name: myregistrykey

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  ## Resource limits and requests. The controller-manager runs ~15 informers
  ## (CRDs + core Pods/ReplicaSets) so it needs at least 512Mi memory and a
  ## generous CPU share. On large or slow clusters raise memory to 1Gi.
  ##
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi

  ## Manager pod's affinity
  ##
  affinity: {}

  ## Manager pod's node selector
  ##
  nodeSelector: {}

  ## Manager pod's tolerations
  ##
  tolerations: []

  ## Deployment strategy
  ##
  # strategy:
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxSurge: 25%
  #     maxUnavailable: 25%

  ## Priority class name (overrides global .priorityClassName)
  ##
  # priorityClassName: ""

  ## Topology spread constraints
  ##
  # topologySpreadConstraints: []

  ## Service configuration (used for monolith / api-mode API service)
  ##
  service:
    type: ClusterIP
    ## Service annotations (e.g., for AWS NLB, service mesh)
    ##
    # annotations:
    #   service.beta.kubernetes.io/aws-load-balancer-type: "nlb"

  ## Termination grace period seconds
  ##
  terminationGracePeriodSeconds: 10

  ## Custom Deployment labels
  ##
  # labels: {}

  ## Custom Deployment annotations
  ##
  # annotations: {}

  ## Custom Pod labels and annotations
  ##
  # pod:
  #   labels: {}
  #   annotations: {}

  ## Extra environment variables (value literals)
  ##
  # extraEnv:
  #   - name: MY_VAR
  #     value: my-value

  ## Extra environment variables (from ConfigMap/Secret refs)
  ##
  # extraEnvFrom:
  #   - configMapRef:
  #       name: my-config
  #   - secretRef:
  #       name: my-secret

  ## Extra volumes and volume mounts
  ##
  extraVolumes:
    - emptyDir: {}
      name: tmp

  extraVolumeMounts:
    - mountPath: /tmp
      name: tmp

  # -- Enable controller sharding. When true, manager is deployed as a StatefulSet
  # with per-pod PAPRIKA_SHARD_ID/PAPRIKA_SHARD_TOTAL env vars.
  sharding:
    enabled: false
    replicas: 3
    serviceName: controller-manager-headless

  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 75

  vpa:
    enabled: false
    mode: "Off"

  pdb:
    enabled: false
    minAvailable: 1

## Namespace configuration. Use with caution — the namespace is kept on uninstall
## to avoid data loss. Set Pod Security Admission labels via .labels.
##
namespace:
  create: false
  labels:
    # pod-security.kubernetes.io/enforce: restricted
    # pod-security.kubernetes.io/audit: restricted
    # pod-security.kubernetes.io/warn: restricted
  annotations: {}

# -- Deployment architecture: "monolith" (single pod with everything)
# or "split" (separate controller-manager, api-server, webhook-receiver pods)
deploymentMode: monolith

# -- Deployment mode for the manager container: "operator" (controllers + API + webhook)
# In split mode this is automatically set to "operator" for the controller-manager pod.
# In monolith mode this controls the single pod behavior.
mode: operator

## API server configuration (used only when deploymentMode=split)
##
apiServer:
  enabled: true
  replicas: 2

  # Restrict the standalone API and observability gateway to one namespace.
  # Empty preserves cluster-wide reads. Pair with namespace-restricted service
  # accounts; this does not scope the controller-manager or typed clients.
  namespaceScope: ""

  # Most open StreamResourceLogs calls (follow or not) one caller subject may hold at
  # once, per process. Each Basic-auth caller with the same username shares one
  # count, so raise this for a shared login used by many people. Must be a positive
  # integer.
  # Applies to the api-server in deploymentMode: split, and to the manager in
  # deploymentMode: monolith, where the manager serves the API. That includes the
  # sharded StatefulSet (manager.sharding.enabled), which serves the API too.
  # Unset (null) renders no flag, so the binary default of 8 applies. Set a value
  # only with an image that knows --api-log-stream-limit.
  logStreamLimit: null

  image:
    repository: controller
    ## Image tag (defaults to Chart.appVersion if not set)
    ##
    # tag: ""
    pullPolicy: IfNotPresent

  args:
    - --ui-bind-address=:3000

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  resources:
    limits:
      cpu: 1000m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  ## Deployment strategy
  ##
  # strategy:
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxSurge: 25%
  #     maxUnavailable: 25%

  extraEnv: []

  extraEnvFrom: []

  # priorityClassName: ""

  extraVolumes:
    - emptyDir: {}
      name: tmp

  extraVolumeMounts:
    - mountPath: /tmp
      name: tmp

  ## Image pull secrets
  ##
  # imagePullSecrets:
  #   - name: myregistrykey

  ## Node selector (pins pods to specific node pools)
  ##
  nodeSelector: {}

  ## Pod affinity / anti-affinity (recommended for HA)
  ##
  affinity: {}

  ## Pod tolerations (tolerate spot/preemptible nodes)
  ##
  tolerations: []

  ## Topology spread constraints (spread across zones)
  ##
  # topologySpreadConstraints: []

  ## Termination grace period (seconds). Defaults to 30 if unset.
  ##
  # terminationGracePeriodSeconds: 20

  ## Startup probe configures the kubelet startup check.
  ## Disabled by default — configure if startup takes > 15s.
  # startupProbe:
  #   initialDelaySeconds: 10
  #   periodSeconds: 10
  #   failureThreshold: 6

  service:
    type: ClusterIP
    port: 3000
    ## Service annotations (e.g., for AWS NLB, service mesh)
    ##
    # annotations:
    #   service.beta.kubernetes.io/aws-load-balancer-type: "nlb"

  ## Ingress / Gateway API for the API server (external access to UI + API).
  ## Supports two modes:
  ##   "ingress"    - standard networking.k8s.io/v1 Ingress (works with nginx, contour, etc.)
  ##   "gateway-api" - Gateway API HTTPRoute (works with Envoy Gateway, Istio, etc.)
  ##
  ingress:
    enabled: false
    ## Gateway API request timeout for the /api/insights/ prefix (gateway-api
    ## only). The Insights proxy ends a UI query at 28 s, so this must stay above
    ## 28 s, or the edge cuts a query before the console returns its partial
    ## answer. The "/" rule sets no explicit timeout, so Envoy Gateway's 15 s
    ## default applies to it.
    ## Must be a single-unit Go duration between 29s and 119s (Cloudflare's
    ## 125 s default proxy read timeout is the outer bound). Chart-validated.
    insightsRequestTimeout: "35s"
    ## Gateway API request timeout for the follow-mode log stream only
    ## (gateway-api only): PaprikaService/StreamResourceLogs (Exact match).
    ## "0s" (the default) disables the request timeout and, in Envoy Gateway v1.4,
    ## also the route's idle timeout, so nothing at Envoy ends a silent or
    ## abandoned follow. A non-zero value ends every follow at that age, whether or
    ## not it is active; the UI then reconnects and re-reads the whole pod log (no
    ## TailLines or SinceSeconds on PodLogOptions), and the panel replaces its
    ## buffer with the replay.
    ## Must be "0s" or a single-unit Go duration of at least 120s, at most 5 digits.
    ## This value does not affect the SatelliteLink stream, which keeps Envoy
    ## Gateway's 15 s default on "/" (see the template comment). Cloudflare's 125 s
    ## proxy read timeout (between reads) still returns 524 when the origin is
    ## silent for that long. Chart-validated.
    ## Independent of this value, a follow re-authenticates its caller and re-reads
    ## its application every 5 minutes. An expired token, a removed role, or a moved,
    ## deleted or recreated application ends the follow within that interval.
    logStreamRequestTimeout: "0s"
    ## Type of ingress resource: "ingress" or "gateway-api"
    ##
    # type: ingress
    # className: nginx
    # hosts:
    #   - host: paprika.example.com
    #     paths:
    #       - path: /
    #         pathType: Prefix
    # tls:
    #   - hosts:
    #       - paprika.example.com
    #     secretName: paprika-tls
    # annotations: {}

    ## Gateway API configuration (used when type is "gateway-api").
    ## The GatewayClass and Gateway are expected to exist already (infra-level resources).
    ## This chart only creates the application-level HTTPRoute.
    ##
    # gateway:
    #   gatewayRef:
    #     name: paprika
    #     namespace: envoy-gateway-system
    #   hostname: paprika.example.com

  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 75

  vpa:
    enabled: false
    mode: "Off"

  pdb:
    enabled: false
    minAvailable: 1

## Webhook receiver configuration (used only when deploymentMode=split)
