webhookReceiver:
  enabled: true
  replicas: 2

  image:
    repository: controller
    ## Image tag (defaults to Chart.appVersion if not set)
    ##
    # tag: ""
    pullPolicy: IfNotPresent

  ## Image pull secrets
  ##
  # imagePullSecrets:
  #   - name: myregistrykey

  ## Configurable args (overrides)
  ##
  # args: []

  podSecurityContext:
    runAsNonRoot: true
