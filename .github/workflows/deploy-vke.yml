name: Deploy VKE

on:
  workflow_call:
    inputs:
      image_ref:
        description: 'Published Paprika image digest reference'
        required: true
        type: string
    secrets:
      VKE_AUTH_TOKEN_SECRET:
        required: true
      VKE_BASIC_PASSWORD_HASH:
        required: true
      VKE_OIDC_CLIENT_ID:
        required: true
      VKE_OIDC_CLIENT_SECRET:
        required: true

concurrency: deploy-vke

permissions:
  contents: read
  id-token: write

env:
  VKE_NAMESPACE: paprika-e2e
  HELM_RELEASE: paprika-e2e
  HELM_CHART: charts/chart
  TEST_VALUES: deploy/test-values.yaml

jobs:
  deploy:
    name: Deploy and validate on VKE
    if: (github.event_name == 'push' || github.event_name == 'repository_dispatch') && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: vke-production
    env:
      IMAGE_REFERENCE: ${{ inputs.image_ref }}
    steps:
      - name: Clone the code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Validate image reference
        run: |
          if [[ ! "${IMAGE_REFERENCE}" =~ ^ghcr\.io/paprikacd/paprika@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::image_ref must be ghcr.io/paprikacd/paprika@sha256 followed by exactly 64 lowercase hexadecimal characters"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Setup Helm
        uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42 # v5
        with:
          version: v3.21.2

      - name: Configure Kubernetes OIDC access
        env:
          VKE_CLUSTER_ENDPOINT: ${{ vars.VKE_CLUSTER_ENDPOINT }}
          VKE_CLUSTER_CA_B64: ${{ vars.VKE_CLUSTER_CA_B64 }}
          VKE_K8S_OIDC_AUDIENCE: ${{ vars.VKE_K8S_OIDC_AUDIENCE || 'paprika-vke-deploy' }}
          VKE_TOKEN_EXCHANGE_URL: ${{ vars.VKE_TOKEN_EXCHANGE_URL || 'https://paprika.benebsworth.com/auth/github-actions/token' }}
        run: |
          missing=0
          for name in VKE_CLUSTER_ENDPOINT VKE_CLUSTER_CA_B64 VKE_K8S_OIDC_AUDIENCE VKE_TOKEN_EXCHANGE_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          install -d -m 700 "$HOME/.kube"
          printf '%s' "$VKE_CLUSTER_CA_B64" | base64 -d > "$HOME/.kube/vke-ca.crt"
          chmod 600 "$HOME/.kube/vke-ca.crt"

          kubectl config set-cluster vke \
            --server="https://${VKE_CLUSTER_ENDPOINT}:6443" \
            --certificate-authority="$HOME/.kube/vke-ca.crt" \
            --embed-certs=true
          kubectl config set-credentials github-actions-oidc \
            --exec-command="$GITHUB_WORKSPACE/hack/github-actions-vke-token.sh" \
            --exec-api-version=client.authentication.k8s.io/v1 \
            --exec-interactive-mode=Never \
            --exec-env=GITHUB_ACTIONS_OIDC_AUDIENCE="$VKE_K8S_OIDC_AUDIENCE" \
            --exec-env=GITHUB_ACTIONS_TOKEN_EXCHANGE_URL="$VKE_TOKEN_EXCHANGE_URL"
          kubectl config set-context vke \
            --cluster=vke \
            --user=github-actions-oidc \
            --namespace="${VKE_NAMESPACE}"
          kubectl config use-context vke

      - name: Show GitHub OIDC claims
        env:
          GITHUB_ACTIONS_OIDC_AUDIENCE: ${{ vars.VKE_K8S_OIDC_AUDIENCE || 'paprika-vke-deploy' }}
        run: |
          credential="$(hack/github-actions-oidc-token.sh)"
          token="$(jq -r '.status.token' <<< "$credential")"
          payload="$(cut -d. -f2 <<< "$token")"
          case $((${#payload} % 4)) in
            0) ;;
            2) payload="${payload}==" ;;
            3) payload="${payload}=" ;;
            *)
              echo "::error::invalid OIDC payload encoding"
              exit 1
              ;;
          esac
          decoded="$(printf '%s' "$payload" | tr '_-' '/+' | base64 -d)"
          printf '%s' "$decoded" | jq '{
            iss,
            aud,
            sub,
            repository,
            repository_id,
            repository_owner,
            environment,
            event_name,
            ref,
            workflow,
            workflow_ref,
            job_workflow_ref
          }'

      - name: Verify cluster access
        run: |
          kubectl get nodes
          kubectl get namespace "${VKE_NAMESPACE}"

      - name: Deploy Paprika chart
        env:
          VKE_OIDC_CLIENT_ID: ${{ secrets.VKE_OIDC_CLIENT_ID }}
          VKE_OIDC_CLIENT_SECRET: ${{ secrets.VKE_OIDC_CLIENT_SECRET }}
          VKE_AUTH_TOKEN_SECRET: ${{ secrets.VKE_AUTH_TOKEN_SECRET }}
          VKE_BASIC_PASSWORD_HASH: ${{ secrets.VKE_BASIC_PASSWORD_HASH }}
        run: |
          missing=0
          for name in VKE_OIDC_CLIENT_ID VKE_OIDC_CLIENT_SECRET VKE_AUTH_TOKEN_SECRET VKE_BASIC_PASSWORD_HASH; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          oidc_secret_result="$(
            kubectl -n "${VKE_NAMESPACE}" create secret generic paprika-oidc \
              --from-literal=client-secret="${VKE_OIDC_CLIENT_SECRET}" \
              --dry-run=client -o yaml | kubectl apply -f -
          )"
          case "${oidc_secret_result}" in
            "secret/paprika-oidc created"|"secret/paprika-oidc configured") ;;
            *)
              echo "::error::failed to create or configure the paprika-oidc Secret"
              exit 1
              ;;
          esac

          helm upgrade --install "${HELM_RELEASE}" "${HELM_CHART}" \
            --namespace "${VKE_NAMESPACE}" \
            --values "${TEST_VALUES}" \
            --set-string manager.image.repository="${IMAGE_REFERENCE}" \
            --set-string apiServer.image.repository="${IMAGE_REFERENCE}" \
            --set-string repoServer.image.repository="${IMAGE_REFERENCE}" \
            --set-string webhookReceiver.image.repository="${IMAGE_REFERENCE}" \
            --set-string auth.oidc.clientID="${VKE_OIDC_CLIENT_ID}" \
            --set-string auth.oidc.existingSecretName=paprika-oidc \
            --set-string auth.oidc.existingSecretKey=client-secret \
            --set-string auth.tokenSecret="${VKE_AUTH_TOKEN_SECRET}" \
            --set-string auth.basic.passwordHash="${VKE_BASIC_PASSWORD_HASH}" \
            --wait \
            --timeout 5m \
            --create-namespace

      - name: Verify Helm release
        run: |
          helm status "${HELM_RELEASE}" --namespace "${VKE_NAMESPACE}"

      - name: Wait for all pods ready
        run: |
          echo "Waiting for all Paprika pods to be ready..."
          kubectl wait --for=condition=Ready pods \
            -l app.kubernetes.io/instance="${HELM_RELEASE}" \
            -n "${VKE_NAMESPACE}" \
            --timeout=180s

      - name: Show pod status
        run: |
          kubectl get pods -n "${VKE_NAMESPACE}" -o wide

      - name: Check pod conditions
        run: bash hack/check-vke-pod-conditions.sh

      - name: Health check via port-forward
        run: |
          kubectl port-forward -n "${VKE_NAMESPACE}" \
            "svc/${HELM_RELEASE}-api-server" 3000:3000 &
          PF_PID=$!
          trap 'kill "$PF_PID" 2>/dev/null || true' EXIT
          sleep 5

          PASS=0
          FAIL=0

          check() {
            local desc="$1" url="$2" expected="${3:-200}"
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url" 2>/dev/null || echo "FAIL")
            if [ "$code" = "$expected" ]; then
              echo "  PASS  $desc ($url → $expected)"
              PASS=$((PASS + 1))
            else
              echo "  FAIL  $desc ($url → $code, expected $expected)"
              FAIL=$((FAIL + 1))
            fi
          }

          check "Health endpoint" "http://localhost:3000/healthz" 200
          check "Readiness endpoint" "http://localhost:3000/readyz" 200

          UI_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "http://localhost:3000/" 2>/dev/null || echo "FAIL")
          if [ "$UI_CODE" = "200" ]; then
            CTYPE=$(curl -s -o /dev/null -w "%{content_type}" --max-time 5 "http://localhost:3000/" 2>/dev/null || echo "")
            if echo "$CTYPE" | grep -qi "html"; then
              echo "  PASS  UI serves HTML at /"
              PASS=$((PASS + 1))
            else
              echo "  FAIL  UI at / returned non-HTML content-type: $CTYPE"
              FAIL=$((FAIL + 1))
            fi
          else
            echo "  FAIL  UI at / (HTTP $UI_CODE)"
            FAIL=$((FAIL + 1))
          fi

          check "Metrics endpoint" "http://localhost:3000/metrics" 200

          kill "$PF_PID" 2>/dev/null || true
          trap - EXIT

          echo ""
          echo "Health check results: $PASS passed, $FAIL failed"
          if [ "$FAIL" -gt 0 ]; then
            exit 1
          fi

      - name: Deployment Summary
        run: |
          {
            echo "## VKE Deployment Summary"
            echo ""
            echo "- **Release**: ${HELM_RELEASE}"
            echo "- **Namespace**: ${VKE_NAMESPACE}"
            echo "- **Image**: ${IMAGE_REFERENCE}"
            echo "- **Status**: ✅ Deployed and healthy"
          } >> "$GITHUB_STEP_SUMMARY"
