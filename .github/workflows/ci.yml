name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Portable jobs run on a Cuttlefish self-hosted runner when the repository
# variable CUTTLEFISH_RUNS_ON holds a JSON runs-on value (for example
# ["self-hosted","cuttlefish"]); unset, they stay on ubuntu-latest. Fork pull
# requests always use GitHub-hosted runners. Jobs that need linux/amd64,
# kind or registry/cluster credentials stay hosted. See
# docs/guides/cuttlefish-ci.md.
jobs:
  go-test:
    name: Go race tests
    runs-on: ${{ fromJSON(!github.event.pull_request.head.repo.fork && vars.CUTTLEFISH_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reclaim self-hosted runner disk
        uses: ./.github/actions/reclaim-runner-disk

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Run race tests
        run: make test-race

      - name: Test deployment helpers
        run: |
          bash hack/test-check-vke-pod-conditions.sh
          bash hack/test-github-actions-oidc-token.sh
          bash hack/test-github-actions-vke-token.sh

  go-lint:
    name: Go lint
    runs-on: ${{ fromJSON(!github.event.pull_request.head.repo.fork && vars.CUTTLEFISH_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reclaim self-hosted runner disk
        uses: ./.github/actions/reclaim-runner-disk

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Verify linter configuration
        run: make lint-config

      - name: Run linter
        run: make lint

  ui:
    name: UI
    runs-on: ${{ fromJSON(!github.event.pull_request.head.repo.fork && vars.CUTTLEFISH_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reclaim self-hosted runner disk
        uses: ./.github/actions/reclaim-runner-disk

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ui

      - name: Test
        run: npm test
        working-directory: ui

      - name: Lint
        run: npm run lint
        working-directory: ui

      - name: Build
        run: npm run build
        working-directory: ui

  mcp-console:
    name: MCP console and plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: internal/api/mcp/ui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: internal/api/mcp/ui

      - name: Check types
        run: npm run check
        working-directory: internal/api/mcp/ui

      - name: Test console and plugin contracts
        run: npm test
        working-directory: internal/api/mcp/ui

      - name: Build embedded console
        run: npm run build
        working-directory: internal/api/mcp/ui

      - name: Check committed console bundle
        run: git diff --exit-code -- internal/api/mcp/ui/dist/console.html

  generated:
    name: Generated code drift
    runs-on: ${{ fromJSON(!github.event.pull_request.head.repo.fork && vars.CUTTLEFISH_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reclaim self-hosted runner disk
        uses: ./.github/actions/reclaim-runner-disk

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: ui/package-lock.json

      - name: Install UI protobuf plugins
        run: npm ci
        working-directory: ui

      - name: Install Go protobuf plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0

      - name: Verify protobuf generators
        run: |
          command -v protoc-gen-go
          command -v protoc-gen-connect-go
          command -v ui/node_modules/.bin/protoc-gen-es
          command -v ui/node_modules/.bin/protoc-gen-connect-es

      - name: Remove committed generated outputs
        run: rm -rf -- internal/api/paprika ui/src/gen

      - name: Regenerate protobuf clients
        run: make generate-proto

      - name: Check generated code
        run: |
          git diff --exit-code
          git status --porcelain --untracked-files=all
          test -z "$(git status --porcelain --untracked-files=all)"

  chart:
    name: Helm chart
    runs-on: ${{ fromJSON(!github.event.pull_request.head.repo.fork && vars.CUTTLEFISH_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reclaim self-hosted runner disk
        uses: ./.github/actions/reclaim-runner-disk

      - name: Set up Helm
        uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42 # v5
        with:
          version: v3.21.2

      - name: Verify OIDC Secret rendering
        run: bash hack/test-oidc-secret-rendering.sh

      - name: Verify OIDC deployment migration
        run: bash hack/test-oidc-deployment-migration.sh

      - name: Verify release chart comparison
        run: bash hack/compare-helm-chart.sh --self-test

      - name: Verify satellite chart credential and RBAC boundaries
        run: bash hack/test-satellite-chart-rendering.sh

      - name: Verify observability gateway boundaries
        run: |
          bash hack/test-observability-chart-rendering.sh
          bash hack/test-observability-addon-rendering.sh

      - name: Lint chart
        run: helm lint charts/chart/

      - name: Render chart
        run: helm template paprika charts/chart/

      - name: Render VKE configuration
        run: helm template paprika charts/chart/ --values deploy/test-values.yaml

      - name: Reject OIDC without clientID
        # Regression guard: an empty client ID used to render
        # --auth-oidc-client-id= and crash-loop the api-server at startup.
        run: |
          if helm template paprika charts/chart/ \
            --set auth.oidc.enabled=true --set auth.oidc.clientID= \
            2> "${RUNNER_TEMP}/oidc-render-err.txt"; then
            echo "expected render failure for oidc.enabled without clientID" >&2
            exit 1
          fi
          grep -q "auth.oidc.clientID is required" "${RUNNER_TEMP}/oidc-render-err.txt"

  release-contract:
    name: CLI release contract
    runs-on: ${{ fromJSON(!github.event.pull_request.head.repo.fork && vars.CUTTLEFISH_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reclaim self-hosted runner disk
        uses: ./.github/actions/reclaim-runner-disk

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          install-only: true
          version: v2.16.0

      - name: Verify release configuration
        run: |
          bash hack/test-cli-release-contract.sh
          bash hack/test-find-github-release.sh
          bash hack/test-verify-release-archives.sh

      # Exercises the artifact for the runner's own platform (linux/amd64 on
      # ubuntu-latest). Avoids mapfile: macOS ships bash 3.2.
      - name: Build and exercise host-platform CLI
        shell: bash
        run: |
          set -euo pipefail
          goreleaser build --snapshot --clean --id cli
          goos="$(go env GOOS)"
          goarch="$(go env GOARCH)"
          cli_paths="$(
            jq -r --arg goos "$goos" --arg goarch "$goarch" '.[] | select(
              .type == "Binary" and
              .name == "paprika" and
              .goos == $goos and
              .goarch == $goarch
            ) | .path' .goreleaser-dist/artifacts.json
          )"
          cli_count="$(grep -c . <<<"$cli_paths" || true)"
          if [[ "$cli_count" -ne 1 ]]; then
            printf 'expected exactly one %s/%s CLI artifact, found %s\n' "$goos" "$goarch" "$cli_count" >&2
            exit 1
          fi
          cli="$cli_paths"
          test -x "$cli"
          "$cli" version
          "$cli" login --help
          "$cli" status --help
          "$cli" version --help
          help_output="$($cli --help)"
          grep -Eq '(^|[[:space:]])login([[:space:]]|$)' <<<"$help_output"
          grep -Eq '(^|[[:space:]])status([[:space:]]|$)' <<<"$help_output"
          grep -Eq '(^|[[:space:]])version([[:space:]]|$)' <<<"$help_output"

  distribution-contracts:
    name: Distribution entrypoint contracts
    runs-on: ${{ fromJSON(!github.event.pull_request.head.repo.fork && vars.CUTTLEFISH_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reclaim self-hosted runner disk
        uses: ./.github/actions/reclaim-runner-disk

      - name: Install Task
        uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3 # v1
        with:
          version: 3.52.0

      - name: Verify distribution entrypoints
        run: |
          bash hack/test-cli-install.sh
          bash hack/test-taskfile-contract.sh
          bash hack/test-landing-install.sh

  fleet-ui-smoke:
    name: Fleet console browser smoke
    runs-on: ${{ fromJSON(!github.event.pull_request.head.repo.fork && vars.CUTTLEFISH_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reclaim self-hosted runner disk
        uses: ./.github/actions/reclaim-runner-disk

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci
        working-directory: ui

      - name: Build compiled UI
        run: npm run build
        working-directory: ui

      - name: Build real fleet fixture
        run: go build -o bin/fleet-console-fixture ./test/fleetconsole

      - name: Install Chromium
        shell: bash
        run: |
          # --with-deps installs system packages through apt (Linux only).
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi
        working-directory: ui

      - name: Run real fleet console smoke
        run: npm run test:e2e -- fleet-console.spec.ts
        working-directory: ui

      - name: Upload browser diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fleet-ui-smoke
          path: |
            ui/playwright-report
            ui/test-results
          if-no-files-found: ignore
          retention-days: 14

  fleet-scale:
    name: Controlled fleet scale gate
    # Hosted: the gate requires a linux/amd64 Docker server.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run controlled linux amd64 scale gate
        run: bash hack/test-fleet-scale.sh

      - name: Upload fleet scale evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fleet-scale
          path: artifacts/fleet-scale
          if-no-files-found: warn
          retention-days: 30

  cluster-integration:
    name: Kind and Helm integration
    # Hosted: installs kind-linux-amd64 with sudo and builds the full image.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMG: controller:latest
      KIND_SHA256: 50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Helm
        uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42 # v5
        with:
          version: v3.21.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build manager image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: controller:latest
          cache-from: type=gha,scope=paprika-cluster-integration
          cache-to: type=gha,mode=max,scope=paprika-cluster-integration

      - name: Install kind
        run: |
          kind_binary="kind-linux-amd64"
          kind_url="https://kind.sigs.k8s.io/dl/v0.32.0/${kind_binary}"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "${kind_binary}" "${kind_url}"
          printf '%s  %s\n' "${KIND_SHA256}" "${kind_binary}" | sha256sum --check -
          sudo install -m 0755 "${kind_binary}" /usr/local/bin/kind

      - name: Create kind cluster
        run: kind create cluster --name paprika-ci-integration

      - name: Load manager image
        run: kind load docker-image "${IMG}" --name paprika-ci-integration

      - name: Verify split-plane metrics wiring
        run: bash hack/test-split-metrics.sh

      - name: Deploy manager via Helm
        run: make helm-deploy

      - name: Check Helm release status
        run: make helm-status

      - name: Wait for controller-manager
        run: kubectl wait --for=condition=available deployment/paprika-controller-manager -n paprika-system --timeout=120s

      - name: Dump cluster diagnostics on failure
        if: ${{ failure() }}
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -n paprika-system --sort-by=.lastTimestamp || true
          kubectl describe deploy,pods -n paprika-system || true
          kubectl logs -n paprika-system deploy/paprika-controller-manager --tail=80 || true
          kubectl logs -n paprika-system deploy/paprika-controller-manager --tail=80 --previous || true
          kubectl get crd | grep paprika || true

      - name: Cleanup kind cluster
        if: ${{ always() }}
        run: kind delete cluster --name paprika-ci-integration

  publish:
    name: Publish image
    # Hosted: pushes a linux/amd64 image with packages: write.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build-push.outputs.digest }}
    needs:
      - go-test
      - go-lint
      - ui
      - generated
      - chart
      - release-contract
      - distribution-contracts
      - fleet-ui-smoke
      - fleet-scale
      - cluster-integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            # CI images aren't release builds — stamp a dev semver plus the
            # commit so GetSystemStatus/paprika_build_info still answer
            # "which build is this" unambiguously.
            VERSION=0.0.0-dev+sha.${{ github.sha }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          tags: |
            ghcr.io/paprikacd/paprika:latest
            ghcr.io/paprikacd/paprika:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vke:
    name: Deploy published image to VKE
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-vke.yml
    with:
      image_ref: ghcr.io/paprikacd/paprika@${{ needs.publish.outputs.digest }}
    secrets:
      VKE_AUTH_TOKEN_SECRET: ${{ secrets.VKE_AUTH_TOKEN_SECRET }}
      VKE_BASIC_PASSWORD_HASH: ${{ secrets.VKE_BASIC_PASSWORD_HASH }}
      VKE_OIDC_CLIENT_ID: ${{ secrets.VKE_OIDC_CLIENT_ID }}
      VKE_OIDC_CLIENT_SECRET: ${{ secrets.VKE_OIDC_CLIENT_SECRET }}
