name: Deploy Landing and Chart Showcase to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "landing/**"
      - "labs/widget-lab/**"
      - "ui/src/features/insights/**"
      - "hack/build-landing-with-charts.sh"
      - "hack/verify-landing-charts.mjs"
      - ".github/workflows/gh-pages.yml"
  pull_request:
    paths:
      - "landing/**"
      - "labs/widget-lab/**"
      - "ui/src/features/insights/**"
      - "hack/build-landing-with-charts.sh"
      - "hack/verify-landing-charts.mjs"
      - ".github/workflows/gh-pages.yml"
  repository_dispatch:
    types: [publish-pages]

concurrency:
  group: publish-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    name: Verify and publish landing and chart showcase
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: labs/widget-lab/package-lock.json
      - name: Install chart gallery dependencies
        run: npm ci --prefix labs/widget-lab --no-audit --no-fund
      - name: Assemble and verify public landing
        run: bash hack/build-landing-with-charts.sh "$RUNNER_TEMP/paprika-pages"
      - name: Publish verified static site
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ runner.temp }}/paprika-pages
          publish_branch: gh-pages
          full_commit_message: "landing: publish Paprika charts and product content [skip ci]"
