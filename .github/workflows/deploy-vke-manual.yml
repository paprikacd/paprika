name: Deploy VKE Manual

on:
  repository_dispatch:
    types: [deploy-vke]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy requested image to VKE
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-vke.yml
    with:
      image_ref: ${{ github.event.client_payload.image_ref }}
