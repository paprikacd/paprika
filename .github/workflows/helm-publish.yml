name: Publish Helm Chart

on:
  push:
    paths:
      - "charts/chart/**"
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: "Chart version to publish (e.g., 0.1.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42 # v5
        with:
          version: v3.21.2

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            printf 'version=%s\n' "${REQUESTED_VERSION}" >> "${GITHUB_OUTPUT}"
          else
            chart_version="$(awk '/^version:/ { print $2; exit }' charts/chart/Chart.yaml)"
            printf 'version=%s\n' "${chart_version}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Package chart
        env:
          CHART_VERSION: ${{ steps.version.outputs.version }}
        run: |
          helm package charts/chart \
            --destination .dist/ \
            --version "${CHART_VERSION}" \
            --app-version "${CHART_VERSION}"

      - name: Push to OCI registry
        env:
          CHART_VERSION: ${{ steps.version.outputs.version }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | helm registry login ghcr.io \
            --username "${GHCR_USERNAME}" \
            --password-stdin
          helm push ".dist/paprika-${CHART_VERSION}.tgz" \
            oci://ghcr.io/paprikacd/charts
