name: Publish Helm Chart

on:
  push:
    paths:
      - "charts/chart/**"
    branches:
      - master
  repository_dispatch:
    types: [publish-helm]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42 # v5
        with:
          version: v3.21.2

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ github.event.client_payload.version }}
        run: |
          if [ "${EVENT_NAME}" = "repository_dispatch" ]; then
            manual_version_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
            if [[ ! "${REQUESTED_VERSION}" =~ ${manual_version_pattern} ]]; then
              echo "::error::client_payload.version must be a safe semantic chart version"
              exit 1
            fi
            printf 'version=%s\n' "${REQUESTED_VERSION}" >> "${GITHUB_OUTPUT}"
          else
            chart_version="$(awk '/^version:/ { print $2; exit }' charts/chart/Chart.yaml)"
            printf 'version=%s\n' "${chart_version}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Lint chart
        run: helm lint charts/chart/

      - name: Render chart
        run: helm template paprika charts/chart/

      - name: Package chart
        env:
          CHART_VERSION: ${{ steps.version.outputs.version }}
        run: |
          helm package charts/chart \
            --destination .dist/ \
            --version "${CHART_VERSION}" \
            --app-version "${CHART_VERSION}"

      - name: Push to OCI registry
        env:
          CHART_VERSION: ${{ steps.version.outputs.version }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | helm registry login ghcr.io \
            --username "${GHCR_USERNAME}" \
            --password-stdin
          helm push ".dist/paprika-${CHART_VERSION}.tgz" \
            oci://ghcr.io/paprikacd/charts
