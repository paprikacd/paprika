name: Deploy Cloud Run Dev

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: 'Published Paprika image digest reference'
        required: true
        type: string

concurrency: deploy-cloudrun-dev

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy API server to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE_REFERENCE: ${{ inputs.image_ref }}
    steps:
      - name: Clone the code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate image reference
        run: |
          if [[ ! "${IMAGE_REFERENCE}" =~ ^ghcr\.io/paprikacd/paprika@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::image_ref must be ghcr.io/paprikacd/paprika@sha256 followed by exactly 64 lowercase hexadecimal characters"
            exit 1
          fi

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - id: gke-info
        name: Discover GKE API endpoint
        env:
          GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
          GKE_CLUSTER_ZONE: ${{ vars.GKE_CLUSTER_ZONE }}
          GKE_CLUSTER_PROJECT: ${{ vars.GKE_CLUSTER_PROJECT }}
        run: |
          endpoint="$(gcloud container clusters describe "${GKE_CLUSTER_NAME}" \
            --zone "${GKE_CLUSTER_ZONE}" \
            --project "${GKE_CLUSTER_PROJECT}" \
            --format 'value(endpoint)')"
          printf 'endpoint=https://%s:443\n' "${endpoint}"
          printf 'endpoint=https://%s:443\n' "${endpoint}" >> "${GITHUB_OUTPUT}"

      - name: Deploy to Cloud Run
        env:
          K8S_API_SERVER: ${{ steps.gke-info.outputs.endpoint }}
          CLOUDRUN_REGION: ${{ vars.CLOUDRUN_REGION }}
          CLOUDRUN_SA: ${{ vars.CLOUDRUN_SA }}
        run: |
          gcloud run deploy paprika-api-dev \
            --image="${IMAGE_REFERENCE}" \
            --args="--mode=api,--k8s-api-server=${K8S_API_SERVER}" \
            --region="${CLOUDRUN_REGION}" \
            --service-account="${CLOUDRUN_SA}" \
            --allow-unauthenticated \
            --cpu=1 \
            --memory=256Mi \
            --min-instances=0 \
            --max-instances=5
