version: 2

project_name: paprika

dist: .goreleaser-dist

builds:
  - id: cli
    main: ./cmd/paprika
    binary: paprika
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
  - id: server
    main: ./cmd
    binary: paprika-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64

dockers:
  - ids:
      - server
    goos: linux
    goarch: amd64
    image_templates:
      - "ghcr.io/paprikacd/paprika:{{ .Version }}"
    dockerfile: Dockerfile.goreleaser
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title=paprika"
      - "--label=org.opencontainers.image.description=Kubernetes-native application delivery platform"
      - "--label=org.opencontainers.image.url=https://github.com/paprikacd/paprika"
      - "--label=org.opencontainers.image.source=https://github.com/paprikacd/paprika"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"

archives:
  - ids:
      - cli
    formats: [tar.gz]
    name_template: "paprika_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - none*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Version }}-next"

changelog:
  use: github
  filters:
    include:
      - "^feat:"
      - "^fix:"
      - "^perf:"
      - "^refactor:"
      - "^docs:"
  groups:
    - title: Features
      regexp: "^.*feat[^:]*:.*$"
      order: 0
    - title: Bug fixes
      regexp: "^.*fix[^:]*:.*$"
      order: 1
    - title: Performance
      regexp: "^.*perf[^:]*:.*$"
      order: 2
    - title: Refactoring
      regexp: "^.*refactor[^:]*:.*$"
      order: 3
    - title: Documentation
      regexp: "^.*docs[^:]*:.*$"
      order: 4
    - title: Other changes
      order: 999

release:
  draft: true
  github:
    owner: paprikacd
    name: paprika
  header: |
    ## Paprika {{ .Version }}

    {{ .Changelog }}

    ### Installation

    ```bash
    # CLI
    curl -fsSL https://raw.githubusercontent.com/paprikacd/paprika/master/install.sh | sh

    # Helm
    helm repo add paprika https://paprikacd.github.io/paprika
    helm install paprika paprika/paprika --namespace paprika-system --create-namespace
    ```

    Verify downloaded CLI archives with the canonical
    [checksums.txt](https://github.com/paprikacd/paprika/releases/download/{{ .Tag }}/checksums.txt)
    asset before installation.
  footer: |
    **Full Changelog**: https://github.com/paprikacd/paprika/compare/{{ .PreviousTag }}...{{ .Tag }}

    ---

    _Built with 💜 by the Paprika team_
